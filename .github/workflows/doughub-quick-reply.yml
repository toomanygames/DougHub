name: Build DougHub Quick Reply for Windows

on:
  push:
    paths:
      - "DougHubQuickReply/**"
      - ".github/workflows/doughub-quick-reply.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: DougHubQuickReply/package.json
      - name: Install dependencies
        working-directory: DougHubQuickReply
        run: npm install
      - name: Build Windows installer
        working-directory: DougHubQuickReply
        run: npm run dist
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: DougHub-Quick-Reply-Windows
          path: DougHubQuickReply/dist/*.exe
          if-no-files-found: error
          retention-days: 30
