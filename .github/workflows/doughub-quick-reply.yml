name: Build DougHub Quick Reply for Windows

on:
  push:
    paths:
      - "DougHubQuickReply/**"
      - ".github/workflows/doughub-quick-reply.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: DougHubQuickReply/package.json
      - name: Set unique app version for the updater
        working-directory: DougHubQuickReply
        run: node -e "const fs=require('fs'); const p=require('./package.json'); p.version='1.0.'+process.env.GITHUB_RUN_NUMBER; fs.writeFileSync('package.json', JSON.stringify(p,null,2))"
      - name: Install dependencies
        working-directory: DougHubQuickReply
        run: npm install
      - name: Build Windows installer
        working-directory: DougHubQuickReply
        run: npm run dist
      - name: Create stable latest-download filename
        working-directory: DougHubQuickReply
        run: Copy-Item "dist\\DougHub-Quick-Reply-Setup-1.0.$env:GITHUB_RUN_NUMBER.exe" "dist\\DougHub-Quick-Reply-Setup.exe"
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: DougHub-Quick-Reply-Windows
          path: DougHubQuickReply/dist/*.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish easy-download release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: quick-reply-build-${{ github.run_number }}
          name: DougHub Quick Reply Build ${{ github.run_number }}
          files: DougHubQuickReply/dist/*.exe
          make_latest: true
