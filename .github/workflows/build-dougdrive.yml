name: Build DougDrive Windows

on:
  push:
    paths:
      - "DougDrive/**"
      - ".github/workflows/build-dougdrive.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build DougDrive
        run: pyinstaller --noconfirm --clean --onefile --windowed --name DougDrive DougDrive/DougDrive.py

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist/DougDrive.exe release/DougDrive.exe
          Copy-Item DougDrive/run-dougdrive.bat release/run-dougdrive.bat

      - name: Upload DougDrive
        uses: actions/upload-artifact@v4
        with:
          name: DougDrive-Windows
          path: release/
