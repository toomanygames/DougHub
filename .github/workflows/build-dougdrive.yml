name: Build DougDrive Windows

on:
  push:
    paths:
      - "DougDrive/**"
      - ".github/workflows/build-dougdrive.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build DougDrive EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name DougDrive DougDrive/DougDrive.py
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build DougDrive Setup
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          & "C:Program Files (x86)Inno Setup 6ISCC.exe" DougDriveDougDrive.iss
          Copy-Item distDougDrive.exe releaseDougDrive.exe
          Copy-Item DougDriveun-dougdrive.bat releaseun-dougdrive.bat
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: DougDrive-Windows-Installer
          path: "release/DougDrive Setup.exe"
      - name: Upload portable files
        uses: actions/upload-artifact@v4
        with:
          name: DougDrive-Windows-Portable
          path: release/