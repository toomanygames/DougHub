name: Deploy DougHub to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_run:
    workflows: ["Build DougDrive Windows"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Add DougDrive installer
        shell: bash
        run: |
          mkdir -p "DougDrive"
          curl -fL --retry 3 "https://github.com/toomanygames/DougHub/releases/latest/download/DougDrive%20Setup.exe" -o "DougDrive/DougDrive Setup.exe"
          test -s "DougDrive/DougDrive Setup.exe"

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
