name: Dead Town checks

on:
  push:
    branches:
      - feature/doughub-game-asset-importer
    paths:
      - "Scripting/scripting.js"
      - "Scripting/tests/dead-town-check.cjs"
      - ".github/workflows/dead-town-check.yml"
  pull_request:
    paths:
      - "Scripting/scripting.js"
      - "Scripting/tests/dead-town-check.cjs"
      - ".github/workflows/dead-town-check.yml"

jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate Game Creator and Dead Town JavaScript
        run: node Scripting/tests/dead-town-check.cjs
