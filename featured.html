<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050611">
<title>DougHub</title>
<link rel="icon" href="DougHub.svg" type="image/svg+xml">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0}
body{overflow:hidden;background:radial-gradient(ellipse at 8% 0%,#3933a64a,transparent 38%),radial-gradient(ellipse at 92% 12%,#7e22ce30,transparent 34%),radial-gradient(ellipse at 50% 100%,#312e8140,transparent 42%),#050611;font-family:system-ui,sans-serif}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.16;background-image:linear-gradient(#8586ff0c 1px,transparent 1px),linear-gradient(90deg,#8586ff0c 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(to bottom,black,transparent 90%)}
.slider{position:relative;width:min(1320px,calc(100vw - 48px));height:min(520px,calc(100vh - 48px));min-height:240px;margin:24px auto;overflow:hidden;border-radius:26px}
.track{display:flex;width:100%;height:100%;transition:transform .8s cubic-bezier(.22,.75,.2,1);will-change:transform}
.pair{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:repeat(2,minmax(0,1fr));gap:14px;flex:0 0 100%;min-width:0;height:100%}
.visual{position:relative;min-width:0;overflow:hidden;border:1px solid #ffffff18;border-radius:24px;background:radial-gradient(ellipse at 75% 28%,var(--glow),transparent 48%),linear-gradient(135deg,var(--surface),#090b19 82%);box-shadow:0 22px 80px #0003,inset 0 1px #ffffff0b}
.visual:before,.visual:after{content:"";position:absolute;aspect-ratio:1;border-radius:50%;pointer-events:none}
.visual:before{width:76%;right:-22%;top:-26%;border:1px solid color-mix(in srgb,var(--accent) 38%,transparent);box-shadow:0 0 0 24px color-mix(in srgb,var(--accent) 5%,transparent),0 0 0 58px color-mix(in srgb,var(--accent) 4%,transparent),0 0 0 100px color-mix(in srgb,var(--accent) 3%,transparent)}
.visual:after{width:48%;left:-17%;bottom:-26%;background:radial-gradient(circle,var(--glow),transparent 68%);filter:blur(12px);opacity:.75}
.visual .orb{position:absolute;width:38%;aspect-ratio:1;left:31%;top:30%;border-radius:32%;transform:rotate(28deg);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);background:linear-gradient(145deg,color-mix(in srgb,var(--accent) 22%,transparent),#ffffff03);box-shadow:0 0 90px color-mix(in srgb,var(--accent) 15%,transparent),inset 0 1px #ffffff25}
.visual .orb:before,.visual .orb:after{content:"";position:absolute;inset:14%;border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:28%;transform:rotate(32deg)}
.visual .orb:after{inset:28%;transform:rotate(35deg);background:color-mix(in srgb,var(--accent) 10%,transparent)}
@media(max-width:650px){.slider{width:calc(100vw - 24px);height:calc(100vh - 24px);margin:12px auto}.pair{gap:10px}.visual{border-radius:17px}.visual .orb{width:34%;left:33%;top:33%}}
@media(prefers-reduced-motion:reduce){.track{transition:none}}
</style>
</head>
<body>
<main class="slider" aria-label="Visual carousel">
<div class="track" id="track">
<section class="pair" aria-hidden="true">
<div class="visual" style="--accent:#818cf8;--glow:#6366f155;--surface:#141632"><i class="orb"></i></div>
<div class="visual" style="--accent:#c084fc;--glow:#a855f755;--surface:#1a1029"><i class="orb"></i></div>
</section>
<section class="pair" aria-hidden="true">
<div class="visual" style="--accent:#67e8f9;--glow:#0891b255;--surface:#0d202b"><i class="orb"></i></div>
<div class="visual" style="--accent:#a5b4fc;--glow:#4f46e555;--surface:#11152d"><i class="orb"></i></div>
</section>
<section class="pair" aria-hidden="true">
<div class="visual" style="--accent:#f0abfc;--glow:#c026d355;--surface:#241129"><i class="orb"></i></div>
<div class="visual" style="--accent:#6ee7b7;--glow:#05966955;--surface:#0d211e"><i class="orb"></i></div>
</section>
<section class="pair" aria-hidden="true">
<div class="visual" style="--accent:#fcd34d;--glow:#d9770655;--surface:#241b10"><i class="orb"></i></div>
<div class="visual" style="--accent:#93c5fd;--glow:#2563eb55;--surface:#101b31"><i class="orb"></i></div>
</section>
</div>
</main>
<script>
(()=>{const track=document.getElementById('track');const slides=track.children.length;let index=0;const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;if(!reduced)setInterval(()=>{index=(index+1)%slides;track.style.transform='translateX(-'+(index*100)+'%)'},3000)})();
</script>
</body>
</html>
