<!doctype html><html lang="en"><head>
<script>(function(){try{var l=new URLSearchParams(location.search).get("lang")||localStorage.getItem("dh-lang")||"en";if(l&&l!=="en"&&/^[a-z]{2}$/.test(l)){document.write('<script src="../i18n/packs/crystal-merge.'+l+'.js"><\/script><script src="../i18n/engine.js"><\/script>')}}catch(e){}})()</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Crystal Merge</title>
<style>
:root{--ui:"SF Pro Rounded","Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,Roboto,"Noto Sans","Hiragino Sans","Yu Gothic UI",sans-serif;--ink:#4a3f6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:var(--ui);color:var(--ink);user-select:none;touch-action:manipulation}
body{background:radial-gradient(900px 600px at 15% 0,#ffe3f1 0,transparent 60%),radial-gradient(800px 600px at 100% 100%,#d9e4ff 0,transparent 55%),#f7f3ff}
button{font:inherit;cursor:pointer;border:0}button:active{transform:translateY(2px) scale(.98)}
#wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.4vmin}
#top{display:flex;gap:2vmin;align-items:center;width:min(86vmin,520px);justify-content:space-between}
#top h1{margin:0;font-size:max(20px,4.6vmin);line-height:1;font-weight:900;letter-spacing:-.03em;background:linear-gradient(90deg,#ff7ab6,#8b7bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.box{background:#fff;border-radius:16px;padding:1vmin 2.4vmin;font-size:max(10px,1.6vmin);font-weight:800;letter-spacing:.1em;text-align:center;color:#9a8fc4;box-shadow:0 6px 18px #8b7bff22}
.box b{display:block;font-size:max(18px,3.2vmin);color:var(--ink);margin-top:.2vmin;letter-spacing:0}
#board{position:relative;width:min(86vmin,520px);aspect-ratio:1;background:rgba(255,255,255,.7);border-radius:28px;padding:2%;box-shadow:0 24px 60px -18px #8b7bff66,inset 0 0 0 2px #fff;backdrop-filter:blur(10px)}
.cell{position:absolute;background:#eee9fb;border-radius:18px;width:22.5%;height:22.5%}
.tile{position:absolute;width:22.5%;height:22.5%;display:flex;align-items:center;justify-content:center;border-radius:18px;font-weight:900;font-size:clamp(14px,5.6vmin,34px);transition:left .12s ease-out,top .12s ease-out;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.12);box-shadow:0 8px 16px -6px rgba(80,60,160,.35),inset 0 2px 0 rgba(255,255,255,.55),inset 0 -4px 0 rgba(0,0,0,.08)}
.tile::after{content:"";position:absolute;left:12%;top:9%;width:34%;height:12%;border-radius:99px;background:rgba(255,255,255,.55);transform:rotate(-12deg)}
.tile.pop{animation:pop .2s}.tile.new{animation:nw .18s}
@keyframes pop{50%{transform:scale(1.16)}}@keyframes nw{from{transform:scale(.2);opacity:0}}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.4vmin;background:rgba(247,243,255,.9);backdrop-filter:blur(8px);text-align:center;padding:4vmin;z-index:5}
.ov[hidden]{display:none}.ov h2{margin:0;font-size:max(26px,6vmin);font-weight:900;letter-spacing:-.03em;background:linear-gradient(90deg,#ff7ab6,#8b7bff);-webkit-background-clip:text;background-clip:text;color:transparent}
p{margin:0;font-size:max(14px,2.1vmin);line-height:1.55;color:#7a6fa6;max-width:46ch;font-weight:600}
button.b{font-size:max(14px,2.1vmin);font-weight:800;padding:1.4vmin 3vmin;border-radius:99px;background:linear-gradient(90deg,#ff7ab6,#8b7bff);color:#fff;box-shadow:0 10px 22px -8px #8b7bffaa}
button.b.alt{background:#fff;color:#8b7bff;box-shadow:0 6px 16px -8px #8b7bff66}
#bar{display:flex;gap:2vmin}
#mute{position:absolute;top:8px;right:10px;padding:7px 12px;font-size:11px;font-weight:800;background:#fff;color:#8b7bff;border-radius:99px;box-shadow:0 4px 12px #8b7bff33}
</style></head><body>
<div id="wrap">
<div id="top"><h1>CRYSTAL<br>MERGE</h1><div class="box">SCORE<b id="sc">0</b></div><div class="box">BEST<b id="bs">0</b></div></div>
<div id="board"></div>
<div id="bar"><button class="b alt" id="undo" type="button">UNDO</button><button class="b" id="new" type="button">NEW GAME</button></div>
<p>ARROWS / SWIPE = SLIDE. MERGE EQUAL CRYSTALS TO MAKE 2048.</p>
</div>
<button id="mute" type="button">SOUND ON</button>
<div class="ov" id="over" hidden><h2 id="oT">GAME OVER</h2><p id="oM"></p><div id="bar2" style="display:flex;gap:2vmin"><button class="b alt" id="keep" type="button" hidden>KEEP GOING</button><button class="b" id="again" type="button">PLAY AGAIN</button></div></div>
<script>
(function(){
"use strict";
var MUTE=new URLSearchParams(location.search).get("mute")==="1",N=4,$=function(i){return document.getElementById(i)};
var store={get:function(k,d){try{var v=localStorage.getItem("cm-"+k);return v===null?d:+v}catch(e){return d}},set:function(k,v){try{localStorage.setItem("cm-"+k,v)}catch(e){}}};
var best=store.get("best",0),soundOn=!MUTE&&store.get("snd",1)===1,music=null,ac=null;
function beep(f,d){if(!soundOn)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();var o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.type="triangle";o.frequency.value=f;g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d)}catch(e){}}
function startMusic(){if(!soundOn||MUTE)return;if(!music){music=new Audio("../assets/music/calm_innocence.ogg");music.loop=true;music.volume=.22}music.play().catch(function(){})}
function setSnd(){$("mute").textContent=soundOn?"SOUND ON":"SOUND OFF";store.set("snd",soundOn?1:0);if(soundOn)startMusic();else if(music)music.pause()}
$("mute").onclick=function(){soundOn=!soundOn;setSnd()};
var COL={2:"linear-gradient(145deg,#7cc7ff,#5aa2f5)",4:"linear-gradient(145deg,#6fe0cf,#3fc2b0)",8:"linear-gradient(145deg,#8be88f,#52c95f)",16:"linear-gradient(145deg,#d3ee6e,#a8d33f)",32:"linear-gradient(145deg,#ffd86b,#f6b73c)",64:"linear-gradient(145deg,#ffb06b,#f58a3c)",128:"linear-gradient(145deg,#ff8a9a,#f2566f)",256:"linear-gradient(145deg,#ff7ab6,#e04a9a)",512:"linear-gradient(145deg,#c28bff,#9a5cf0)",1024:"linear-gradient(145deg,#8b9bff,#5f6df0)",2048:"linear-gradient(145deg,#ffe98a,#ffb938)"};
var grid,score,hist,won,keep,tiles={},nid=1;
var bd=$("board");
for(var i=0;i<16;i++){var c=document.createElement("div");c.className="cell";c.style.left=(2+(i%4)*24.5)+"%";c.style.top=(2+Math.floor(i/4)*24.5)+"%";bd.appendChild(c)}
function pos(r,c){return {left:(2+c*24.5)+"%",top:(2+r*24.5)+"%"}}
function empty(){var e=[];for(var r=0;r<N;r++)for(var c=0;c<N;c++)if(!grid[r][c])e.push([r,c]);return e}
function spawn(){var e=empty();if(!e.length)return;var p=e[Math.random()*e.length|0];grid[p[0]][p[1]]={v:Math.random()<.9?2:4,id:nid++,fresh:1}}
function render(){var seen={};
  for(var r=0;r<N;r++)for(var c=0;c<N;c++){var t=grid[r][c];if(!t)continue;seen[t.id]=1;var el=tiles[t.id];
    if(!el){el=document.createElement("div");el.className="tile"+(t.fresh?" new":"");bd.appendChild(el);tiles[t.id]=el}
    var p=pos(r,c);el.style.left=p.left;el.style.top=p.top;el.textContent=t.v;el.style.background=COL[t.v]||"linear-gradient(145deg,#444,#222)";
    el.style.fontSize=t.v>=1024?"clamp(12px,4.2vmin,26px)":t.v>=128?"clamp(13px,4.8vmin,30px)":"";
    if(t.pop){el.classList.remove("pop");void el.offsetWidth;el.classList.add("pop");t.pop=0}t.fresh=0}
  for(var id in tiles)if(!seen[id]){var d=tiles[id];delete tiles[id];setTimeout(function(x){return function(){x.remove()}}(d),130)}
  $("sc").textContent=score;$("bs").textContent=best}
function snap(){return JSON.stringify({g:grid.map(function(r){return r.map(function(t){return t&&{v:t.v,id:t.id}})}),s:score})}
function newGame(){Object.keys(tiles).forEach(function(k){tiles[k].remove()});tiles={};grid=[];for(var r=0;r<N;r++)grid.push([null,null,null,null]);score=0;hist=[];won=false;keep=false;$("over").hidden=true;spawn();spawn();render();startMusic()}
function slideLine(line){/* line = tiles in move order (toward index 0); returns {out,gain,moved} */
  var t=line.filter(Boolean),out=[],gain=0;for(var i=0;i<t.length;i++){if(i+1<t.length&&t[i].v===t[i+1].v){var m={v:t[i].v*2,id:t[i].id,pop:1};gain+=m.v;/* second tile removed */out.push(m);i++}else out.push(t[i])}
  while(out.length<N)out.push(null);return {out:out,gain:gain}}
function move(dir){/* 0 left,1 up,2 right,3 down */
  var before=snap(),moved=false,gain=0,nw=[];for(var r=0;r<N;r++)nw.push([null,null,null,null]);
  for(var a=0;a<N;a++){var line=[];for(var b=0;b<N;b++){var r=dir===0||dir===2?a:(dir===1?b:N-1-b),c=dir===1||dir===3?a:(dir===0?b:N-1-b);line.push(grid[r][c])}
    var res=slideLine(line);gain+=res.gain;for(var b2=0;b2<N;b2++){var r2=dir===0||dir===2?a:(dir===1?b2:N-1-b2),c2=dir===1||dir===3?a:(dir===0?b2:N-1-b2);nw[r2][c2]=res.out[b2];var o=line[b2],n=res.out[b2];if((o&&!n)||(o&&n&&o.id!==n.id)||(!o&&n))moved=true}}
  if(!moved)return;
  hist.push(before);if(hist.length>20)hist.shift();grid=nw;score+=gain;if(score>best){best=score;store.set("best",best)}
  if(gain)beep(300+Math.min(500,Math.log2(gain)*60),.12);else beep(180,.04);
  spawn();render();
  var mx=0;grid.forEach(function(r){r.forEach(function(t){if(t&&t.v>mx)mx=t.v})});
  if(mx>=2048&&!won&&!keep){won=true;setTimeout(function(){report();$("oT").textContent="YOU MADE 2048!";$("oM").textContent="SCORE "+score;$("keep").hidden=false;$("over").hidden=false},300)}
  else if(!canMove()){setTimeout(function(){report();$("oT").textContent="GAME OVER";$("oM").textContent="SCORE "+score+" · BEST "+best;$("keep").hidden=true;$("over").hidden=false},350)}}
function report(){try{parent.postMessage({dh:"score",game:"crystal-merge",score:score},"*")}catch(e){}}
function canMove(){if(empty().length)return true;for(var r=0;r<N;r++)for(var c=0;c<N;c++){var v=grid[r][c].v;if(c+1<N&&grid[r][c+1].v===v||r+1<N&&grid[r+1][c].v===v)return true}return false}
function undo(){if(!hist.length)return;var s=JSON.parse(hist.pop());Object.keys(tiles).forEach(function(k){tiles[k].remove()});tiles={};grid=s.g.map(function(r){return r.map(function(t){return t&&{v:t.v,id:t.id}})});score=s.s;$("over").hidden=true;render()}
var KD={ArrowLeft:0,KeyA:0,ArrowUp:1,KeyW:1,ArrowRight:2,KeyD:2,ArrowDown:3,KeyS:3};
addEventListener("keydown",function(e){if(e.code in KD){e.preventDefault();if($("over").hidden)move(KD[e.code]);startMusic()}else if(e.code==="KeyZ")undo();else if(e.code==="KeyM"){soundOn=!soundOn;setSnd()}});
var sx,sy;addEventListener("touchstart",function(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY;startMusic()},{passive:true});
addEventListener("touchmove",function(e){e.preventDefault()},{passive:false});
addEventListener("touchend",function(e){var t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;if($("over").hidden)move(Math.abs(dx)>Math.abs(dy)?(dx<0?0:2):(dy<0?1:3))},{passive:true});
$("undo").onclick=undo;$("new").onclick=newGame;$("again").onclick=newGame;$("keep").onclick=function(){keep=true;$("over").hidden=true};
$("mute").textContent=soundOn?"SOUND ON":"SOUND OFF";
newGame();
window.__cm={move:move,get grid(){return grid},get score(){return score},set:function(g){grid=g;render()}};
})();
</script></body></html>
