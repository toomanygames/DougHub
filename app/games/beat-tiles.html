.ov{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2vmin;background:rgba(4,6,16,.84);text-align:center;padding:4vmin}
.ov[hidden]{display:none}

function nowT(){return ac.currentTime-S.t0-(ac.outputLatency||ac.baseLatency||0)*.5}

  g.textAlign="left";g.fillStyle="#fff";g.font="800 16px "+getComputedStyle(document.body).fontFamily;g.shadowColor="#ff2fb9";g.shadowBlur=10;g.fillText("SCORE "+Math.floor(S.score),16,26);g.textAlign="right";g.fillText("COMBO "+S.combo+(S.combo>=20?"  x"+(1+Math.min(3,Math.floor(S.combo/20))):""),VW-16,26);g.shadowBlur=0;g.textAlign="center";

  g.fillStyle="#fff";g.globalAlpha=.3;g.fillRect(16,VH-8,VW-32,4);g.globalAlpha=.9;g.fillRect(16,VH-8,(VW-32)*Math.max(0,Math.min(1,now/CH.len)),4);g.globalAlpha=1;
  if(now<0){g.fillStyle="#fff";g.font="italic 800 22px "+getComputedStyle(document.body).fontFamily;g.fillText("GET READY",VW/2,260)}
  g.textAlign="left";if(!S.done&&now>CH.len+.8)fin();requestAnimationFrame(draw)}
