.ov{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2vmin;background:rgba(4,6,16,.84);text-align:center;padding:4vmin}
.ov[hidden]{display:none}
.ov h1{margin:0;font-size:max(18px,4.4vmin);line-height:1.4;font-weight:400;color:var(--hi,#ffd23a);text-shadow:3px 3px var(--sh,#b45309)}
.ov p{margin:0;font-size:max(9px,1.6vmin);line-height:1.9;color:#c4cdee;max-width:62ch}
.pb{font-size:max(11px,2vmin);padding:1.6vmin 3vmin;background:var(--btn,#18b3a1);color:var(--btnt,#04141a);box-shadow:inset -4px -4px rgba(0,0,0,.28),inset 4px 4px rgba(255,255,255,.35)}
#mute{position:absolute;top:6px;right:8px;z-index:40;padding:6px 8px;font-size:11px;background:rgba(20,28,60,.9);box-shadow:none}
.hud{position:absolute;top:8px;left:0;right:0;z-index:20;display:flex;justify-content:center;gap:4vmin;font-size:max(9px,1.7vmin);text-shadow:2px 2px #000;pointer-events:none}
.hud b{color:#ffd23a;font-weight:400}

body{background:#0a0620;--hi:#ff7ad9;--sh:#6d1d8f;--btn:#8b5cf6;--btnt:#fff}
#wrap{position:absolute;inset:0;display:flex;justify-content:center}
#cv{height:100%;width:min(100vw,62vh);touch-action:none;background:#0c0828}
.songs{display:flex;flex-direction:column;gap:1.4vmin;width:min(80vw,420px)}
.songs button{padding:1.8vmin;font-size:max(10px,1.9vmin);box-shadow:inset -4px -4px rgba(0,0,0,.3),inset 4px 4px rgba(255,255,255,.3)}
#res b{color:#ffd23a;font-weight:400}
:root{--ui:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,"Noto Sans","Hiragino Sans","Yu Gothic UI",sans-serif}
/* readable body text: pixel font only for titles, buttons and numbers */
.ov p,p{font-family:var(--ui)!important;font-size:max(14px,2.1vmin)!important;line-height:1.55!important;letter-spacing:0!important;color:#d3dbf5;max-width:56ch}
.ov h1{line-height:1.3!important}
.hud,#hud{font-size:max(10px,1.8vmin)!important}
#mute{font-size:11px!important}
.songs button{font-size:max(11px,1.9vmin)!important}
</style></head><body>
<div id="wrap"><canvas id="cv" width="360" height="600"></canvas></div>
<button id="mute" type="button">SOUND ON</button>
<div class="ov" id="title"><h1>BEAT TILES</h1><p>Tap the tiles as they hit the line. Every hit plays a note of the song!</p><p>D F J K / TAP THE LANES</p>
<div class="songs"><button type="button" data-s="0" style="background:#22c55e">SUNRISE · EASY</button><button type="button" data-s="1" style="background:#f59e0b">NEON NIGHTS · MEDIUM</button><button type="button" data-s="2" style="background:#ef4444">OVERDRIVE · HARD</button></div><p id="best"></p></div>
<div class="ov" id="over" hidden><h1 id="oT">SONG CLEAR!</h1><p id="oM"></p><button class="pb" id="again" type="button">CHOOSE SONG</button></div>
<script>/* DougHub game kit: storage, sound, music (CC0 chiptune) and score reporting to the app shell */
var DH = (function () {
  var Q = new URLSearchParams(location.search), MUTE = Q.get("mute") === "1", ac = null, music = null, mu = null, last = 0, pending = null, game = "";
  function $(i) { return document.getElementById(i); }
  function fmt(n) { n = Math.floor(n); if (n < 1e4) return String(n); var u = ["", "K", "M", "B", "T", "Qa", "Qi"], i = 0; while (n >= 1000 && i < u.length - 1) { n /= 1000; i++; } return (n >= 100 ? n.toFixed(0) : n >= 10 ? n.toFixed(1) : n.toFixed(2)).replace(/\.0+$|(\.\d*[1-9])0+$/, "$1") + u[i]; }
  var D = {
    MUTE: MUTE, fmt: fmt, $: $,
    init: function (g) { game = g; D.on = !MUTE && D.get("snd", 1) === 1; if ($("mute")) { $("mute").onclick = function () { D.on = !D.on; D.set("snd", D.on ? 1 : 0); D.paint(); if (D.on) D.music(mu); else if (music) music.pause(); }; D.paint(); }
      addEventListener("pagehide", D.flush); document.addEventListener("visibilitychange", function () { if (document.hidden) D.flush(); }); },
    paint: function () { if ($("mute")) $("mute").textContent = D.on ? "SOUND ON" : "SOUND OFF"; },
    get: function (k, d) { try { var v = localStorage.getItem(game + "-" + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(game + "-" + k, JSON.stringify(v)); } catch (e) {} },
    sfx: function (f, d, type, v) { if (!D.on) return; try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); var o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime; o.type = type || "square"; o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(Math.max(40, f * (type === "triangle" ? 1.5 : .5)), t + d); g.gain.setValueAtTime(v || .04, t); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d + .02); } catch (e) {} },
    ctx: function () { try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === "suspended") ac.resume(); } catch (e) {} return ac; },
    music: function (url, vol) { mu = url || mu; if (!D.on || MUTE || !mu) return; if (!music) { music = new Audio(mu); music.loop = true; music.volume = vol || .25; } music.play().catch(function () {}); },
    stopMusic: function () { if (music) music.pause(); },
    /* report a score to the DougHub app (leaderboard + daily credits). Throttled; the shell checks you are signed in. */
    score: function (n, force) { n = Math.floor(n); if (!(n > 0)) return; var now = Date.now(); if (!force && now - last < 15000) { pending = n; return; } last = now; pending = null; try { parent.postMessage({ dh: "score", game: game, score: n }, "*"); } catch (e) {} },
    flush: function () { if (pending) { D.score(pending, true); } }
  };
  return D;
})();
</script>
<script>
(function(){
"use strict";
DH.init("beat-tiles");var $=DH.$;
var cv=$("cv"),g=cv.getContext("2d"),VW=360,VH=600,HIT=520,SPEED=330;
var SONGS=[{n:"SUNRISE",bpm:96,dens:.45,seed:7,root:261.63,col:"#34d399"},{n:"NEON NIGHTS",bpm:122,dens:.62,seed:21,root:220,col:"#fbbf24"},{n:"OVERDRIVE",bpm:148,dens:.8,seed:99,root:246.94,col:"#f87171"}];
var SC=[0,2,4,7,9,12,14,16];/* major pentatonic-ish semitones */
var LANES=["D","F","J","K"],LCOL=["#38bdf8","#a78bfa","#f472b6","#fbbf24"];
var S=null,ac=null,master=null;
function rng(s){return function(){s=(s*1664525+1013904223)%4294967296;return s/4294967296}}
function nf(root,semi){return root*Math.pow(2,semi/12)}
function build(si){var sg=SONGS[si],r=rng(sg.seed),step=60/sg.bpm/2,steps=16*16,tiles=[],last=-1,motif=[];
  for(var i=0;i<16;i++)motif.push(r()<sg.dens?Math.floor(r()*SC.length):-1);
  for(var s=0;s<steps;s++){var bar=Math.floor(s/16),m=motif[s%16];if(bar%4===3&&r()<.4)m=r()<sg.dens+.1?Math.floor(r()*SC.length):-1;if(bar<1&&s%2)m=-1;
    if(m<0)continue;var lane=m%4;if(lane===last&&r()<.5)lane=(lane+1+Math.floor(r()*3))%4;last=lane;tiles.push({t:s*step,lane:lane,semi:SC[m],hit:0,miss:0})}
  return {sg:sg,step:step,steps:steps,tiles:tiles,len:steps*step}}
function voice(t,f,d,type,v,out){var o=ac.createOscillator(),gn=ac.createGain();o.type=type;o.frequency.value=f;gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(gn);gn.connect(out||master);o.start(t);o.stop(t+d+.02)}
function drum(t,kind){if(kind==="k"){var o=ac.createOscillator(),gn=ac.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+.12);gn.gain.setValueAtTime(.5,t);gn.gain.exponentialRampToValueAtTime(.001,t+.16);o.connect(gn);gn.connect(master);o.start(t);o.stop(t+.18)}
  else{var b=ac.createBuffer(1,2205,44100),d=b.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);var s=ac.createBufferSource(),gn=ac.createGain();s.buffer=b;gn.gain.value=kind==="s"?.22:.08;var f=ac.createBiquadFilter();f.type="highpass";f.frequency.value=kind==="s"?1500:6000;s.connect(f);f.connect(gn);gn.connect(master);s.start(t)}}
var nextStep=0;
function sched(){if(!S||S.done)return;var sg=S.song.sg;while(nextStep<S.song.steps+8&&S.t0+nextStep*S.song.step<ac.currentTime+.25){var t=S.t0+nextStep*S.song.step,s=nextStep%16;
    if(s%4===0)drum(t,"k");if(s%8===4)drum(t,"s");if(s%2===1||sg.bpm>140)drum(t,"h");
    if(s%4===0){var bs=[0,0,-3,-5][Math.floor(nextStep/16)%4];voice(t,nf(sg.root/2,bs),S.song.step*3.6,"sawtooth",.1)}
    if(s===0){var ch=[[0,4,7],[0,4,7],[-3,0,4],[-5,-1,2]][Math.floor(nextStep/16)%4];ch.forEach(function(c){voice(t,nf(sg.root,c),S.song.step*15,"triangle",.045)})}
    nextStep++}}
function start(si){ac=DH.ctx();if(!ac){return}master=ac.createGain();master.gain.value=DH.on?1:0;master.connect(ac.destination);
  var song=build(si);S={song:song,si:si,t0:ac.currentTime+2.2,score:0,combo:0,best:0,perf:0,good:0,miss:0,done:0,fx:[],flash:[0,0,0,0],lastJudge:"",jt:0};nextStep=0;$("title").hidden=true;$("over").hidden=true}
function judge(lane){if(!S||S.done)return;var now=ac.currentTime-S.t0,best=null,bd=9;S.flash[lane]=1;
  S.song.tiles.forEach(function(t){if(t.lane===lane&&!t.hit&&!t.miss){var d=Math.abs(t.t-now);if(d<bd){bd=d;best=t}}});
  if(best&&bd<.16){best.hit=1;var p=bd<.07;S.combo++;S.best=Math.max(S.best,S.combo);var mult=1+Math.min(3,Math.floor(S.combo/10));S.score+=(p?300:100)*mult;if(p)S.perf++;else S.good++;S.lastJudge=p?"PERFECT":"GOOD";S.jt=.5;
    voice(ac.currentTime,nf(S.song.sg.root*2,best.semi),.28,"square",.09);S.fx.push({x:30+lane*75+37,y:HIT,a:1,c:LCOL[lane]})}
  else{voice(ac.currentTime,90,.08,"square",.04);S.combo=0}}
function fin(){S.done=1;var tot=S.song.tiles.length,acc=Math.round((S.perf+S.good*.6)/Math.max(1,tot)*100),gr=acc>=95?"S":acc>=85?"A":acc>=70?"B":acc>=50?"C":"D";S.score=Math.floor(S.score);
  $("oT").textContent=acc>=50?"SONG CLEAR!":"TRY AGAIN";$("oM").innerHTML="SCORE <b>"+S.score+"</b> · GRADE <b>"+gr+"</b> · ACCURACY "+acc+"% · BEST COMBO "+S.best;$("over").hidden=false;
  var key="hs"+S.si,bst=DH.get(key,0);if(S.score>bst)DH.set(key,S.score);DH.score(S.score+(S.si*0),true);setTimeout(function(){},0);paintBest()}
function paintBest(){$("best").textContent="BEST "+[0,1,2].map(function(i){return DH.get("hs"+i,0)}).join(" / ")}
function draw(){g.fillStyle="#0c0828";g.fillRect(0,0,VW,VH);
  for(var l=0;l<4;l++){var x=30+l*75;g.fillStyle=l%2?"#120b36":"#0f0a2e";g.fillRect(x,0,75,VH);if(S&&S.flash[l]>0){g.fillStyle=LCOL[l];g.globalAlpha=S.flash[l]*.25;g.fillRect(x,0,75,VH);g.globalAlpha=1;S.flash[l]=Math.max(0,S.flash[l]-.08)}}
  g.fillStyle="#2a1f63";for(var l2=0;l2<=4;l2++)g.fillRect(30+l2*75-1,0,2,VH);
  g.fillStyle="#fff";g.globalAlpha=.9;g.fillRect(30,HIT+10,300,3);g.globalAlpha=1;
  for(var l3=0;l3<4;l3++){g.fillStyle=LCOL[l3];g.globalAlpha=.35;g.fillRect(34+l3*75,HIT+16,67,34);g.globalAlpha=1;g.fillStyle="#fff";g.font="14px PS,monospace";g.textAlign="center";g.fillText(LANES[l3],67+l3*75,HIT+40)}
  g.textAlign="left";if(!S)return;
  var now=ac.currentTime-S.t0;
  S.song.tiles.forEach(function(t){var y=HIT-(t.t-now)*SPEED;if(!t.hit&&!t.miss&&now-t.t>.16){t.miss=1;S.miss++;S.combo=0;S.lastJudge="MISS";S.jt=.5}if(t.hit||y<-60||y>VH+40)return;var x=34+t.lane*75;g.fillStyle=t.miss?"#444":LCOL[t.lane];g.fillRect(x,y-26,67,34);g.fillStyle="rgba(255,255,255,.35)";g.fillRect(x,y-26,67,5);g.fillStyle="rgba(0,0,0,.25)";g.fillRect(x,y+3,67,5)});
  S.fx.forEach(function(f){f.a-=.05;g.strokeStyle=f.c;g.globalAlpha=Math.max(0,f.a);g.lineWidth=3;g.beginPath();g.arc(f.x,f.y,(1-f.a)*40+8,0,6.3);g.stroke();g.globalAlpha=1});S.fx=S.fx.filter(function(f){return f.a>0});
  g.fillStyle="#fff";g.font="12px PS,monospace";g.fillText("SCORE "+Math.floor(S.score),38,24);g.textAlign="right";g.fillText("COMBO "+S.combo,322,24);g.textAlign="center";
  if(S.jt>0){S.jt-=.016;g.globalAlpha=Math.min(1,S.jt*3);g.fillStyle=S.lastJudge==="MISS"?"#f87171":S.lastJudge==="PERFECT"?"#ffd23a":"#7fe3ff";g.font="18px PS,monospace";g.fillText(S.lastJudge,180,330);g.globalAlpha=1}
  g.fillStyle="#fff";g.globalAlpha=.25;g.fillRect(30,VH-8,300*Math.max(0,Math.min(1,now/S.song.len)),4);g.globalAlpha=1;g.textAlign="left";
  if(now<0){g.fillStyle="#fff";g.font="16px PS,monospace";g.textAlign="center";g.fillText("GET READY",180,260);g.textAlign="left"}
  if(!S.done&&now>S.song.len+1.5)fin()}
function loop(){draw();requestAnimationFrame(loop)}
setInterval(function(){if(ac&&S)sched()},60);
var KM={KeyD:0,KeyF:1,KeyJ:2,KeyK:3,ArrowLeft:0,ArrowDown:1,ArrowUp:2,ArrowRight:3};
addEventListener("keydown",function(e){if(e.code in KM&&!e.repeat){e.preventDefault();judge(KM[e.code])}});
cv.addEventListener("pointerdown",function(e){e.preventDefault();var r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*VW,l=Math.floor((x-30)/75);if(l>=0&&l<4)judge(l)});
document.querySelectorAll(".songs button").forEach(function(b){b.onclick=function(){start(+b.dataset.s)}});
$("again").onclick=function(){$("over").hidden=true;$("title").hidden=false;if(master)master.disconnect();S=null};
paintBest();requestAnimationFrame(loop);
window.__bt={start:start,get S(){return S},judge:judge,tick:sched};
})();
</script></body></html>
