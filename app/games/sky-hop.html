.ov{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2vmin;background:rgba(4,6,16,.84);text-align:center;padding:4vmin}
.ov[hidden]{display:none}
.ov h1{margin:0;font-size:max(18px,4.4vmin);line-height:1.4;font-weight:400;color:var(--hi,#ffd23a);text-shadow:3px 3px var(--sh,#b45309)}
.ov p{margin:0;font-size:max(9px,1.6vmin);line-height:1.9;color:#c4cdee;max-width:62ch}
.pb{font-size:max(11px,2vmin);padding:1.6vmin 3vmin;background:var(--btn,#18b3a1);color:var(--btnt,#04141a);box-shadow:inset -4px -4px rgba(0,0,0,.28),inset 4px 4px rgba(255,255,255,.35)}
#mute{position:absolute;top:6px;right:8px;z-index:40;padding:6px 8px;font-size:11px;background:rgba(20,28,60,.9);box-shadow:none}
.hud{position:absolute;top:8px;left:0;right:0;z-index:20;display:flex;justify-content:center;gap:4vmin;font-size:max(9px,1.7vmin);text-shadow:2px 2px #000;pointer-events:none}
.hud b{color:#ffd23a;font-weight:400}

:root{--ui:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,"Noto Sans","Hiragino Sans","Yu Gothic UI",sans-serif;--hi:#fff;--sh:#3a8ad6;--btn:#ff8aa8;--btnt:#4a1330}
body{background:#8fd6ff}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(#6cc4f4,#c4ecff)}
#frame{position:relative;height:100%;aspect-ratio:2/3;max-width:100%;box-shadow:0 0 0 4px #fff,0 0 0 8px #3a8ad6,0 20px 50px #2a6aa466}
#cv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;touch-action:none}
.ov{background:rgba(120,200,250,.86)}
.ov h1{text-shadow:3px 3px 0 #3a8ad6!important}
.ov p,p{font-family:var(--ui)!important;font-size:max(14px,2.1vmin)!important;line-height:1.55!important;color:#16446e;font-weight:700;max-width:40ch;background:rgba(255,255,255,.8);padding:1vmin 1.6vmin;border-radius:10px}
.pb{border-radius:10px;box-shadow:0 5px 0 #c04a6c!important}

#mute{background:#fff!important;color:#3a8ad6!important;border-radius:8px}
