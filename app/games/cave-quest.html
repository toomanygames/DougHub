.ov{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2vmin;background:rgba(4,6,16,.84);text-align:center;padding:4vmin}
.ov[hidden]{display:none}
.ov h1{margin:0;font-size:max(18px,4.4vmin);line-height:1.4;font-weight:400;color:var(--hi,#ffd23a);text-shadow:3px 3px var(--sh,#b45309)}
.ov p{margin:0;font-size:max(9px,1.6vmin);line-height:1.9;color:#c4cdee;max-width:62ch}
.pb{font-size:max(11px,2vmin);padding:1.6vmin 3vmin;background:var(--btn,#18b3a1);color:var(--btnt,#04141a);box-shadow:inset -4px -4px rgba(0,0,0,.28),inset 4px 4px rgba(255,255,255,.35)}
#mute{position:absolute;top:6px;right:8px;z-index:40;padding:6px 8px;font-size:11px;background:rgba(20,28,60,.9);box-shadow:none}
.hud{position:absolute;top:8px;left:0;right:0;z-index:20;display:flex;justify-content:center;gap:4vmin;font-size:max(9px,1.7vmin);text-shadow:2px 2px #000;pointer-events:none}
.hud b{color:#ffd23a;font-weight:400}

body{background:#050a12;--hi:#ffd23a;--sh:#b45309}
#wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#cv{width:min(100vw,calc((100vh - 70px)*1.3636));aspect-ratio:15/11;image-rendering:pixelated;background:#061018;box-shadow:0 0 0 3px #12314a}
#hud{position:absolute;top:8px;left:0;right:0;display:flex;justify-content:center;gap:3.5vmin;font-size:max(9px,1.7vmin);text-shadow:2px 2px #000;pointer-events:none;z-index:20}
#hud b{color:#ffd23a;font-weight:400}#hp b{color:#ff6b6b}
#log{position:absolute;bottom:2.5vmin;left:0;right:0;text-align:center;font-size:max(8px,1.5vmin);color:#bcd4e6;text-shadow:2px 2px #000;pointer-events:none;min-height:2em;z-index:20}
#pad{position:absolute;right:2vmin;bottom:7vmin;z-index:25;display:none;grid-template-columns:repeat(3,11vmin);grid-template-rows:repeat(3,11vmin);gap:1vmin}
@media (pointer:coarse){#pad{display:grid}}
#pad button{background:rgba(24,179,161,.55);font-size:5vmin;padding:0}
:root{--ui:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,"Noto Sans","Hiragino Sans","Yu Gothic UI",sans-serif}
/* readable body text: pixel font only for titles, buttons and numbers */
.ov p,p{font-family:var(--ui)!important;font-size:max(14px,2.1vmin)!important;line-height:1.55!important;letter-spacing:0!important;color:#d3dbf5;max-width:56ch}
.ov h1{line-height:1.3!important}
.hud,#hud{font-size:max(10px,1.8vmin)!important}
#mute{font-size:11px!important}
#log{font-family:var(--ui)!important;font-size:max(14px,2.1vmin)!important;font-weight:600}
</style></head><body>
<div id="wrap"><canvas id="cv" width="240" height="176"></canvas></div>
<div id="hud"><span>FLOOR <b id="hF">1</b></span><span id="hp">HP <b id="hH">10</b></span><span>GOLD <b id="hG">0</b></span><span>ATK <b id="hA">1</b></span></div>
<div id="log"></div>
<div id="pad"><span></span><button data-d="0,-1" type="button">^</button><span></span><button data-d="-1,0" type="button">&lt;</button><span></span><button data-d="1,0" type="button">&gt;</button><span></span><button data-d="0,1" type="button">v</button><span></span></div>
<button id="mute" type="button">SOUND ON</button>
<div class="ov" id="title"><h1>CAVE QUEST</h1><p>Explore ten dark floors. Bump into monsters to fight them, grab gems and hearts, and find the glowing portal to go deeper.</p><p>ARROWS / WASD / SWIPE = MOVE</p><button class="pb" id="go" type="button">ENTER THE CAVE</button><p id="best"></p></div>
<div class="ov" id="over" hidden><h1 id="oT">YOU FELL</h1><p id="oM"></p><button class="pb" id="again" type="button">TRY AGAIN</button></div>
<script>/* DougHub game kit: storage, sound, music (CC0 chiptune) and score reporting to the app shell */
var DH = (function () {
  var Q = new URLSearchParams(location.search), MUTE = Q.get("mute") === "1", ac = null, music = null, mu = null, last = 0, pending = null, game = "";
  function $(i) { return document.getElementById(i); }
  function fmt(n) { n = Math.floor(n); if (n < 1e4) return String(n); var u = ["", "K", "M", "B", "T", "Qa", "Qi"], i = 0; while (n >= 1000 && i < u.length - 1) { n /= 1000; i++; } return (n >= 100 ? n.toFixed(0) : n >= 10 ? n.toFixed(1) : n.toFixed(2)).replace(/\.0+$|(\.\d*[1-9])0+$/, "$1") + u[i]; }
  var D = {
    MUTE: MUTE, fmt: fmt, $: $,
    init: function (g) { game = g; D.on = !MUTE && D.get("snd", 1) === 1; if ($("mute")) { $("mute").onclick = function () { D.on = !D.on; D.set("snd", D.on ? 1 : 0); D.paint(); if (D.on) D.music(mu); else if (music) music.pause(); }; D.paint(); }
      addEventListener("pagehide", D.flush); document.addEventListener("visibilitychange", function () { if (document.hidden) D.flush(); }); },
    paint: function () { if ($("mute")) $("mute").textContent = D.on ? "SOUND ON" : "SOUND OFF"; },
    get: function (k, d) { try { var v = localStorage.getItem(game + "-" + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(game + "-" + k, JSON.stringify(v)); } catch (e) {} },
    sfx: function (f, d, type, v) { if (!D.on) return; try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); var o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime; o.type = type || "square"; o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(Math.max(40, f * (type === "triangle" ? 1.5 : .5)), t + d); g.gain.setValueAtTime(v || .04, t); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d + .02); } catch (e) {} },
    ctx: function () { try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === "suspended") ac.resume(); } catch (e) {} return ac; },
    music: function (url, vol) { mu = url || mu; if (!D.on || MUTE || !mu) return; if (!music) { music = new Audio(mu); music.loop = true; music.volume = vol || .25; } music.play().catch(function () {}); },
    stopMusic: function () { if (music) music.pause(); },
    /* report a score to the DougHub app (leaderboard + daily credits). Throttled; the shell checks you are signed in. */
    score: function (n, force) { n = Math.floor(n); if (!(n > 0)) return; var now = Date.now(); if (!force && now - last < 15000) { pending = n; return; } last = now; pending = null; try { parent.postMessage({ dh: "score", game: game, score: n }, "*"); } catch (e) {} },
    flush: function () { if (pending) { D.score(pending, true); } }
  };
  return D;
})();
</script>
<script>
(function(){
"use strict";
DH.init("cave-quest");var $=DH.$,cv=$("cv"),g=cv.getContext("2d");g.imageSmoothingEnabled=false;
var W=15,H=11,T=16,IM={};
["tiles","player","enemies","items"].forEach(function(k){var i=new Image();i.src="../assets/grotto/"+k+".png";IM[k]=i});
function spr(k,c,r,x,y,fl){var i=IM[k];if(!i.complete)return;if(fl){g.save();g.translate(x+T,y);g.scale(-1,1);g.drawImage(i,c*T,r*T,T,T,0,0,T,T);g.restore()}else g.drawImage(i,c*T,r*T,T,T,x,y,T,T)}
var S=null,logT=0;
var EN={s:{r:0,hp:2,atk:1,slow:1,n:"slime"},o:{r:1,hp:4,atk:2,slow:0,n:"brute"},e:{r:2,hp:3,atk:2,slow:0,n:"eye",fly:1}};
function R(n){return Math.floor(Math.random()*n)}
function gen(depth){var m=[];for(var y=0;y<H;y++){m.push([]);for(var x=0;x<W;x++)m[y].push(1)}
  var x=1+R(W-2),y=1+R(H-2),sx=x,sy=y,cells=0,want=Math.floor(W*H*(.5-Math.min(.12,depth*.01)));
  while(cells<want){if(m[y][x]){m[y][x]=0;cells++}var d=R(4);x+=[1,-1,0,0][d];y+=[0,0,1,-1][d];x=Math.max(1,Math.min(W-2,x));y=Math.max(1,Math.min(H-2,y))}
  var fl=[];for(y=0;y<H;y++)for(x=0;x<W;x++)if(!m[y][x])fl.push([x,y]);
  /* BFS for the farthest cell = portal */
  var dist={},q=[[sx,sy]];dist[sx+","+sy]=0;var far=[sx,sy],fd=0;while(q.length){var c=q.shift(),dd=dist[c[0]+","+c[1]];if(dd>fd){fd=dd;far=c}[[1,0],[-1,0],[0,1],[0,-1]].forEach(function(v){var nx=c[0]+v[0],ny=c[1]+v[1];if(nx>=0&&ny>=0&&nx<W&&ny<H&&!m[ny][nx]&&dist[nx+","+ny]===undefined){dist[nx+","+ny]=dd+1;q.push([nx,ny])}})}
  return {m:m,start:[sx,sy],exit:far,fl:fl,dist:dist}}
function freeCell(L,avoid){for(var i=0;i<200;i++){var c=L.fl[R(L.fl.length)];if(!avoid.some(function(a){return a[0]===c[0]&&a[1]===c[1]}))return c}return L.fl[0]}
function floor(d){var L=gen(d),used=[L.start,L.exit];S.L=L;S.ents=[];S.items=[];S.seen=[];for(var y=0;y<H;y++){S.seen.push(new Array(W).fill(0))}
  S.p.x=L.start[0];S.p.y=L.start[1];
  var ne=2+Math.floor(d*.9)+R(2);for(var i=0;i<ne;i++){var c=freeCell(L,used);if(Math.abs(c[0]-L.start[0])+Math.abs(c[1]-L.start[1])<4){continue}used.push(c);var k=d<3?"s":(Math.random()<.5?"s":Math.random()<.55?"o":"e");if(d>=6&&Math.random()<.4)k="o";var b=EN[k];S.ents.push({k:k,x:c[0],y:c[1],hp:b.hp+Math.floor(d/4),t:0,fl:0})}
  var ng=3+R(4);for(i=0;i<ng;i++){var c2=freeCell(L,used);used.push(c2);S.items.push({k:"g",x:c2[0],y:c2[1]})}
  if(Math.random()<.8){var c3=freeCell(L,used);used.push(c3);S.items.push({k:"h",x:c3[0],y:c3[1]})}
  if(d%3===1&&Math.random()<.9){var c4=freeCell(L,used);S.items.push({k:"a",x:c4[0],y:c4[1]})}
  reveal();ui()}
function start(){S={p:{x:0,y:0,hp:10,max:10,atk:1,gold:0,face:1},d:1,kills:0,turn:0,over:0,flash:0};floor(1);$("title").hidden=true;$("over").hidden=true;DH.music("../assets/music/chip_cave.wav",.18);say("Find the glowing portal.")}
function say(t){$("log").textContent=t;logT=3}
function reveal(){for(var y=0;y<H;y++)for(var x=0;x<W;x++)if(Math.abs(x-S.p.x)+Math.abs(y-S.p.y)<=5&&Math.hypot(x-S.p.x,y-S.p.y)<=5.2)S.seen[y][x]=1}
function ui(){$("hF").textContent=S.d;$("hH").textContent=S.p.hp+"/"+S.p.max;$("hG").textContent=S.p.gold;$("hA").textContent=S.p.atk}
function entAt(x,y){return S.ents.filter(function(e){return e.x===x&&e.y===y})[0]}
function step(dx,dy){if(!S||S.over)return;var p=S.p,nx=p.x+dx,ny=p.y+dy;if(dx)p.face=dx;if(nx<0||ny<0||nx>=W||ny>=H||S.L.m[ny][nx])return;
  var e=entAt(nx,ny);
  if(e){var dmg=p.atk+(Math.random()<.2?1:0);e.hp-=dmg;e.fl=.15;DH.sfx(300,.08,"square",.05);if(e.hp<=0){S.ents.splice(S.ents.indexOf(e),1);S.kills++;p.gold+=2;say("You defeated the "+EN[e.k].n+"! +2 gold");DH.sfx(150,.2,"sawtooth",.05)}else say("You hit the "+EN[e.k].n+" for "+dmg)}
  else{p.x=nx;p.y=ny;
    S.items=S.items.filter(function(it){if(it.x!==nx||it.y!==ny)return true;if(it.k==="g"){p.gold++;say("Gem! +1 gold");DH.sfx(900,.1,"triangle",.05)}else if(it.k==="h"){var h=Math.min(p.max-p.hp,4);p.hp+=h;say("Heart! +"+h+" HP");DH.sfx(700,.2,"triangle",.05)}else{p.atk++;say("Power crystal! Attack up");DH.sfx(500,.3,"triangle",.06)}return false});
    if(nx===S.L.exit[0]&&ny===S.L.exit[1]){if(S.d>=10){end(true);return}S.d++;p.hp=Math.min(p.max,p.hp+2);say("Deeper... floor "+S.d);DH.sfx(220,.4,"sawtooth",.05);floor(S.d);return}}
  S.turn++;enemies();reveal();ui();if(p.hp<=0)end(false)}
function enemies(){var p=S.p;S.ents.forEach(function(e){var b=EN[e.k];if(b.slow&&S.turn%2)return;var d=Math.abs(e.x-p.x)+Math.abs(e.y-p.y);
    if(d===1){p.hp-=b.atk;S.flash=.2;say("The "+b.n+" hits you for "+b.atk);DH.sfx(120,.15,"sawtooth",.06);return}
    if(d<=6){var best=null,bd=d;[[1,0],[-1,0],[0,1],[0,-1]].forEach(function(v){var nx=e.x+v[0],ny=e.y+v[1];if(nx<0||ny<0||nx>=W||ny>=H)return;if(S.L.m[ny][nx]&&!b.fly)return;if(S.L.m[ny][nx]&&b.fly&&(nx<1||ny<1||nx>=W-1||ny>=H-1))return;if(nx===p.x&&ny===p.y)return;if(entAt(nx,ny))return;var dd=Math.abs(nx-p.x)+Math.abs(ny-p.y);if(dd<bd){bd=dd;best=[nx,ny]}});if(best){e.x=best[0];e.y=best[1]}}})}
function end(win){S.over=1;DH.stopMusic();var sc=S.d*100+S.p.gold*10+S.kills*20+(win?1000:0);$("oT").textContent=win?"YOU ESCAPED!":"YOU FELL";$("oM").textContent="FLOOR "+S.d+" · GOLD "+S.p.gold+" · SCORE "+sc;$("over").hidden=false;var b=DH.get("best",0);if(sc>b)DH.set("best",sc);DH.score(sc,true);paintBest()}
function paintBest(){var b=DH.get("best",0);$("best").textContent=b?"BEST "+b:""}
var t0=performance.now();
function draw(now){var t=now/1000;g.fillStyle="#061018";g.fillRect(0,0,240,176);if(!S){requestAnimationFrame(draw);return}
  var sh=S.flash>0?(Math.random()-.5)*2:0;S.flash=Math.max(0,S.flash-.016);g.save();g.translate(sh,0);
  for(var y=0;y<H;y++)for(var x=0;x<W;x++){var vis=Math.hypot(x-S.p.x,y-S.p.y)<=5.2&&Math.abs(x-S.p.x)+Math.abs(y-S.p.y)<=5;if(!S.seen[y][x]){continue}
    if(S.L.m[y][x])spr("tiles",6,1+((x*3+y)%2),x*T,y*T);else spr("tiles",(x+y*2)%4,1+((x+y)%2),x*T,y*T);
    if(!vis){g.fillStyle="rgba(3,8,14,.62)";g.fillRect(x*T,y*T,T,T)}}
  var vis2=function(x,y){return Math.hypot(x-S.p.x,y-S.p.y)<=5.2&&Math.abs(x-S.p.x)+Math.abs(y-S.p.y)<=5};
  if(S.seen[S.L.exit[1]][S.L.exit[0]])spr("items",Math.floor(t*8)%4,0,S.L.exit[0]*T,S.L.exit[1]*T);
  S.items.forEach(function(it){if(!vis2(it.x,it.y))return;var f=Math.floor(t*6+it.x)%4;if(it.k==="g")spr("items",f,1,it.x*T,it.y*T+Math.round(Math.sin(t*3+it.x)));else if(it.k==="h")spr("items",f%2,3,it.x*T,it.y*T);else spr("items",2,2,it.x*T,it.y*T)});
  S.ents.forEach(function(e){if(!vis2(e.x,e.y))return;if(e.fl>0){e.fl-=.016;g.globalAlpha=.5}spr("enemies",Math.floor(t*4+e.x)%2,EN[e.k].r,e.x*T,e.y*T,e.x>S.p.x);g.globalAlpha=1;g.fillStyle="#400";g.fillRect(e.x*T+2,e.y*T-1,12,2);g.fillStyle="#f55";g.fillRect(e.x*T+2,e.y*T-1,12*Math.max(0,e.hp/(EN[e.k].hp+Math.floor(S.d/4))),2)});
  spr("player",1,1,S.p.x*T,S.p.y*T,S.p.face<0);g.restore();
  var gr=g.createRadialGradient(S.p.x*T+8,S.p.y*T+8,30,S.p.x*T+8,S.p.y*T+8,110);gr.addColorStop(0,"rgba(0,0,0,0)");gr.addColorStop(1,"rgba(0,4,10,.6)");g.fillStyle=gr;g.fillRect(0,0,240,176);
  if(logT>0){logT-=.016;if(logT<=0)$("log").textContent=""}requestAnimationFrame(draw)}
var K={ArrowLeft:[-1,0],KeyA:[-1,0],ArrowRight:[1,0],KeyD:[1,0],ArrowUp:[0,-1],KeyW:[0,-1],ArrowDown:[0,1],KeyS:[0,1]};
addEventListener("keydown",function(e){if(e.code in K){e.preventDefault();step(K[e.code][0],K[e.code][1])}});
document.querySelectorAll("#pad button").forEach(function(b){b.addEventListener("pointerdown",function(e){e.preventDefault();var d=b.dataset.d.split(",");step(+d[0],+d[1])})});
var sx,sy;addEventListener("touchstart",function(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
addEventListener("touchend",function(e){if(e.target.closest("#pad"))return;var t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;if(Math.abs(dx)>Math.abs(dy))step(dx<0?-1:1,0);else step(0,dy<0?-1:1)},{passive:true});
$("go").onclick=start;$("again").onclick=start;paintBest();requestAnimationFrame(draw);
window.__cq={start:start,step:step,get S(){return S}};
})();
</script></body></html>
