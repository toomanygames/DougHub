#hud{position:absolute;top:8px;left:0;right:0;display:flex;justify-content:center;gap:4vmin;font-size:max(9px,1.7vmin);text-shadow:2px 2px #000;pointer-events:none}
#hud b{color:#ffd23a;font-weight:400}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2vmin;background:rgba(3,5,14,.82);text-align:center;padding:4vmin}
.ov[hidden]{display:none}
h1{margin:0;font-size:max(18px,4.2vmin);color:#7fe3ff;text-shadow:3px 3px #1d4ed8;font-weight:400;line-height:1.4}
p{margin:0;font-size:max(9px,1.6vmin);line-height:1.9;color:#b9c7ee;max-width:60ch}
button{font:inherit;font-size:max(11px,2vmin);padding:1.6vmin 3vmin;background:#ff4f6d;color:#fff;border:0;box-shadow:inset -4px -4px #b02a45,inset 4px 4px #ff93a6;cursor:pointer}
button:active{transform:translateY(2px)}
#mute{position:absolute;top:6px;right:8px;padding:6px 8px;font-size:11px;background:#1b2a5c;box-shadow:none}
</style></head><body>
<div id="wrap"><canvas id="cv" width="240" height="320"></canvas>
<div id="hud"><span>WAVE <b id="hW">1</b></span><span>SCORE <b id="hS">0</b></span><span>LIVES <b id="hL">3</b></span></div>
<button id="mute" type="button">SOUND ON</button>
<div class="ov" id="title"><h1>STAR SALVO</h1><p>Defend the galaxy! Your ship fires by itself. Dodge, collect power-ups and beat the boss every 5th wave.</p><p>ARROWS / A D / MOUSE / TOUCH = MOVE</p><button id="go" type="button">LAUNCH</button><p id="best"></p></div>
<div class="ov" id="over" hidden><h1 id="oT">GAME OVER</h1><p id="oM"></p><button id="again" type="button">PLAY AGAIN</button></div>
</div>
<script>
(function(){
"use strict";
var Q=new URLSearchParams(location.search),MUTE=Q.get("mute")==="1";
var cv=document.getElementById("cv"),g=cv.getContext("2d");g.imageSmoothingEnabled=false;
var VW=240,VH=320,$=function(i){return document.getElementById(i)};
var store={get:function(k,d){try{var v=localStorage.getItem("ss-"+k);return v===null?d:+v}catch(e){return d}},set:function(k,v){try{localStorage.setItem("ss-"+k,v)}catch(e){}}};
var best=store.get("best",0),soundOn=!MUTE&&store.get("snd",1)===1;
/* ---------- pixel sprites (drawn from text maps) ---------- */
var PAL={a:"#e8f4ff",b:"#7fe3ff",c:"#2f7bff",d:"#1b3a9c",r:"#ff4f6d",o:"#ff9a3c",y:"#ffd23a",g:"#5be37d",p:"#b46bff",k:"#2a2f55",w:"#ffffff",m:"#d83a9a"};
function mkSpr(rows){var w=rows[0].length*2,h=rows.length,c=document.createElement("canvas");c.width=w;c.height=h;var x=c.getContext("2d");
  rows.forEach(function(row,y){for(var i=0;i<row.length;i++){var ch=row[i];if(ch===".")continue;x.fillStyle=PAL[ch];x.fillRect(i,y,1,1);x.fillRect(w-1-i,y,1,1)}});return c}
var SP={
 ship:mkSpr(["......a.","......a.",".....ba.",".....ba.","....cbab","..d.cbab",".dc.cbbb","ddcccbbc","ddcccyyc","d.cc.yoc","...c..o."]),
 grunt:mkSpr(["..rrrr..","..rooro.",".rrrrrrr","rr.rrrrw","r..rr.rw","....rr.r"]),
 shoot:mkSpr(["...pp...","..pppp..",".mpwwpp.","mmppppmp","mp.pp.pp","m..pp..p","....mm.."]),
 tank:mkSpr(["...kkkkk","..kkddkk",".kkdgdkk","kkdgggdk","kkddddkk","kd.kk.kk","kd.k...k","k.....k."]),
 boss:mkSpr(["...............k","......oooooooookk","....oorrrrrrrrrrk","...orrrrrrrrrryyy","..orrwwrrrrrrrryy","..orwkwrrrrrrrrrr","..orrwwrrrrrrrrrr","...orrrrrrrrrrrrr","....oorrrrrrrrrrk","..o...oooooooooko","..oo...kk..kk..oo",".oo..kk......kk.oo"]),
 pu:mkSpr(["..bbbb..",".baaaab.","baaaaaab","baaaaaab",".baaaab.","..bbbb.."])};
/* ---------- sound: music = Juhani Junkala, CC0 ---------- */
var music=null,ac=null;
function sfx(f,d,type,v){if(!soundOn)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();var o=ac.createOscillator(),gn=ac.createGain(),t=ac.currentTime;o.type=type||"square";o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(Math.max(40,f*.4),t+d);gn.gain.setValueAtTime(v||.05,t);gn.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(gn);gn.connect(ac.destination);o.start(t);o.stop(t+d)}catch(e){}}
function startMusic(){if(!soundOn||MUTE)return;if(!music){music=new Audio("../assets/music/chip_blaster.wav");music.loop=true;music.volume=.3}music.play().catch(function(){})}
function stopMusic(){if(music)music.pause()}
function setSnd(){$("mute").textContent=soundOn?"SOUND ON":"SOUND OFF";store.set("snd",soundOn?1:0);if(soundOn&&running)startMusic();else stopMusic()}
$("mute").onclick=function(){soundOn=!soundOn;setSnd()};
/* ---------- state ---------- */
var S=null,running=false,keys={},ptr=null,stars=[];
for(var i=0;i<60;i++)stars.push({x:Math.random()*VW,y:Math.random()*VH,s:.3+Math.random()*1.2});
function rnd(a,b){return a+Math.random()*(b-a)}
function hud(){$("hW").textContent=S.wave;$("hS").textContent=S.score;$("hL").textContent=S.lives}
function newGame(){S={p:{x:VW/2,y:VH-34,w:16,h:20,inv:0,fire:0,pw:0,rapid:0,shield:0,spread:0},b:[],e:[],eb:[],pu:[],fx:[],lives:3,score:0,wave:0,t:0,spawn:0,left:0,bossOn:false,banner:0};
  running=true;$("title").hidden=true;$("over").hidden=true;nextWave();hud();startMusic()}
function nextWave(){var S_=S;S_.wave++;S_.banner=2;S_.left=0;S_.spawn=1;S_.bossOn=false;var w=S_.wave;
  if(w%5===0){S_.bossOn=true;S_.e.push({k:"boss",x:VW/2,y:-30,w:32,h:24,hp:30+w*6,max:30+w*6,t:0,vx:40,fire:1,pts:2000});}
  else{S_.todo=[];var n=6+w*2;for(var i=0;i<n;i++){var r=Math.random(),k=r<.6-Math.min(.3,w*.03)?"grunt":r<.88?"shoot":"tank";S_.todo.push({k:k,at:i*(.55-Math.min(.25,w*.02)),x:rnd(24,VW-24)})}}
  hud()}
var EN={grunt:{w:16,h:12,hp:1,pts:100,spd:52},shoot:{w:16,h:14,hp:2,pts:200,spd:36},tank:{w:16,h:16,hp:5,pts:400,spd:26}};
function boom(x,y,c,n){for(var i=0;i<(n||12);i++){var a=Math.random()*6.28,s=rnd(20,90);S.fx.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,a:.5+Math.random()*.4,c:c||"#ffb43a"})}}
function hit(){var p=S.p;if(p.inv>0)return;if(p.shield>0){p.shield=0;p.inv=1;sfx(300,.2,"sawtooth");return}
  S.lives--;sfx(160,.5,"sawtooth",.08);boom(p.x,p.y,"#7fe3ff",24);p.inv=2;p.spread=0;p.rapid=0;hud();if(S.lives<=0)end()}
function end(){running=false;stopMusic();var sc=S.score;if(sc>best){best=sc;store.set("best",best)}$("oT").textContent=S.wave>=5&&S.lives>0?"VICTORY!":"GAME OVER";$("oM").textContent="WAVE "+S.wave+" · SCORE "+sc+" · BEST "+best;$("best").textContent="BEST "+best;$("over").hidden=false}
function update(dt){if(!S||!running)return;var p=S.p;S.t+=dt;S.banner=Math.max(0,S.banner-dt);
  var ax=(keys.r?1:0)-(keys.l?1:0),ay=(keys.d?1:0)-(keys.u?1:0);
  if(ptr){p.x+=(ptr.x-p.x)*Math.min(1,dt*14);p.y+=(ptr.y-p.y)*Math.min(1,dt*14)}else{p.x+=ax*130*dt;p.y+=ay*110*dt}
  p.x=Math.max(10,Math.min(VW-10,p.x));p.y=Math.max(40,Math.min(VH-14,p.y));p.inv=Math.max(0,p.inv-dt);p.rapid=Math.max(0,p.rapid-dt);p.spread=Math.max(0,p.spread-dt);
  p.fire-=dt;if(p.fire<=0){p.fire=p.rapid>0?.1:.18;var sp=p.spread>0;
    S.b.push({x:p.x,y:p.y-10,vx:0,vy:-300});if(sp){S.b.push({x:p.x-4,y:p.y-8,vx:-55,vy:-290});S.b.push({x:p.x+4,y:p.y-8,vx:55,vy:-290})}sfx(900,.05,"square",.015)}
  /* wave spawner */
  if(S.todo&&S.todo.length){S.spawn-=dt;S.todo.forEach(function(d){d.at-=dt});while(S.todo.length&&S.todo[0].at<=0){var d=S.todo.shift(),c=EN[d.k];S.e.push({k:d.k,x:d.x,x0:d.x,y:-14,w:c.w,h:c.h,hp:c.hp,t:Math.random()*6,fire:rnd(.8,2.5),pts:c.pts})}}
  /* bullets */
  S.b.forEach(function(b){b.x+=b.vx*dt;b.y+=b.vy*dt});S.b=S.b.filter(function(b){return b.y>-8&&b.x>-8&&b.x<VW+8});
  S.eb.forEach(function(b){b.x+=b.vx*dt;b.y+=b.vy*dt;if(Math.abs(b.x-p.x)<7&&Math.abs(b.y-p.y)<8){b.dead=1;hit()}});S.eb=S.eb.filter(function(b){return !b.dead&&b.y<VH+8&&b.y>-10&&b.x>-8&&b.x<VW+8});
  /* enemies */
  S.e.forEach(function(e){e.t+=dt;
    if(e.k==="boss"){if(e.y<42)e.y+=30*dt;else{e.x+=e.vx*dt;if(e.x<30||e.x>VW-30)e.vx*=-1}e.fire-=dt;if(e.fire<=0&&e.y>=42){e.fire=.9;for(var i=-2;i<=2;i++)S.eb.push({x:e.x,y:e.y+14,vx:i*34,vy:110});sfx(220,.15,"sawtooth",.04)}}
    else{var d=EN[e.k];e.y+=d.spd*dt;if(e.k==="grunt")e.x=e.x0+Math.sin(e.t*3)*26;else if(e.k==="shoot"){e.x=e.x0+Math.sin(e.t*1.6)*40;e.fire-=dt;if(e.fire<=0&&e.y>0&&e.y<VH-90){e.fire=rnd(1.4,2.4);var dx=p.x-e.x,dy=p.y-e.y,l=Math.hypot(dx,dy)||1;S.eb.push({x:e.x,y:e.y+8,vx:dx/l*90,vy:dy/l*90})}}else{e.x=e.x0+Math.sin(e.t)*14}}
    if(e.y>VH+20)e.gone=1;
    S.b.forEach(function(b){if(!b.dead&&!e.dead&&Math.abs(b.x-e.x)<e.w/2+2&&Math.abs(b.y-e.y)<e.h/2+3){b.dead=1;e.hp--;e.flash=.06;sfx(500,.04,"square",.02);if(e.hp<=0){e.dead=1;S.score+=e.pts;boom(e.x,e.y,e.k==="boss"?"#ff4f6d":"#ffb43a",e.k==="boss"?60:14);sfx(120,.3,"sawtooth",.06);
        if(e.k==="boss"||Math.random()<.13){S.pu.push({x:e.x,y:e.y,t:["spread","rapid","shield","life"][Math.random()*4|0]})}hud()}}});
    if(e.flash)e.flash-=dt;
    if(!e.dead&&p.inv<=0&&Math.abs(p.x-e.x)<e.w/2+5&&Math.abs(p.y-e.y)<e.h/2+6){hit();if(e.k!=="boss"){e.dead=1;boom(e.x,e.y)}}});
  S.b=S.b.filter(function(b){return !b.dead});
  var wasBoss=S.e.some(function(e){return e.k==="boss"&&e.dead});
  S.e=S.e.filter(function(e){return !e.dead&&!e.gone});
  if(S.wave>0&&(!S.todo||!S.todo.length)&&!S.e.length&&S.banner<=0){if(wasBoss||true){S.score+=100;if(S.wave>=15){end();return}nextWave()}}
  /* powerups */
  S.pu.forEach(function(u){u.y+=40*dt;if(Math.abs(u.x-p.x)<11&&Math.abs(u.y-p.y)<12){u.got=1;sfx(1200,.15,"triangle",.05);S.score+=50;if(u.t==="spread")p.spread=12;else if(u.t==="rapid")p.rapid=12;else if(u.t==="shield")p.shield=1;else S.lives=Math.min(5,S.lives+1);hud()}});S.pu=S.pu.filter(function(u){return !u.got&&u.y<VH+10});
  S.fx.forEach(function(f){f.x+=f.vx*dt;f.y+=f.vy*dt;f.a-=dt});S.fx=S.fx.filter(function(f){return f.a>0});
  stars.forEach(function(s){s.y+=s.s*40*dt;if(s.y>VH){s.y=0;s.x=Math.random()*VW}})}
var PC={spread:"#ffd23a",rapid:"#ff9a3c",shield:"#5be37d",life:"#ff4f6d"},PL={spread:"S",rapid:"R",shield:"O",life:"+"};
function draw(){g.fillStyle="#070a1c";g.fillRect(0,0,VW,VH);
  stars.forEach(function(s){g.fillStyle=s.s>1?"#cfe3ff":"#5a6aa6";g.fillRect(s.x|0,s.y|0,s.s>1?2:1,s.s>1?2:1)});
  if(!S)return;var p=S.p;
  S.pu.forEach(function(u){var x=Math.round(u.x-8),y=Math.round(u.y-6);g.drawImage(SP.pu,x,y);g.fillStyle=PC[u.t];g.fillRect(x+4,y+2,8,2);g.fillRect(x+4,y+4,8,2);g.font="8px PS,monospace";g.fillStyle="#001";g.fillText(PL[u.t],x+5,y+8)});
  S.e.forEach(function(e){var s=SP[e.k];if(!s)return;var x=Math.round(e.x-s.width/2),y=Math.round(e.y-s.height/2);if(e.flash){g.globalAlpha=.55}g.drawImage(s,x,y);g.globalAlpha=1;
    if(e.k==="boss"){g.fillStyle="#400";g.fillRect(30,24,VW-60,5);g.fillStyle="#ff4f6d";g.fillRect(30,24,(VW-60)*Math.max(0,e.hp/e.max),5)}});
  g.fillStyle="#ffe27a";S.b.forEach(function(b){g.fillRect(Math.round(b.x-1),Math.round(b.y-4),2,6)});
  S.eb.forEach(function(b){g.fillStyle="#ff4f6d";g.fillRect(Math.round(b.x-2),Math.round(b.y-2),4,4);g.fillStyle="#fff";g.fillRect(Math.round(b.x-1),Math.round(b.y-1),2,2)});
  if(S.lives>0&&!(p.inv>0&&Math.floor(S.t*14)%2===0)){var s=SP.ship;g.drawImage(s,Math.round(p.x-s.width/2),Math.round(p.y-s.height/2));
    var fl=Math.floor(S.t*20)%2;g.fillStyle=fl?"#ffd23a":"#ff7a1a";g.fillRect(Math.round(p.x-2),Math.round(p.y+s.height/2),4,2+fl*2);
    if(p.shield>0){g.strokeStyle="#5be37d";g.lineWidth=1;g.beginPath();g.arc(p.x,p.y,15,0,6.3);g.stroke()}}
  S.fx.forEach(function(f){g.fillStyle=f.c;g.fillRect(Math.round(f.x),Math.round(f.y),2,2)});
  if(S.banner>0){g.globalAlpha=Math.min(1,S.banner);g.fillStyle="#fff";g.font="14px PS,monospace";g.textAlign="center";g.fillText(S.bossOn?"BOSS!":"WAVE "+S.wave,VW/2,VH/2-30);g.textAlign="left";g.globalAlpha=1}}
var last=0;function loop(t){var dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}
var K={ArrowLeft:"l",KeyA:"l",ArrowRight:"r",KeyD:"r",ArrowUp:"u",KeyW:"u",ArrowDown:"d",KeyS:"d"};
addEventListener("keydown",function(e){var k=K[e.code];if(k){keys[k]=true;ptr=null;e.preventDefault()}if(e.code==="KeyM"){soundOn=!soundOn;setSnd()}if(e.code==="Enter"||e.code==="Space"){if(!$("title").hidden)$("go").click();else if(!$("over").hidden)$("again").click()}});
addEventListener("keyup",function(e){var k=K[e.code];if(k)keys[k]=false});
function pt(e){var r=cv.getBoundingClientRect(),t=e.touches?e.touches[0]:e;ptr={x:(t.clientX-r.left)/r.width*VW,y:(t.clientY-r.top)/r.height*VH-(e.touches?26:0)}}
cv.addEventListener("pointermove",function(e){if(running&&(e.pointerType!=="mouse"||e.buttons||true)){pt(e)}});
cv.addEventListener("pointerdown",function(e){pt(e)});
cv.addEventListener("touchmove",function(e){e.preventDefault();pt(e)},{passive:false});
$("go").onclick=newGame;$("again").onclick=newGame;
if(best)$("best").textContent="BEST "+best;$("mute").textContent=soundOn?"SOUND ON":"SOUND OFF";
requestAnimationFrame(loop);
window.__ss={step:function(n,dt){for(var i=0;i<n;i++)update(dt||.016);draw()},start:newGame,get S(){return S}};
})();
</script></body></html>
