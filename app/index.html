<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0e20">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>DougHub</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <header class="bar">
    <div class="brand"><span class="mark">D</span><b>DougHub</b></div>
    <div class="bar-r">
      <button id="langBtn" class="pill" type="button" aria-haspopup="dialog"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></svg><span id="langName">English</span></button>
      <button id="setBtn" class="icon" type="button" aria-label="Settings"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg></button>
    </div>
  </header>
  <main id="home">
    <div class="hero"><h1 id="tPick">Pick a game</h1><p id="tPickSub">Tap a game to play. No sign-in needed.</p></div>
    <div id="grid" class="grid"></div>
    <div id="status" class="status" role="status"></div>
  </main>
</div>

<div id="player" hidden>
  <div class="pbar"><button id="pBack" class="btn" type="button">&larr; <span id="tHome">Home</span></button><b id="pTitle"></b></div>
  <div class="pframe"><div id="pLoad" class="pload"><div class="spin"></div></div></div>
</div>

<div id="sheetWrap" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="tSettings">
    <div class="sheet-h"><h2 id="tSettings">Settings</h2><button id="sheetClose" class="icon" type="button" aria-label="Close">&times;</button></div>
    <section><h3 id="tLanguage">Language</h3><div id="langList" class="langs"></div><p class="note" id="tLangNote"></p></section>
    <section><h3 id="tUpdates">Updates</h3><p id="updText" class="upd"></p><div class="row"><button id="updBtn" class="btn pri" type="button"></button></div><p class="note" id="tAuto"></p></section>
    <section id="installBox"><h3 id="tInstall">Install the app</h3><div class="row"><button id="installBtn" class="btn pri" type="button" hidden></button></div><p class="note" id="tInstallHelp"></p><p class="note" id="tOffline"></p></section>
    <section><h3 id="tAbout">About</h3><p class="note" id="tAboutText"></p><p class="note"><span id="tVersion">Version</span> <b id="verText"></b></p></section>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
