<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Feature Unavailable • DougHub</title>
<link rel="icon" href="DougHub.svg" type="image/x-icon">
<script src="nav.js" defer></script>
<style>
:root{color-scheme:dark;--line:#ffffff18;--muted:#a7aec9;--accent:#8b5cf6}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 20% 0%,#27205b 0,transparent 40%),#070817;color:#f5f6ff;font-family:Inter,Arial,sans-serif;display:flex;flex-direction:column}
.top{width:100%;max-width:1450px;margin:0 auto;padding:18px 24px;display:flex;align-items:center;gap:18px;border-bottom:1px solid var(--line)}
.brand{font-size:22px;font-weight:800;text-decoration:none;letter-spacing:-.5px}.brand span{color:#c4b5fd}.nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-left:auto}.nav a{font-size:13px;text-decoration:none;padding:9px 12px;border-radius:10px;color:#d9dcf4}.nav a:hover,.nav a.active{background:#ffffff12;color:white}
main{flex:1;display:grid;place-items:center;padding:28px 16px}.card{width:min(560px,100%);text-align:center;padding:clamp(24px,6vw,42px);border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,#171a36e8,#0e1024f2);box-shadow:0 24px 80px #0004}
.icon{width:64px;height:64px;display:grid;place-items:center;border-radius:20px;background:#f59e0b16;border:1px solid #f59e0b35;margin:0 auto 20px;font-size:30px}
.eyebrow{color:#c4b5fd;font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:800}h1{font-size:clamp(27px,5vw,38px);letter-spacing:-1px;margin:10px 0 12px}p{color:var(--muted);font-size:14px;line-height:1.7;margin:0 auto 22px;max-width:430px}
.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;padding:11px 15px;border-radius:11px;border:1px solid var(--line);text-decoration:none;font-size:13px;font-weight:700;color:#f5f6ff;background:#ffffff08}.btn.primary{background:linear-gradient(100deg,#6d48e8,#9b5cf6);border-color:transparent}.foot{text-align:center;padding:0 12px 22px;color:#7f86a6;font-size:12px}
@media(max-width:600px){.top{padding:14px;flex-wrap:wrap}.nav{margin-left:0;width:100%}.card{padding:24px 18px}}
</style>

<link rel="stylesheet" href="douqhub-theme.css">
</head>
<body>
<header class="top"><a href="index.html" class="brand">Doug<span>Hub</span></a><nav class="nav"><a href="index.html">Home</a><a href="douggames.html">Games</a><a href="tools.html">Tools</a><a href="nova.html">✳ Nova AI</a></nav></header>
<main><section class="card"><div class="icon">⚙️</div><div class="eyebrow">DougHub feature status</div><h1 id="title">Temporarily unavailable</h1><p id="message">This feature has been turned off by an administrator. Please check back later.</p><div class="actions"><a class="btn primary" href="index.html">Back to DougHub</a></div></section></main>
<div class="foot">DougHub · Feature availability is managed by administrators.</div>
<script>
(function(){
const names={games:"DougGames",dougtube:"DougTube",dmail:"DMail",tools:"DougTools",nova:"Nova AI",chat:"Community Chat",community_games:"Community Games",dougbase:"DougBase",dougcode:"DougCode",scripting:"Scripting Editor",work:"DougHub Work"};
const key=new URLSearchParams(location.search).get("feature")||"";
const name=names[key]||"This feature";
document.title=name+" Unavailable • DougHub";
document.getElementById("title").textContent=name+" is turned off";
document.getElementById("message").textContent=name+" has been temporarily disabled by a DougHub administrator. It will be available again when an administrator turns it back on.";
})();
</script>
</body>
</html>
