<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171923"><title>Gem Garden • DougHub</title><link rel="icon" href="../DougHub.svg"><script src="../display.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 12% 0,#ffad6830,transparent 32%),#11131b;color:#fff7ed;font-family:Inter,Arial,sans-serif}header{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid #ffffff18;background:#171923dd;backdrop-filter:blur(14px)}.brand{display:flex;align-items:center;gap:10px;font-weight:900;text-decoration:none;color:white}.brand-mark{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:linear-gradient(145deg,#ff9a70,#e96e82);color:#21131a}.back{color:#f7c8a9;text-decoration:none;font-size:13px;font-weight:800}main{width:min(1050px,calc(100% - 28px));margin:30px auto 24px}.intro{display:flex;justify-content:space-between;align-items:end;gap:15px;margin-bottom:18px}.eyebrow{font-size:10px;letter-spacing:.16em;font-weight:900;color:#ffad68;text-transform:uppercase}.intro h1{font-size:clamp(28px,5vw,44px);margin:8px 0 5px;letter-spacing:-1.5px}.intro p{margin:0;color:#b8b5bf;font-size:14px}.stats{display:flex;gap:8px;flex-wrap:wrap}.pill{padding:8px 12px;border:1px solid #ffffff20;border-radius:999px;background:#ffffff0a;color:#ddd5d1;font-size:12px;font-weight:800}.game-shell{padding:clamp(14px,3vw,25px);border:1px solid #ffffff20;border-radius:23px;background:linear-gradient(145deg,#292733,#1c2029);box-shadow:0 20px 60px #0005}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:15px}.toolbar strong{font-size:14px}.toolbar button,.action{border:0;border-radius:11px;padding:10px 15px;background:#ffad68;color:#21151a;font-weight:900;cursor:pointer}.toolbar button:hover,.action:hover{filter:brightness(1.08)}.game-area{display:grid;place-items:center;min-height:320px;padding:14px;border-radius:17px;background:linear-gradient(145deg,#171922,#202733);border:1px solid #ffffff12}.hint{margin:14px 0 0;color:#b8b5bf;font-size:12px;line-height:1.6}.credits{display:flex;justify-content:center;margin:22px auto 10px}.credits button{border:1px solid #ffffff20;background:#ffffff09;color:#c9c1c1;border-radius:999px;padding:9px 14px;font-size:11px;font-weight:800;cursor:pointer}.credit-panel{display:none;margin:12px auto;padding:14px;border-radius:13px;background:#1d202a;border:1px solid #ffffff1a;color:#bfb8bc;font-size:12px;line-height:1.6}.credit-panel.show{display:block}.credit-panel a{color:#ffad68}@media(max-width:600px){header{padding:0 14px}.intro{align-items:flex-start;flex-direction:column}.game-area{padding:8px}}
</style></head><body><header><a class="brand" href="../index.html"><span class="brand-mark">D</span>DougHub</a><a class="back" href="../douggames.html">← All games</a></header><main><div class="intro"><div><div class="eyebrow">MATCH • PUZZLE</div><h1>Gem Garden</h1><p>Made for quick rounds and satisfying little wins.</p></div><div class="stats" id="stats"></div></div><section class="game-shell"><div class="toolbar"><strong id="status">Ready when you are</strong><button id="restart" type="button">New game</button></div><div class="game-area" id="gameArea"></div><p class="hint" id="hint"></p></section><div class="credits"><button id="creditsToggle" type="button">ART & CREDITS</button></div><div class="credit-panel" id="creditsPanel">Game art from <a href="https://kenney.nl/assets/puzzle-pack-1" target="_blank" rel="noopener">Kenney Puzzle Pack 1</a> and <a href="https://kenney.nl/assets/puzzle-pack-2" target="_blank" rel="noopener">Kenney Puzzle Pack 2</a>. Both packs are licensed CC0. Thanks to Kenney for the artwork.</div></main><script>
document.getElementById("creditsToggle").addEventListener("click",()=>document.getElementById("creditsPanel").classList.toggle("show"));
</script>
<style>
#gemBoard{display:grid;grid-template-columns:repeat(7,min(10.8vw,62px));gap:5px;touch-action:manipulation}.gem-cell{width:min(10.8vw,62px);height:min(10.8vw,62px);display:grid;place-items:center;border:1px solid #ffffff14;border-radius:12px;background:#ffffff0b;cursor:pointer;transition:transform .12s,background .12s}.gem-cell.selected{background:#ffad6833;outline:2px solid #ffbd7b;transform:scale(1.05)}.gem-cell img{width:78%;height:78%;object-fit:contain;image-rendering:auto;pointer-events:none}@media(max-width:460px){#gemBoard{gap:3px}.gem-cell{border-radius:8px}}
</style><script>
const gemNames=["blue","green","purple","red","yellow"];const gemImages=gemNames.map(n=>"https://raw.githubusercontent.com/eturner58/game-assets/main/kenney/2D%20assets/Puzzle%20Pack%201/PNG/Default/"+"element_"+n+"_diamond_glossy.png");let gemBoard=[],gemPick=-1,gemScore=0,gemMoves=25,gemBusy=false;
const gb=document.getElementById("gameArea");gb.innerHTML='<div id="gemBoard" aria-label="Gem matching board"></div>';const gemGrid=document.getElementById("gemBoard");
function gemRand(){return Math.floor(Math.random()*gemNames.length)}function gemMake(){gemBoard=Array.from({length:49},gemRand);gemPick=-1;gemScore=0;gemMoves=25;gemDraw();gemStats();document.getElementById("status").textContent="Match 3 or more gems";document.getElementById("hint").textContent="Select a gem, then an adjacent gem to swap them. Match three in a row or column to score points."}
function gemStats(){document.getElementById("stats").innerHTML='<span class="pill">Score: '+gemScore+'</span><span class="pill">Moves: '+gemMoves+'</span>'}
function gemDraw(){gemGrid.innerHTML=gemBoard.map((v,i)=>'<button class="gem-cell '+(gemPick===i?'selected':'')+'" data-i="'+i+'" aria-label="'+gemNames[v]+' gem"><img draggable="false" src="'+gemImages[v]+'" alt=""></button>').join("");gemGrid.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>gemTap(+b.dataset.i)))}
function gemMatches(){let set=new Set();for(let r=0;r<7;r++)for(let c=0;c<7;c++){let i=r*7+c,v=gemBoard[i];if(c<5&&v===gemBoard[i+1]&&v===gemBoard[i+2]){let k=c;while(k<7&&gemBoard[r*7+k]===v)set.add(r*7+k++);}if(r<5&&v===gemBoard[i+7]&&v===gemBoard[i+14]){let k=r;while(k<7&&gemBoard[k*7+c]===v)set.add(k++*7+c)}}return [...set]}
async function gemResolve(){let hits=gemMatches();while(hits.length){gemScore+=hits.length*10;hits.forEach(i=>gemBoard[i]=-1);for(let c=0;c<7;c++){let vals=[];for(let r=6;r>=0;r--)if(gemBoard[r*7+c]>=0)vals.push(gemBoard[r*7+c]);while(vals.length<7)vals.push(gemRand());for(let r=6;r>=0;r--)gemBoard[r*7+c]=vals[6-r]}gemDraw();gemStats();await new Promise(ok=>setTimeout(ok,160));hits=gemMatches()}gemStats();if(gemMoves<=0)document.getElementById("status").textContent="Round over — score "+gemScore}
async function gemTap(i){if(gemBusy||gemMoves<=0)return;if(gemPick<0){gemPick=i;gemDraw();return}if(gemPick===i){gemPick=-1;gemDraw();return}let a=gemPick,b=i;if(Math.abs(a-b)!==7&&!(Math.floor(a/7)===Math.floor(b/7)&&Math.abs(a-b)===1)){gemPick=i;gemDraw();return}gemBusy=true;[gemBoard[a],gemBoard[b]]=[gemBoard[b],gemBoard[a]];gemPick=-1;if(!gemMatches().length){[gemBoard[a],gemBoard[b]]=[gemBoard[b],gemBoard[a]];document.getElementById("status").textContent="That swap didn't make a match";}else{gemMoves--;await gemResolve();document.getElementById("status").textContent=gemMoves?"Nice match!":"Round complete"}gemDraw();gemStats();gemBusy=false}
document.getElementById("restart").addEventListener("click",gemMake);gemMake();
</script></body></html>
