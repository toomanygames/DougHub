<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<script src="no-zoom.js"></script>
<meta name="theme-color" content="#2f6b3a">
<title>Farm Idle</title>
<link rel="icon" href="art/farm-idle.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../display.js"></script>
<script src="../game-analytics.js" data-game-key="builtin:farm-idle" data-game-title="Farm Idle" defer></script>
<style>
:root{
  --ink:#3a2a14;--ink2:#6b5a3e;--cream:#fffbea;--cream2:#f6efcf;--line:#d9cca0;
  --leaf:#3f9d3a;--leaf-dk:#2a7a2c;--soil:#8b5a2b;--soil-dk:#5e3a18;--sun:#ffd23f;--sun-dk:#d99a00;--sky:#8fd3ff;--rose:#e5486b;--berry:#7a4bd6;
  --display:"Fredoka","Trebuchet MS",sans-serif;--body:"Nunito","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{display:flex;flex-direction:column;overflow:hidden;color:var(--ink);font:700 14px/1.4 var(--body);
  background:linear-gradient(180deg,#a9dcff 0,#d9f3c8 26%,#8fd06b 60%,#5aa845 100%);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--berry);outline-offset:2px}
.top{display:flex;align-items:center;gap:10px;padding:8px 14px;background:#2f6b3aee;color:#fff;flex:0 0 auto;z-index:5;box-shadow:0 2px 10px #0003}
.back{display:grid;place-items:center;width:36px;height:36px;border-radius:12px;background:#ffffff26;text-decoration:none;color:#fff;font-size:18px}
.title{font:700 21px var(--display);letter-spacing:.01em;white-space:nowrap}
.wallet{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.chip{display:flex;align-items:baseline;gap:6px;padding:5px 12px;border-radius:999px;background:var(--cream);color:var(--ink);font:700 16px var(--display);white-space:nowrap;box-shadow:inset 0 -2px 0 #0001}
.chip small{font:800 11px var(--body);color:var(--ink2)}
.chip.sun{background:#fff3b0}
.iconbtn{padding:0 12px;height:36px;border-radius:12px;background:#ffffff26;color:#fff;font:700 13px var(--display)}
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(340px,48%) 1fr;gap:14px;padding:14px}
.field,.panel{min-width:0}
.field{position:relative;display:flex;flex-direction:column;gap:10px;min-height:0;padding:12px;border-radius:22px;background:#ffffff40;border:2px solid #ffffff66}
.banner{display:flex;gap:8px;flex-wrap:wrap}
.badge{padding:5px 12px;border-radius:999px;background:var(--sun);color:var(--ink);font:700 13px var(--display);box-shadow:0 2px 0 var(--sun-dk)}
.badge.rain{background:var(--sky);box-shadow:0 2px 0 #4a9fd0}
.picker{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;flex:0 0 auto}
.seed{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border-radius:14px;background:var(--cream);border:2px solid transparent;font:700 13px var(--display);color:var(--ink);text-align:left}
.seed svg{width:30px;height:30px}
.seed[aria-pressed="true"]{border-color:var(--berry);background:#efe6ff}
.seed small{display:block;font:800 10px var(--body);color:var(--ink2);line-height:1}
.plots{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));grid-auto-rows:min-content;gap:10px;padding:4px;align-content:start}
.plot{position:relative;aspect-ratio:1;border-radius:16px;background:radial-gradient(circle at 50% 30%,#a8733a,var(--soil) 55%,var(--soil-dk));box-shadow:inset 0 -6px 0 #0003,0 3px 0 #0003;overflow:hidden;touch-action:manipulation;transition:transform .08s}
.plot:active{transform:scale(.95)}
.plot .crop{position:absolute;inset:6% 6% 14% 6%}
.plot .crop svg{width:100%;height:100%;display:block;filter:drop-shadow(0 3px 2px #0004)}
.plot .empty{position:absolute;inset:0;display:grid;place-items:center;color:#ffffff66;font:700 30px var(--display)}
.plot .bar{position:absolute;left:10%;right:10%;bottom:7%;height:7px;border-radius:9px;background:#0005;overflow:hidden}
.plot .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#9be564,#4cc13c)}
.plot.ready{box-shadow:inset 0 -6px 0 #0003,0 3px 0 #0003,0 0 0 3px var(--sun),0 0 22px #ffd23fcc;animation:glow 1.1s ease-in-out infinite}
.plot.ready .crop{animation:bob .9s ease-in-out infinite}
.plot.ready .bar{display:none}
@keyframes glow{50%{box-shadow:inset 0 -6px 0 #0003,0 3px 0 #0003,0 0 0 3px #fff0a8,0 0 34px #ffd23f}}
@keyframes bob{50%{transform:translateY(-4px) scale(1.04)}}
.float{position:absolute;left:50%;top:30%;transform:translateX(-50%);font:700 18px var(--display);color:#fff;text-shadow:0 2px 0 #0007,0 0 8px #0006;pointer-events:none;animation:rise .9s ease-out forwards;white-space:nowrap;z-index:3}
.float.gold{color:var(--sun)}
@keyframes rise{to{transform:translate(-50%,-46px);opacity:0}}
.actions{display:flex;gap:8px;flex:0 0 auto}
.big{flex:1;padding:12px;border-radius:16px;font:700 17px var(--display);color:#fff;background:linear-gradient(180deg,#58c84a,var(--leaf-dk));box-shadow:0 4px 0 #1d5a20;touch-action:manipulation}
.big.plant{background:linear-gradient(180deg,#b27a43,var(--soil-dk));box-shadow:0 4px 0 #3b230d}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 #0006}
.cloud{position:absolute;top:2px;left:20%;width:110px;height:56px;z-index:4;animation:drift 18s linear forwards;touch-action:manipulation}
.cloud::before{content:"";position:absolute;inset:8px 0 0 0;border-radius:40px;background:#fff;box-shadow:-22px 8px 0 -4px #fff,26px 6px 0 -2px #fff,0 0 20px #4aa3e0aa}
.cloud span{position:absolute;inset:0;display:grid;place-items:center;font:700 12px var(--display);color:#2b6a9c}
@keyframes drift{from{transform:translateX(-30px)}to{transform:translateX(60px)}}
.rainfx{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:22px;z-index:2;background:linear-gradient(180deg,#4aa3e022,transparent)}
.rainfx i{position:absolute;top:-20px;width:2px;height:16px;background:#7cc4ffcc;border-radius:2px;animation:drop .7s linear infinite}
@keyframes drop{to{transform:translateY(520px)}}
.panel{display:flex;flex-direction:column;min-height:0;border-radius:22px;background:var(--cream);box-shadow:0 4px 0 #0002;overflow:hidden}
.tabs{display:flex;gap:4px;padding:8px 8px 0;background:var(--cream2);flex:0 0 auto;overflow-x:auto}
.tab{padding:9px 14px;border-radius:12px 12px 0 0;font:700 15px var(--display);color:var(--ink2);white-space:nowrap}
.tab[aria-selected="true"]{background:var(--cream);color:var(--ink)}
.tab .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--rose);margin-left:5px;vertical-align:middle}
.body{flex:1;min-height:0;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.sec{font:700 13px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin:6px 2px 0}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:12px;background:var(--cream2);align-self:flex-start}
.seg button{padding:5px 12px;border-radius:9px;color:var(--ink2);font:700 13px var(--display)}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 0 #0002}
.card{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;background:#fff;border:2px solid var(--line)}
.card .ic{flex:0 0 46px;width:46px;height:46px;border-radius:14px;background:var(--cream2);display:grid;place-items:center;font:700 22px var(--display);color:var(--leaf-dk)}
.card .ic svg{width:38px;height:38px}
.card .tx{flex:1;min-width:0}
.card .nm{font:700 16px var(--display)}
.card .ds{color:var(--ink2);font-size:12.5px;font-weight:700}
.card .lv{font:800 11px var(--body);color:var(--leaf-dk)}
.buy{flex:0 0 auto;min-width:96px;padding:8px 10px;border-radius:12px;font:700 14px var(--display);background:#d8d2b8;color:#8a8266;text-align:center;touch-action:manipulation;transition:transform .06s}
.buy small{display:block;font:800 10px var(--body);opacity:.85}
.buy.afford{background:linear-gradient(180deg,#58c84a,var(--leaf-dk));color:#fff;box-shadow:0 3px 0 #1d5a20}
.buy.afford:active{transform:translateY(2px)}
.buy.sunbuy.afford{background:linear-gradient(180deg,#ffd23f,var(--sun-dk));color:var(--ink);box-shadow:0 3px 0 #9a6c00}
.card.locked{opacity:.55}
.card.maxed .buy{background:#cfe9c8;color:var(--leaf-dk);box-shadow:none}
.tier{display:flex;flex-direction:column;gap:8px;position:relative}
.tier+.tier::before{content:"";align-self:center;width:3px;height:14px;background:var(--line);border-radius:2px;margin-top:-4px}
.fest{padding:14px;border-radius:18px;background:linear-gradient(180deg,#fff3b0,#ffe27a);border:2px solid var(--sun-dk);display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.fest h3{margin:0;font:700 20px var(--display)}
.fest p{margin:0;color:var(--ink2);font-size:13px}
.fest .gain{font:700 26px var(--display);color:var(--ink)}
.ach{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:14px;background:#fff;border:2px solid var(--line)}
.ach.done{border-color:var(--leaf);background:#effbe8}
.ach .mk{flex:0 0 26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--cream2);color:var(--ink2);font:700 14px var(--display)}
.ach.done .mk{background:var(--leaf);color:#fff}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{padding:10px 12px;border-radius:14px;background:#fff;border:2px solid var(--line)}
.stat b{display:block;font:700 18px var(--display)}
.stat span{color:var(--ink2);font-size:12px}
.toasts{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;z-index:30;pointer-events:none}
.toast{padding:8px 16px;border-radius:999px;background:#2f6b3a;color:#fff;font:700 14px var(--display);box-shadow:0 4px 14px #0005;animation:in .25s ease-out}
@keyframes in{from{transform:translateY(12px);opacity:0}}
.modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:#0008;padding:16px}
.modal .box{max-width:380px;width:100%;padding:20px;border-radius:20px;background:var(--cream);box-shadow:0 12px 40px #0008;display:flex;flex-direction:column;gap:12px}
.modal h2{margin:0;font:700 22px var(--display)}
.modal p{margin:0;color:var(--ink2)}
.modal .row{display:flex;gap:8px;justify-content:flex-end}
.modal .row button{padding:9px 16px;border-radius:12px;font:700 15px var(--display);background:var(--cream2)}
.modal .row .ok{background:linear-gradient(180deg,#58c84a,var(--leaf-dk));color:#fff}
.modal .row .danger{background:var(--rose);color:#fff}
.chip.gem{background:#e3f6ff}
.scene{position:relative;flex:0 0 auto;aspect-ratio:800/160;min-height:96px;max-height:190px;border-radius:16px;overflow:hidden;box-shadow:inset 0 0 0 2px #ffffff66,0 3px 0 #0002;background:#7ec8ff}
.scene .sky{position:absolute;inset:0}
.scene .stars{position:absolute;inset:0 0 40% 0;opacity:0;transition:opacity 2s;background-image:radial-gradient(1.5px 1.5px at 12% 20%,#fff,transparent),radial-gradient(1.5px 1.5px at 30% 55%,#fff,transparent),radial-gradient(2px 2px at 52% 18%,#fff,transparent),radial-gradient(1.5px 1.5px at 70% 40%,#fff,transparent),radial-gradient(1.5px 1.5px at 88% 15%,#fff,transparent),radial-gradient(1.5px 1.5px at 40% 10%,#fff,transparent),radial-gradient(1.5px 1.5px at 94% 52%,#fff,transparent)}
.scene .orb{position:absolute;width:30px;height:30px;border-radius:50%;transform:translate(-50%,-50%);transition:left 1s linear,top 1s linear}
.scene .orb.sun{background:radial-gradient(circle,#fff6b0 30%,#ffd23f 70%);box-shadow:0 0 24px 8px #ffd23f99}
.scene .orb.moon{background:radial-gradient(circle at 35% 35%,#fff,#dfe6ff 70%);box-shadow:0 0 22px 6px #cfd8ff88}
.scene .clouds i{position:absolute;top:14%;width:56px;height:18px;border-radius:20px;background:#fffc;box-shadow:16px -7px 0 -2px #fffc,-14px -4px 0 -4px #fffc;animation:cdrift 70s linear infinite}
.scene .clouds i:nth-child(2){top:30%;animation-duration:95s;animation-delay:-40s;transform:scale(.8)}
.scene .clouds i:nth-child(3){top:8%;animation-duration:120s;animation-delay:-80s;transform:scale(1.2)}
@keyframes cdrift{from{left:-80px}to{left:105%}}
.scene svg#land{position:absolute;inset:0;width:100%;height:100%}
.scene .critters{position:absolute;inset:0;pointer-events:none}
.scene .seasonTag{position:absolute;left:8px;top:6px;padding:2px 10px;border-radius:999px;background:#0000002e;color:#fff;font:700 12px var(--display);backdrop-filter:blur(2px)}
.an{position:absolute;pointer-events:none;width:34px;height:28px;animation:walk 20s linear infinite}
.an svg{width:100%;height:100%;display:block;animation:hop .7s ease-in-out infinite}
.an.bee svg{animation:hop .35s ease-in-out infinite}
@keyframes walk{0%{transform:translateX(0) scaleX(1)}49%{transform:translateX(34px) scaleX(1)}50%{transform:translateX(34px) scaleX(-1)}99%{transform:translateX(0) scaleX(-1)}100%{transform:translateX(0) scaleX(1)}}
@keyframes hop{50%{transform:translateY(-2px)}}
.bub{position:absolute;left:5px;top:-17px;width:22px;height:22px;border-radius:50%;pointer-events:auto;background:radial-gradient(circle at 35% 30%,#fff7b8,#ffd23f 60%,#d99a00);border:2px solid #fff;box-shadow:0 0 10px #ffd23f;animation:pulse .8s ease-in-out infinite;touch-action:manipulation}
@keyframes pulse{50%{transform:scale(1.18)}}
.bfly{position:absolute;width:30px;height:26px;pointer-events:auto;z-index:4;animation:fly 11s linear forwards;filter:drop-shadow(0 0 6px #ffd23f)}
.bfly svg{width:100%;height:100%;animation:flap .25s ease-in-out infinite alternate}
@keyframes fly{0%{left:-8%;top:55%}25%{top:25%}50%{top:60%}75%{top:30%}100%{left:105%;top:50%}}
@keyframes flap{to{transform:scaleX(.55)}}
.shade{position:absolute;inset:0;pointer-events:none;background:#0a1240;opacity:0;transition:opacity 2s;z-index:2}
.fx{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.field[data-night="1"] .plots{filter:brightness(.82) saturate(.9)}
.fx .pt{position:absolute;top:-12px;opacity:.9;animation:fall 9s linear infinite}
.fx.petal .pt{width:9px;height:6px;border-radius:60% 40%;background:#ffb3d1}
.fx.leaf .pt{width:9px;height:9px;border-radius:0 70% 0 70%;background:#e8742a}
.fx.snow .pt{width:6px;height:6px;border-radius:50%;background:#fff;animation-duration:12s}
.fx.glow .pt{width:5px;height:5px;border-radius:50%;background:#fff6a0;box-shadow:0 0 8px 3px #ffe35a;top:auto;animation:fire 5s ease-in-out infinite}
.fx.dust .pt{width:3px;height:3px;border-radius:50%;background:#fff8;animation:fire 7s ease-in-out infinite;top:auto}
@keyframes fall{from{top:-8px;transform:translateX(0) rotate(0)}to{top:100%;transform:translateX(34px) rotate(360deg)}}
@keyframes fire{0%,100%{transform:translate(0,0);opacity:.1}30%{opacity:1}50%{transform:translate(20px,-24px);opacity:.9}80%{transform:translate(-14px,-10px);opacity:.3}}
.field[data-season="3"] .plot{filter:saturate(.8) brightness(1.1)}
.field[data-season="2"] .plot{filter:saturate(1.1) hue-rotate(-8deg)}
.plot .crop svg{transform-origin:50% 90%;animation:sway 3.2s ease-in-out infinite}
.plot:nth-child(2n) .crop svg{animation-delay:-1.1s}
.plot:nth-child(3n) .crop svg{animation-delay:-2.2s}
@keyframes sway{50%{transform:rotate(2.5deg)}}
.plot.ready .crop svg{animation:none}
.spark{position:absolute;width:7px;height:7px;border-radius:50%;pointer-events:none;z-index:4;animation:burst .7s ease-out forwards}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
@keyframes wm{to{transform:rotate(360deg)}}
@keyframes swing{50%{transform:rotate(6deg)}}
.chm{animation:swing 3s ease-in-out infinite}
.lant circle{animation:lantern 2.4s ease-in-out infinite}
@keyframes lantern{50%{opacity:.55}}
.rainbow{position:absolute;left:0;right:0;top:0;height:100%;pointer-events:none;z-index:1;opacity:.55;background:radial-gradient(ellipse 70% 110% at 50% 100%,transparent 55%,#ff595e66 56%,#ffca3a66 62%,#8ac92666 68%,#1982c466 74%,#6a4c9366 80%,transparent 81%)}
.prog{height:8px;border-radius:9px;background:#e8e0bf;overflow:hidden;margin-top:4px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#9be564,#4cc13c)}
.card .ic.sp{background:none;width:46px}
.card .ic.sp svg{width:44px;height:36px}
.branch{display:flex;align-items:baseline;gap:8px;margin:12px 2px 2px;font:700 16px var(--display);color:var(--leaf-dk)}
.branch span{font:700 12px var(--body);color:var(--ink2)}
.tree{display:flex;flex-direction:column;gap:8px;position:relative;padding-left:2px}
.tnode{position:relative;margin-left:calc(var(--d,0)*16px)}
.tnode+.tnode::before{content:"";position:absolute;left:-10px;top:-12px;width:10px;height:34px;border-left:3px solid var(--line);border-bottom:3px solid var(--line);border-radius:0 0 0 8px}
.tnode.off .card{opacity:.5}
.cutHost,.farmHost{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:#05100acc;padding:10px}
.cut{width:min(920px,100%);display:flex;flex-direction:column;gap:8px}
.cutTitle{color:#fff;font:700 18px var(--display);text-align:center;text-shadow:0 2px 0 #0006}
.cutStage{width:100%;aspect-ratio:16/9;border-radius:18px;border:4px solid #fff;box-shadow:0 12px 40px #0008;background:#7ec8ff;display:block}
.cutStage.in{animation:cutin .45s ease-out}
@keyframes cutin{from{opacity:.2;transform:scale(1.03)}}
.cutStage svg{animation:cbob 2.6s ease-in-out infinite}
.cutStage svg:nth-of-type(2n){animation-delay:-1.2s}
@keyframes cbob{50%{transform:translateY(-2px)}}
.spin{animation:spinr 14s linear infinite}
@keyframes spinr{to{transform:rotate(360deg)}}
.cutBox{background:var(--cream);border:3px solid var(--ink);border-radius:16px;padding:10px 14px;min-height:76px;box-shadow:0 4px 0 #0004}
.cutWho{font:700 15px var(--display);color:var(--leaf-dk);margin-bottom:2px}
.cutText{font:700 17px/1.4 var(--body);color:var(--ink)}
.cutBtns{display:flex;align-items:center;gap:8px}
.cutDots{flex:1;display:flex;gap:6px}
.cutDots i{width:10px;height:10px;border-radius:50%;background:#ffffff55}
.cutDots i.on{background:#ffd23f}.cutDots i.done{background:#ffffffcc}
.cbtn{padding:9px 20px;border-radius:12px;background:linear-gradient(180deg,#58c84a,var(--leaf-dk));color:#fff;font:700 16px var(--display);box-shadow:0 3px 0 #1d5a20}
.cbtn.alt{background:#ffffff33;box-shadow:none}
.fv{width:min(1100px,100%);height:min(720px,100%);display:flex;flex-direction:column;gap:8px;background:var(--cream);border-radius:20px;padding:10px;box-shadow:0 14px 50px #0009;overflow:hidden}
.fvTop{display:flex;align-items:center;gap:10px}
.fvTitle{font:700 22px var(--display);flex:1}
.fvCoins{padding:5px 12px;border-radius:999px;background:#fff3b0;font:700 15px var(--display)}
.fvBack,.fvClose{height:36px;padding:0 14px;border-radius:12px;background:var(--cream2);font:700 14px var(--display)}
.fvMain{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:10px}
.fvMapWrap{position:relative;min-height:0;display:grid;place-items:center;background:#4f9e3e;border-radius:16px;padding:8px;overflow:hidden}
.fvMap{display:grid;grid-template-columns:repeat(14,1fr);grid-template-rows:repeat(9,1fr);gap:2px;width:100%;max-height:100%;aspect-ratio:14/9;margin:auto}
.fcrit{position:absolute;inset:8px;pointer-events:none}
.fcrit .an{width:30px;height:26px}
.fcell{position:relative;border:0;padding:0;border-radius:6px;min-width:0;min-height:0;display:grid;place-items:center}
.fcell svg{width:92%;height:92%;display:block}
.fcell.grass{background:#7ec45a}.fcell.grass.alt{background:#76bb53}
.fcell.grass:hover{outline:3px solid #fff8;z-index:1}
.fcell.fld{background:radial-gradient(circle at 50% 30%,#a8733a,var(--soil) 60%,var(--soil-dk))}
.fcell.fld.lockd{background:#6b8f55;opacity:.6}
.fcell.fld.ready{box-shadow:inset 0 0 0 2px var(--sun),0 0 10px #ffd23fcc}
.fcell.barn{background:#7ec45a;border-radius:10px}
.fcell.barn svg{width:100%;height:100%}
.fcell .blv{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);padding:1px 8px;border-radius:999px;background:#fffbea;font:700 11px var(--display)}
.fvSide{display:flex;flex-direction:column;gap:8px;min-height:0}
.fvBarn{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:14px;background:#fff;border:2px solid var(--line)}
.fvBarn .bt{flex:1;display:flex;flex-direction:column}.fvBarn small{color:var(--ink2);font-size:11px}
.fvTools{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:5px}
.ftool{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:12px;background:#fff;border:2px solid var(--line);text-align:left;font:700 13px var(--display)}
.ftool i{flex:0 0 30px;height:30px}.ftool i svg{width:100%;height:100%}
.ftool span{display:flex;flex-direction:column}.ftool small{font:700 11px var(--body);color:var(--ink2)}
.ftool.sel{border-color:var(--berry);background:#efe6ff}
.ftool.ok{border-color:var(--leaf)}
.ftool:disabled{opacity:.5}
.fvHint{padding:8px 10px;border-radius:12px;background:#fff3b0;font-size:12px}
@media (max-width:820px){.fvMain{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) 210px}.fv{height:100%}.fvTools{flex-direction:row;flex-wrap:wrap}.ftool{flex:1 1 46%}}
@media (max-width:820px){
  .main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,54%) minmax(0,1fr);gap:8px;padding:8px}
  .field{padding:8px;gap:6px}
  .plots{grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:7px}
  .scene{aspect-ratio:auto;height:62px;min-height:0}
  .banner{flex-wrap:nowrap;overflow-x:auto;flex:0 0 auto}
  .badge{white-space:nowrap;font-size:12px;padding:3px 9px}
  .seed{padding:3px 8px 3px 3px}
  .seed svg{width:24px;height:24px}
  .big{padding:7px;font-size:14px}
  .seasonTag{font-size:10px;padding:1px 7px}
  .an{width:22px;height:18px}
  .an{width:26px;height:22px}
  .big{padding:9px;font-size:15px}
  .title{font-size:18px}
  .chip{padding:4px 9px;font-size:14px}
  .top{gap:6px;padding:6px 10px}
}
@media (prefers-reduced-motion:reduce){.an,.an svg,.fx .pt,.clouds i,.plot .crop svg,.bub,.bfly{animation:none!important}.plot.ready,.plot.ready .crop,.rainfx i,.cloud{animation:none}}
</style>
<script src="leaderboard.js" data-game-key="farm-idle" defer></script>
</head>
<body>
<header class="top">
  <a class="back" href="../douggames.html" aria-label="Back to games">&larr;</a>
  <div class="title">Farm Idle</div>
  <div class="wallet">
    <div class="chip" title="Coins"><span id="coins">0</span><small>coins</small></div>
    <div class="chip gem" id="gemChip" hidden title="Gems: buy permanent farm decorations"><span id="gems">0</span><small>gems</small></div>
    <div class="chip" id="goldChip" hidden style="background:#ffe08a" title="Golden seeds: super rebirth currency"><span id="gold">0</span><small>golden seeds</small></div>
    <div class="chip sun" id="sunChip" hidden title="Sunseeds: permanent upgrade currency"><span id="sunseeds">0</span><small>sunseeds</small></div>
  </div>
  <button class="iconbtn" id="soundBtn" type="button">Sound on</button>
</header>
<main class="main">
  <section class="field" id="field" aria-label="Your farm">
    <div class="scene" id="scene" aria-label="Your farm scenery"><div class="sky" id="sky"></div><div class="stars" id="stars"></div><div class="orb" id="orb"></div><div class="clouds"><i></i><i></i><i></i></div><svg id="land" viewBox="0 40 800 160" preserveAspectRatio="xMidYMax slice"></svg><div class="critters" id="critters"></div><div class="shade" id="shade"></div><div class="fx" id="fx"></div><div class="seasonTag" id="seasonTag"></div></div>
    <div class="banner" id="banner"></div>
    <div class="picker" id="picker" aria-label="Choose what to plant"></div>
    <div class="plots" id="plots"></div>
    <div class="actions">
      <button class="big plant" id="plantAll" type="button">Plant all</button>
      <button class="big" id="harvestAll" type="button">Harvest all</button>
    </div>
  </section>
  <aside class="panel">
    <div class="tabs" role="tablist" id="tabs">
      <button class="tab" role="tab" data-tab="up" aria-selected="true">Upgrades</button>
      <button class="tab" role="tab" data-tab="ranch" aria-selected="false">Ranch</button>
      <button class="tab" role="tab" data-tab="build" aria-selected="false">Build</button>
      <button class="tab" role="tab" data-tab="farm" aria-selected="false">My Farm</button>
      <button class="tab" role="tab" data-tab="orders" aria-selected="false">Orders <span class="dot" id="ordDot" hidden></span></button>
      <button class="tab" role="tab" data-tab="fest" aria-selected="false">Festival <span class="dot" id="festDot" hidden></span></button>
      <button class="tab" role="tab" data-tab="legacy" aria-selected="false">Golden Era <span class="dot" id="legDot" hidden></span></button>
      <button class="tab" role="tab" data-tab="ach" aria-selected="false">Awards</button>
    </div>
    <div class="body" id="body"></div>
  </aside>
</main>
<div class="toasts" id="toasts"></div>
<div id="modalHost"></div>
<div id="farmHost" class="farmHost" hidden></div>
<div id="cutHost" class="cutHost" hidden></div>
<script src="farm-idle.js?v=4"></script>
</body>
</html>
