<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080b18"><title>DougHub Wordle</title><link rel="icon" href="../DougHub.svg" type="image/x-icon"><style>
:root{color-scheme:dark;--muted:#a5abc7;--green:#55b887;--yellow:#d8b44e;--gray:#34394d}*{box-sizing:border-box}body{margin:0;min-height:100svh;padding:58px 14px 30px;background:radial-gradient(circle at 15% 8%,#24265a 0,transparent 36%),radial-gradient(circle at 88% 85%,#35184f 0,transparent 35%),#080b18;font-family:Inter,system-ui,"Segoe UI",sans-serif;color:#f8f8ff;display:flex;justify-content:center;touch-action:manipulation}a{color:inherit;text-decoration:none}.page{width:min(560px,100%);display:flex;flex-direction:column;align-items:center;gap:15px}.top{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px}.back{padding:9px 12px;border:1px solid #ffffff20;border-radius:10px;background:#ffffff0a;color:#d9d9ef;font-size:12px;font-weight:800}.brand{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:900;letter-spacing:.12em;color:#d9d7ff}.brand img{width:30px;height:30px}.title{text-align:center;margin:0}.title h1{margin:0;font-size:34px;letter-spacing:-.06em}.title p{margin:5px 0 0;color:var(--muted);font-size:12px}.daily{font-size:9px;font-weight:900;letter-spacing:.15em;color:#aaa8ff}.board{display:grid;grid-template-rows:repeat(6,1fr);gap:6px;width:min(320px,100%);aspect-ratio:5/6;margin:2px auto}.guess-row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.tile{display:grid;place-items:center;border:2px solid #444a60;border-radius:7px;background:#11162b;font-size:clamp(22px,7vw,29px);font-weight:900;text-transform:uppercase;user-select:none}.tile.filled{border-color:#8188a5;animation:pop .09s ease}.tile.correct{background:var(--green);border-color:var(--green)}.tile.present{background:var(--yellow);border-color:var(--yellow);color:#111}.tile.absent{background:var(--gray);border-color:var(--gray)}@keyframes pop{50%{transform:scale(1.06)}}.keyboard{width:100%;display:grid;gap:7px}.key-row{display:flex;justify-content:center;gap:5px}.key{height:52px;min-width:0;flex:1;max-width:43px;border:0;border-radius:6px;background:#747b91;color:white;font-size:13px;font-weight:900;cursor:pointer}.key.wide{max-width:68px;font-size:10px}.key.correct{background:var(--green)}.key.present{background:var(--yellow);color:#111}.key.absent{background:#34394d}.key:active{transform:scale(.96)}.message{min-height:22px;color:#e5e4ff;font-size:12px;font-weight:800;text-align:center}.footer{display:flex;align-items:center;gap:12px;color:#8289a8;font-size:10px}.footer button{border:1px solid #ffffff20;border-radius:9px;padding:7px 10px;background:#ffffff0a;color:#c9c9e4;font-size:10px;font-weight:800;cursor:pointer}.share{display:none}.share.show{display:inline-flex}.help{max-width:360px;color:#8f96b5;font-size:10px;line-height:1.5;text-align:center}.help b{color:#c9c7f8}@media(max-width:390px){body{padding:48px 10px 20px}.board{width:min(300px,100%)}.key{height:47px;font-size:12px}.key.wide{font-size:9px}}
</style></head><body><main class="page"><div class="top"><a class="back" href="../douggames.html#daily-games">← Daily Games</a><div class="brand"><img src="art/wordle.svg" alt=""> DOUGHUB ARCADE</div></div><div class="title"><div class="daily" id="dailyNumber">DAILY WORD</div><h1>DougHub Wordle</h1><p>Find the five-letter word in six guesses.</p></div><div class="board" id="board" role="group" aria-label="Six rows of five letter tiles"></div><div class="keyboard" id="keyboard" aria-label="On-screen keyboard"></div><div class="message" id="message" role="status" aria-live="polite">Type a word to begin.</div><div class="footer"><span id="attempts">0 / 6 guesses</span><button id="share" class="share" type="button">Copy result</button><button id="reset" type="button">New day info</button></div><p class="help">Green means the letter is in the right place. Gold means it belongs somewhere else. Gray means it is not in the word. A new word arrives at 00:00 UTC.</p></main>
<script>(()=>{"use strict";const words=["PLANT","BRICK","CLOUD","SHINE","GRAPE","MOUSE","TRAIL","CROWN","FLAME","OCEAN","BRAIN","SHELF","NIGHT","PEARL","STONE","LIGHT","QUEST","ROBOT","SMILE","TRAIN","WORLD","FROST","DREAM","SOUND","CHARM","SPACE","JUICE","FRAME","TIGER","WATER","HONEY","PIANO","GREEN","BLINK","CRANE","SWEET","HEART","MUSIC","BREAD","SNAIL","CLOCK","FIELD","MAGIC","RIVER","STORM","LEMON","CANDY","GHOST","QUICK","ZEBRA","SOLAR","BERRY","MARCH","PIXEL","NORTH","SOUTH","WHALE","CYCLE","STACK","TOWER","MINTY","BRAVE","QUIET","SHARD"];const now=new Date(),epoch=Date.UTC(2026,0,1),day=Math.floor((Date.UTC(now.getUTCFullYear(),now.getUTCMonth(),now.getUTCDate())-epoch)/86400000),answer=words[((day%words.length)+words.length)%words.length],date=now.toISOString().slice(0,10),saveKey="dh-wordle-"+date,completeKey="dh-daily-complete-"+date;document.getElementById("dailyNumber").textContent="DAILY WORD · "+String(day+1).padStart(3,"0");let guesses=[],current="",finished=false,states={},saved=null;try{saved=JSON.parse(localStorage.getItem(saveKey)||"null");}catch(e){}if(saved&&Array.isArray(saved.guesses)){guesses=saved.guesses.slice(0,6);finished=!!saved.finished;states=saved.states||{};}const board=document.getElementById("board"),keyboard=document.getElementById("keyboard"),message=document.getElementById("message"),attempts=document.getElementById("attempts"),share=document.getElementById("share"),rows=["QWERTYUIOP","ASDFGHJKL","ZXCVBNM"],tiles=[];for(let r=0;r<6;r++){const row=document.createElement("div");row.className="guess-row";for(let c=0;c<5;c++){const tile=document.createElement("div");tile.className="tile";tiles.push(tile);row.append(tile);}board.append(row);}function makeKey(label,extra,fn){const b=document.createElement("button");b.type="button";b.className="key "+extra;b.textContent=label;b.addEventListener("click",fn);return b;}function buildKeyboard(){rows.forEach((letters,i)=>{const row=document.createElement("div");row.className="key-row";if(i===2)row.append(makeKey("ENTER","wide",submit));for(const l of letters)row.append(makeKey(l,"",()=>add(l)));if(i===2)row.append(makeKey("⌫","wide",remove));keyboard.append(row);});}function evaluate(word){const out=Array(5).fill("absent"),left=answer.split("");for(let i=0;i<5;i++)if(word[i]===answer[i]){out[i]="correct";left[i]=null;}for(let i=0;i<5;i++)if(out[i]!=="correct"){const at=left.indexOf(word[i]);if(at>=0){out[i]="present";left[at]=null;}}return out;}function render(){for(let r=0;r<6;r++){const val=guesses[r]||(r===guesses.length?current:"");for(let c=0;c<5;c++){const t=tiles[r*5+c];t.textContent=val[c]||"";t.className="tile"+(val[c]?" filled":"");if(guesses[r])t.classList.add(evaluate(guesses[r])[c]);}}for(const k of keyboard.querySelectorAll(".key")){const l=k.textContent;if(l.length===1&&states[l])k.classList.add(states[l]);}attempts.textContent=guesses.length+" / 6 guesses";share.classList.toggle("show",finished);}function say(t){message.textContent=t;}function save(){try{localStorage.setItem(saveKey,JSON.stringify({guesses,finished,states}));}catch(e){}}function add(l){if(!finished&&current.length<5){current+=l;render();}}function remove(){if(!finished){current=current.slice(0,-1);render();}}function submit(){if(finished)return;if(current.length!==5){say("Enter five letters first.");return;}const w=current.toUpperCase();guesses.push(w);current="";const res=evaluate(w),rank={absent:1,present:2,correct:3};for(let i=0;i<5;i++)if(!states[w[i]]||rank[res[i]]>rank[states[w[i]]])states[w[i]]=res[i];if(w===answer){finished=true;say("You got it! Today's word is solved.");markDaily();}else if(guesses.length===6){finished=true;say("The word was "+answer+". Come back tomorrow.");}else say("Not quite. Try again.");save();render();}function markDaily(){try{const list=JSON.parse(localStorage.getItem(completeKey)||"[]");if(!list.includes("wordle"))list.push("wordle");localStorage.setItem(completeKey,JSON.stringify(list));}catch(e){}}function copy(){const result=guesses.map(w=>evaluate(w).map(s=>s==="correct"?"🟩":s==="present"?"🟨":"⬛").join("")).join("\n");const text="DougHub Wordle "+(day+1)+" "+guesses.length+"/6\n"+result;if(navigator.clipboard?.writeText)navigator.clipboard.writeText(text).then(()=>say("Result copied!")).catch(()=>say("Copy is unavailable."));else say("Copy is unavailable.");}document.addEventListener("keydown",e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;if(e.key==="Enter"){e.preventDefault();submit();}else if(e.key==="Backspace")remove();else if(/^[a-z]$/i.test(e.key))add(e.key.toUpperCase());});share.addEventListener("click",copy);document.getElementById("reset").addEventListener("click",()=>say("Your daily word resets at 00:00 UTC."));buildKeyboard();if(finished){if(guesses.includes(answer)){say("You solved today's word. Come back tomorrow.");markDaily();}else say("Today's word was "+answer+". Come back tomorrow.");}render();})();</script><script src="../game-art.js"></script></body></html>
