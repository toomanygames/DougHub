<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<script src="no-zoom.js"></script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Pig Clicker</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(180deg, #fef3c7 0%, #f9a8d4 40%, #fdba74 100%);
      color: #2f1b12;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Arial, sans-serif;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(18px, env(safe-area-inset-top)) 12px max(18px, env(safe-area-inset-bottom));
    }

    .screen {
      width: min(980px, 100%);
      height: min(100vh - 24px, 860px);
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(88,38,20,0.12);
      border-radius: 28px;
      box-shadow: 0 16px 40px rgba(70,30,15,0.22);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255,255,255,0.18);
      padding: 12px 16px;
      border-bottom: 1px solid rgba(90,40,20,0.08);
      font-weight: 800;
    }

    .coins {
      font-size: clamp(20px, 3vw, 30px);
      letter-spacing: 0.04em;
    }

    .btn {
      appearance: none;
      border: none;
      border-radius: 18px;
      padding: 10px 18px;
      font-weight: 800;
      font-size: 16px;
      background: #fff7ed;
      color: #3b2319;
      box-shadow: 0 6px 12px rgba(0,0,0,0.08);
    }

    .content {
      display: flex;
      flex: 1;
      min-height: 0;
    }

    .left {
      flex: 1.2;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }

    .pig-wrap {
      width: min(70vw, 320px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      user-select: none;
      position: relative;
    }

    .pig {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      font-size: clamp(110px, 22vw, 210px);
      border-radius: 32px;
      background: radial-gradient(circle at 30% 30%, #fff7ed 0%, #fde68a 18%, #f3d5ab 30%, #f8c77a 100%);
      border: 3px solid rgba(90,40,20,0.12);
      box-shadow: inset 0 12px 24px rgba(255,255,255,0.5), 0 18px 35px rgba(116, 63, 17, 0.18);
      transition: transform 0.08s ease;
      position: relative;
      overflow: hidden;
      touch-action: manipulation;
    }

    .pig:active {
      transform: scale(0.96);
    }

    .pig::before {
      content: "";
      position: absolute;
      width: 50%;
      height: 28%;
      left: 25%;
      top: 18%;
      border-radius: 50%;
      background: rgba(255,255,255,0.25);
      filter: blur(10px);
    }

    .burst {
      position: absolute;
      font-size: 28px;
      font-weight: 900;
      color: #7c2d12;
      animation: floatUp 0.6s ease-out forwards;
      pointer-events: none;
    }

    @keyframes floatUp {
      0% {
        opacity: 1;
        transform: translateY(10px) scale(0.9);
      }

      100% {
        opacity: 0;
        transform: translateY(-52px) scale(1.3);
      }
    }

    .tap {
      font-size: clamp(20px, 3vw, 30px);
      font-weight: 900;
      text-align: center;
      letter-spacing: 0.04em;
    }

    .fever-label {
      font-size: 14px;
      font-weight: 800;
      text-align: center;
      opacity: 0.8;
    }

    .fever-hud {
      position: fixed;
      left: 14px;
      bottom: max(14px, env(safe-area-inset-bottom));
      width: min(220px, 42vw);
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .fever-hud .fever-label {
      text-align: left;
      color: #7c2d12;
    }

    .fever-bar {
      width: 100%;
      height: 14px;
      background: rgba(255,255,255,0.4);
      border: 1px solid rgba(90,40,20,0.18);
      border-radius: 999px;
      overflow: hidden;
    }

    .fever-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #f97316, #facc15);
      transition: width 0.15s ease;
    }

    .right {
      width: min(38vw, 390px);
      background: rgba(255,255,255,0.12);
      border-left: 1px solid rgba(90,40,20,0.08);
      padding: 16px 14px 20px;
      overflow: auto;
    }

    .panel {
      background: rgba(255,255,255,0.14);
      border: 1px solid rgba(90,40,20,0.08);
      border-radius: 20px;
      padding: 12px 12px 10px;
      margin-bottom: 12px;
    }

    .panel h3 {
      margin: 0 0 10px;
      font-size: 16px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .upg {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(90,40,20,0.08);
      border-radius: 14px;
      padding: 10px 10px;
      margin-bottom: 8px;
      min-height: 62px;
    }

    .upg.locked {
      opacity: 0.48;
    }

    .upg-info {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .upg-icon {
      width: 40px;
      height: 40px;
      flex: 0 0 40px;
      display: grid;
      place-items: center;
      font-size: 25px;
      background: rgba(255,255,255,0.34);
      border: 1px solid rgba(90,40,20,0.10);
      border-radius: 10px;
    }

    .upg-details {
      min-width: 0;
    }

    .upg-name {
      font-weight: 800;
      font-size: 15px;
    }

    .upg-cost {
      font-size: 12px;
      opacity: 0.8;
      margin-top: 2px;
    }

    .upg-btn {
      border: none;
      background: linear-gradient(180deg, #facc15, #f59e0b);
      color: #3b2319;
      border-radius: 12px;
      font-weight: 900;
      min-width: 72px;
      padding: 10px 10px;
      font-size: 12px;
    }

    .upg-btn:disabled {
      opacity: 0.45;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .stat {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(90,40,20,0.08);
      border-radius: 14px;
      padding: 10px;
      text-align: center;
      font-size: 12px;
    }

    .stat strong {
      display: block;
      font-size: 18px;
      margin-top: 2px;
    }

    .achievement {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: rgba(255,255,255,0.12);
      border-radius: 12px;
      border: 1px solid rgba(90,40,20,0.08);
      padding: 8px 10px;
      margin-bottom: 8px;
    }

    .achievement.locked {
      opacity: 0.48;
    }

    .achievement .title {
      font-weight: 800;
      font-size: 14px;
    }

    .achievement .reward {
      font-size: 11px;
      opacity: 0.8;
    }

    .achievement .badge {
      font-size: 18px;
    }

    /* Keep every label readable on the warm original palette. */
    .topbar, .coins, .tap, .panel, .panel h3, .stat, .stat strong,
    .upg-name, .upg-cost, .achievement .title, .achievement .reward {
      color: #3b2319;
      text-shadow: none;
    }

    .right {
      scrollbar-width: thin;
      scrollbar-color: #c65d83 rgba(255,255,255,0.24);
      overscroll-behavior: contain;
    }
    .right::-webkit-scrollbar { width: 10px; }
    .right::-webkit-scrollbar-track {
      background: rgba(255,255,255,0.24);
      border-radius: 999px;
      margin: 8px 2px;
    }
    .right::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #ec8db2, #d97706);
      border: 2px solid rgba(255,247,237,0.8);
      border-radius: 999px;
    }
    .right::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(180deg, #db6797, #b45309);
    }
    #rebirthButton {
      background: linear-gradient(180deg, #7c2d12, #431407) !important;
      color: #fff !important;
      text-shadow: 0 1px 2px rgba(0,0,0,0.45);
      border: 1px solid rgba(67,20,7,0.3);
    }
    #rebirthButton:disabled {
      opacity: 1;
      filter: saturate(0.8);
    }

    @media (max-width: 700px) {
      .content {
        flex-direction: column;
      }

      .right {
        width: 100%;
        border-left: none;
        border-top: 1px solid rgba(90,40,20,0.08);
      }

      .left {
        padding-bottom: 8px;
      }
    }
  </style>
  <script src="../nav.js?v=20261030-no-class" defer></script>

<body>
  <div class="screen">
    <div class="topbar">
      <div class="dh-game-brand"><img src="../DougHub.svg" alt="DougHub"><span>DougHub<small>ARCADE · PIG CLICKER</small></span></div>
      <div class="coins" id="coins">0 coins</div>
      <button class="btn" id="homeBtn" type="button">← Games</button>
    </div>

    <div class="fever-hud">
      <div class="fever-label" id="feverLabel">Fever ready</div>
      <div class="fever-bar">
        <div class="fever-fill" id="feverFill"></div>
      </div>
    </div>

    <div class="content">
      <div class="left">
        <div class="pig-wrap">
          <div class="pig" id="pig">🐷</div>
        </div>

        <div class="tap" id="tapText">+1 per tap</div>
      </div>

      <div class="right">
        <div class="panel">
          <h3>Stats</h3>

          <div class="stats">
            <div class="stat">
              Per tap
              <strong id="perTapStat">1</strong>
            </div>

            <div class="stat">
              Auto
              <strong id="autoStat">0/s</strong>
            </div>

            <div class="stat">
              Fever
              <strong id="feverStat">0%</strong>
            </div>

            <div class="stat">
              Rebirths
              <strong id="rebirthStat">0</strong>
            </div>
          </div>
        </div>

        <div class="panel">
          <h3>Store</h3>
          <div id="store"></div>
        </div>

        <div class="panel">
          <h3>Achievements</h3>
          <div id="achievements"></div>
        </div>

        <div class="panel" id="rebirthPanel">
          <h3>Rebirth</h3>

          <div style="font-size:13px; opacity:.8; margin-bottom:10px;">
            Reach 10,000 nonillion coins to unlock the Space Pig world.
          </div>

          <button
            class="btn"
            id="rebirthButton"
            disabled
            style="width:100%; background:linear-gradient(180deg,#6b7280,#4b5563); color:white;"
          >
            🔒 Reach 10,000 nonillion coins
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="pig-clicker.js"></script>

<script src="../game-analytics.js" data-game-key="builtin:pig-clicker" data-game-title="Pig Clicker"></script>
</body>
