<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seasonal Game • DougHub</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,Arial,sans-serif;color:#fff;background:radial-gradient(circle at top,#2d205d,transparent 45%),#02040a;display:flex;align-items:center;justify-content:center;padding:18px}.card{width:min(820px,100%);padding:26px;border:1px solid rgba(255,255,255,.1);border-radius:26px;background:rgba(13,17,39,.86);box-shadow:0 25px 80px #0008;text-align:center}h1{margin:0 0 7px;font-size:clamp(32px,7vw,56px)}p{color:#a7a9bb}.game{margin:22px 0;padding:20px;border-radius:20px;background:rgba(255,255,255,.045)}.stats{display:flex;justify-content:center;gap:26px;flex-wrap:wrap;margin-bottom:14px}.stat b{display:block;font-size:27px}.stat span{color:#858ba3;font-size:11px;font-weight:800}.arena{position:relative;width:100%;height:340px;overflow:hidden;border-radius:18px;background:linear-gradient(180deg,#15203b,#0a1021);border:1px solid rgba(255,255,255,.08);touch-action:none}.target{position:absolute;width:62px;height:62px;border:0;border-radius:50%;font-size:33px;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;box-shadow:0 8px 24px #0005;transition:transform .08s}.target:active{transform:scale(.86)}.hazard{position:absolute;font-size:30px;cursor:pointer;user-select:none;animation:drift 1.7s linear forwards}@keyframes drift{from{transform:translateX(0) rotate(0deg)}to{transform:translateX(180px) rotate(360deg)}}.tip{font-size:13px;color:#858ba3;min-height:20px;margin:10px}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}button{border:0;border-radius:12px;padding:11px 18px;color:#fff;background:linear-gradient(135deg,#6366f1,#a855f7);font-weight:800;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.leaderboard{text-align:left;margin-top:20px;padding:18px;border-radius:18px;background:rgba(255,255,255,.04)}.leaderboard h2{margin-top:0}.row{display:grid;grid-template-columns:42px 1fr auto;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.06)}.row:last-child{border:0}.muted{color:#858ba3}.reward{margin:10px 0;padding:10px;border-radius:12px;background:rgba(99,102,241,.1);color:#c4b5fd;font-weight:800}.links{margin-top:16px}.links a{color:#a5b4fc;text-decoration:none;margin:0 8px}
</style>
</head>
<body>
<div class="card">
<h1 id="title">🌞 Summer Splash</h1>
<p id="subtitle">Hit the seasonal targets before time runs out. Every completed game unlocks that season's badge.</p>
<div class="game">
<div class="stats"><div class="stat"><b id="score">0</b><span>SCORE</span></div><div class="stat"><b id="time">30</b><span>SECONDS</span></div><div class="stat"><b id="combo">x1</b><span>COMBO</span></div></div>
<div id="arena" class="arena"></div>
<div id="tip" class="tip">Press Start, then hit the moving target!</div>
<div class="actions"><button id="start">Start Game</button></div>
<div id="reward" class="reward" style="display:none"></div>
</div>
<div class="leaderboard"><h2>🏆 <span id="boardTitle">Season Leaderboard</span></h2><div id="board" class="muted">Loading...</div></div>
<div class="links"><a href="../../douggames.html">← Doug Games</a><a href="../../index.html">DougHub</a></div>
</div>
<script>
const URL="https://agsqdqcsmsppcdqxlppj.supabase.co";
const KEY="sb_publishable_Oq1WvEHgoHcjmCBGbEnoYQ_BqYA1p52";
const db=supabase.createClient(URL,KEY);

const games={
 summer:{title:"🌞 Summer Splash",desc:"Catch beach balls before they bounce away!",tip:"Click the beach balls as fast as you can!",icon:"🏖️",reward:"🏖️ Summer Badge",mode:"click"},
 spring:{title:"🌸 Spring Garden",desc:"Catch butterflies and blossoms in a blooming garden!",tip:"Catch butterflies for bigger combos!",icon:"🦋",reward:"🌸 Spring Badge",mode:"click"},
 fall:{title:"🍂 Leaf Dash",desc:"Catch falling leaves before the wind carries them away!",tip:"Leaves disappear quickly — keep your combo going!",icon:"🍂",reward:"🍂 Fall Badge",mode:"click"},
 winter:{title:"❄️ Snowball Frenzy",desc:"Smash snowballs before they pile up!",tip:"Snowballs get faster as your score rises!",icon:"☃️",reward:"❄️ Winter Badge",mode:"click"},
 halloween:{title:"🎃 Pumpkin Panic",desc:"Collect pumpkins and dodge the ghosts!",tip:"Pumpkins give points. Clicking a ghost costs points!",icon:"🎃",reward:"🎃 Halloween Badge",mode:"halloween"},
 christmas:{title:"🎅 Santa's Sleigh Race",desc:"Race Santa's sleigh through the snowy sky and beat the clock!",tip:"Use ← → or A/D to steer. Collect presents for bonus points!",icon:"🎁",reward:"🎄 Christmas Badge",mode:"race"}
};

let season="summer",score=0,time=30,combo=1,running=false,timer=null,spawnTimer=null,objects=[],lastHit=0,keys=new Set(),raceX=50,raceSpeed=0,raceBonus=0;
const arena=document.getElementById("arena"),start=document.getElementById("start");

function escapeHtml(x){return String(x??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function applyTheme(){
 const g=games[season]||games.summer;
 document.getElementById("title").textContent=g.title;
 document.getElementById("subtitle").textContent=g.desc;
 document.getElementById("tip").textContent=g.tip;
 document.getElementById("boardTitle").textContent=(g.title.replace(/^\S+\s*/,""))+" Leaderboard";
 document.getElementById("score").textContent="0"; document.getElementById("time").textContent="30"; document.getElementById("combo").textContent="x1";
 arena.innerHTML="";
 if(g.mode==="race"){arena.style.background="linear-gradient(#13264b,#06101e)"; document.getElementById("combo").parentElement.querySelector("span").textContent="BONUS";document.getElementById("combo").textContent="0";document.getElementById("tip").textContent="← → / A D to steer • collect 🎁 • avoid ❄️";start.textContent="Start Race";}
 else {arena.style.background="linear-gradient(180deg,rgba(99,102,241,.18),#0a1021 75%)";document.getElementById("combo").parentElement.querySelector("span").textContent="COMBO";start.textContent="Start Game";}
}

function clearObjects(){objects.forEach(o=>{clearTimeout(o.timer);o.el?.remove()});objects=[]}
function randomPos(size=62){return{x:Math.random()*Math.max(1,arena.clientWidth-size),y:Math.random()*Math.max(1,arena.clientHeight-size)}}
function updateStats(){document.getElementById("score").textContent=score;document.getElementById("time").textContent=time;document.getElementById("combo").textContent=season==="christmas"?raceBonus:"x"+combo}

function spawnClickTarget(){
 if(!running)return;
 const g=games[season],el=document.createElement("button");el.className="target";el.textContent=g.icon;
 const p=randomPos();el.style.left=p.x+"px";el.style.top=p.y+"px";el.style.background="rgba(99,102,241,.22)";
 const lifetime=season==="winter"?1000:season==="halloween"?1300:1450;
 const obj={el,timer:setTimeout(()=>{if(running){el.remove();objects=objects.filter(x=>x!==obj);combo=1;updateStats()}},lifetime)};
 el.onclick=()=>{if(!running)return;clearTimeout(obj.timer);const now=Date.now();combo=now-lastHit<1200?Math.min(8,combo+1):1;lastHit=now;let pts=combo;if(season==="halloween")pts+=2;if(season==="winter")pts+=Math.max(0,Math.floor(score/25));score+=pts;el.remove();objects=objects.filter(x=>x!==obj);updateStats();spawnClickTarget()};
 arena.appendChild(el);objects.push(obj);
}

function spawnGhost(){
 if(!running||season!=="halloween")return;
 const el=document.createElement("div");el.className="hazard";el.textContent="👻";const p=randomPos(35);el.style.left=p.x+"px";el.style.top=p.y+"px";
 el.onclick=()=>{score=Math.max(0,score-5);combo=1;updateStats();el.remove()};arena.appendChild(el);setTimeout(()=>el.remove(),1700);
}

function startRace(){
 arena.innerHTML='<div id="track" style="position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 48px,rgba(255,255,255,.07) 49px 51px);overflow:hidden"><div id="sleigh" style="position:absolute;left:50%;bottom:28px;transform:translateX(-50%);font-size:48px;transition:none">🛷</div><div id="raceRoad" style="position:absolute;left:15%;right:15%;top:0;bottom:0;border-left:3px dashed rgba(255,255,255,.15);border-right:3px dashed rgba(255,255,255,.15)"></div></div>';
 raceX=50;raceSpeed=0;raceBonus=0;score=0;updateStats();
}
function spawnRaceObject(){
 if(!running||season!=="christmas")return;
 const good=Math.random()<.62,el=document.createElement("div");el.textContent=good?"🎁":"❄️";el.style.cssText="position:absolute;font-size:34px;left:"+((Math.random()*60)+20)+"%;top:-45px;z-index:3;cursor:pointer";
 arena.appendChild(el);
 const obj={el,y:-45,x:parseFloat(el.style.left),good};objects.push(obj);
}
function raceLoop(){
 if(!running||season!=="christmas")return;
 const sleigh=document.getElementById("sleigh"); if(!sleigh)return;
 if(keys.has("ArrowLeft")||keys.has("KeyA"))raceX-=0.9;
 if(keys.has("ArrowRight")||keys.has("KeyD"))raceX+=0.9;
 raceX=Math.max(17,Math.min(83,raceX));sleigh.style.left=raceX+"%";
 objects.forEach(o=>{if(!o.el)return;o.y+=2.7;o.el.style.top=o.y+"px";const hit=o.y>arena.clientHeight-105&&o.y<arena.clientHeight-35&&Math.abs(o.x-raceX)<7;if(hit){if(o.good){score+=5;raceBonus++;}else{score=Math.max(0,score-3);raceBonus=Math.max(0,raceBonus-1)}o.el.remove();o.el=null}});
 objects=objects.filter(o=>o.el&&o.y<arena.clientHeight+50);updateStats();requestAnimationFrame(raceLoop);
}
function stopGame(){running=false;clearInterval(timer);clearInterval(spawnTimer);timer=null;spawnTimer=null;clearObjects();start.disabled=false}
async function startGame(){
 if(running)return;
 score=0;time=30;combo=1;lastHit=0;running=true;start.disabled=true;document.getElementById("reward").style.display="none";clearObjects();applyTheme();updateStats();
 if(season==="christmas"){startRace();spawnTimer=setInterval(spawnRaceObject,650);requestAnimationFrame(raceLoop)}
 else {spawnClickTarget();if(season==="halloween")spawnTimer=setInterval(spawnGhost,1400)}
 timer=setInterval(async()=>{time--;updateStats();if(time<=0){stopGame();await finishGame()}},1000);
}
async function finishGame(){
 const {data:{session}}=await db.auth.getSession();
 if(!session){document.getElementById("tip").textContent="Game over! Log in to save your score and earn the badge.";return}
 const {data:profile}=await db.from("profiles").select("username").eq("id",session.user.id).maybeSingle();
 const username=profile?.username||session.user.email?.split("@")[0]||"Player";
 const {error}=await db.from("seasonal_game_scores").insert({game_key:season,user_id:session.user.id,username,score});
 if(error){console.error(error);document.getElementById("tip").textContent="Game over — score saving failed.";return}
 document.getElementById("reward").textContent="🏆 You earned the "+games[season].reward+"! Manage it in Settings → Rewards.";
 document.getElementById("reward").style.display="block";document.getElementById("tip").textContent="Great run! Your score and reward are saved.";loadBoard();
}
async function loadBoard(){
 const {data,error}=await db.from("seasonal_game_scores").select("username,score,created_at").eq("game_key",season).order("score",{ascending:false}).order("created_at",{ascending:true}).limit(10);
 document.getElementById("board").innerHTML=error?"Leaderboard unavailable.":(data?.length?data.map((x,i)=>'<div class="row"><b>#'+(i+1)+'</b><span>@'+escapeHtml(x.username)+'</span><strong>'+x.score+'</strong></div>').join(""):"No scores yet — be the first!");
}
async function loadSeason(){
 const params=new URLSearchParams(location.search);
 const requested=params.get("season");
 const validRequested=requested && Object.prototype.hasOwnProperty.call(games,requested);

 // The URL-selected season is authoritative. If there is no valid URL season,
 // use the live admin setting. Never silently fall back to Summer.
 const {data,error}=await db.from("seasonal_game_settings").select("enabled,season").eq("id",1).maybeSingle();

 if(error||!data||!data.enabled){
   document.querySelector(".game").innerHTML="<h2>Seasonal Game is currently offline.</h2><p>Check back later!</p>";
   return;
 }

 const liveSeason=games[data.season]?data.season:null;
 season=validRequested?requested:liveSeason;

 if(!season){
   document.querySelector(".game").innerHTML="<h2>Seasonal Game configuration is invalid.</h2><p>An admin needs to select a valid season.</p>";
   return;
 }

 applyTheme();
 loadBoard();
}
window.addEventListener("keydown",e=>{keys.add(e.code);if(["ArrowLeft","ArrowRight","Space"].includes(e.code))e.preventDefault()});
window.addEventListener("keyup",e=>keys.delete(e.code));
start.addEventListener("click",startGame);
loadSeason();
</script>
</body>
</html>
