<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171923"><title>Brick Bounce • DougHub</title><link rel="icon" href="../DougHub.svg"><script src="../display.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 12% 0,#88c7f130,transparent 32%),#11131b;color:#fff7ed;font-family:Inter,Arial,sans-serif}header{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid #ffffff18;background:#171923dd;backdrop-filter:blur(14px)}.brand{display:flex;align-items:center;gap:10px;font-weight:900;text-decoration:none;color:white}.brand-mark{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:linear-gradient(145deg,#ff9a70,#e96e82);color:#21131a}.back{color:#f7c8a9;text-decoration:none;font-size:13px;font-weight:800}main{width:min(1050px,calc(100% - 28px));margin:30px auto 24px}.intro{display:flex;justify-content:space-between;align-items:end;gap:15px;margin-bottom:18px}.eyebrow{font-size:10px;letter-spacing:.16em;font-weight:900;color:#88c7f1;text-transform:uppercase}.intro h1{font-size:clamp(28px,5vw,44px);margin:8px 0 5px;letter-spacing:-1.5px}.intro p{margin:0;color:#b8b5bf;font-size:14px}.stats{display:flex;gap:8px;flex-wrap:wrap}.pill{padding:8px 12px;border:1px solid #ffffff20;border-radius:999px;background:#ffffff0a;color:#ddd5d1;font-size:12px;font-weight:800}.game-shell{padding:clamp(14px,3vw,25px);border:1px solid #ffffff20;border-radius:23px;background:linear-gradient(145deg,#292733,#1c2029);box-shadow:0 20px 60px #0005}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:15px}.toolbar strong{font-size:14px}.toolbar button,.action{border:0;border-radius:11px;padding:10px 15px;background:#88c7f1;color:#21151a;font-weight:900;cursor:pointer}.toolbar button:hover,.action:hover{filter:brightness(1.08)}.game-area{display:grid;place-items:center;min-height:320px;padding:14px;border-radius:17px;background:linear-gradient(145deg,#171922,#202733);border:1px solid #ffffff12}.hint{margin:14px 0 0;color:#b8b5bf;font-size:12px;line-height:1.6}.credits{display:flex;justify-content:center;margin:22px auto 10px}.credits button{border:1px solid #ffffff20;background:#ffffff09;color:#c9c1c1;border-radius:999px;padding:9px 14px;font-size:11px;font-weight:800;cursor:pointer}.credit-panel{display:none;margin:12px auto;padding:14px;border-radius:13px;background:#1d202a;border:1px solid #ffffff1a;color:#bfb8bc;font-size:12px;line-height:1.6}.credit-panel.show{display:block}.credit-panel a{color:#88c7f1}@media(max-width:600px){header{padding:0 14px}.intro{align-items:flex-start;flex-direction:column}.game-area{padding:8px}}
</style></head><body><header><a class="brand" href="../index.html"><span class="brand-mark">D</span>DougHub</a><a class="back" href="../douggames.html">← All games</a></header><main><div class="intro"><div><div class="eyebrow">ARCADE • PUZZLE</div><h1>Brick Bounce</h1><p>Made for quick rounds and satisfying little wins.</p></div><div class="stats" id="stats"></div></div><section class="game-shell"><div class="toolbar"><strong id="status">Ready when you are</strong><button id="restart" type="button">New game</button></div><div class="game-area" id="gameArea"></div><p class="hint" id="hint"></p></section><div class="credits"><button id="creditsToggle" type="button">ART & CREDITS</button></div><div class="credit-panel" id="creditsPanel">Game art from <a href="https://kenney.nl/assets/puzzle-pack-1" target="_blank" rel="noopener">Kenney Puzzle Pack 1</a> and <a href="https://kenney.nl/assets/puzzle-pack-2" target="_blank" rel="noopener">Kenney Puzzle Pack 2</a>. Both packs are licensed CC0. Thanks to Kenney for the artwork.</div></main><script>
document.getElementById("creditsToggle").addEventListener("click",()=>document.getElementById("creditsPanel").classList.toggle("show"));
</script>
<style>
#brickCanvas{width:min(100%,760px);height:auto;aspect-ratio:760/470;border-radius:12px;background:linear-gradient(#182538,#15202b);touch-action:none}
</style><script>
const canvas=document.createElement("canvas");canvas.width=760;canvas.height=470;canvas.id="brickCanvas";document.getElementById("gameArea").appendChild(canvas);const ctx=canvas.getContext("2d");const paddleImg=new Image(),ballImg=new Image(),brickImg=new Image();paddleImg.src="https://raw.githubusercontent.com/eturner58/game-assets/main/kenney/2D%20assets/Puzzle%20Pack%201/PNG/Default/"+"paddleBlu.png";ballImg.src="https://raw.githubusercontent.com/eturner58/game-assets/main/kenney/2D%20assets/Puzzle%20Pack%201/PNG/Default/"+"ballBlue.png";brickImg.src="https://raw.githubusercontent.com/eturner58/game-assets/main/kenney/2D%20assets/Puzzle%20Pack%202/PNG/Tiles%20blue/"+"tileBlue_01.png";
let bx=380,by=390,vx=3.1,vy=-3.5,paddle=330,score=0,lives=3,bricks=[],running=true;function brickReset(){bx=380;by=390;vx=3.1*(Math.random()>.5?1:-1);vy=-3.5;paddle=330;score=0;lives=3;running=true;bricks=Array.from({length:45},(_,i)=>({x:28+(i%9)*78,y:48+Math.floor(i/9)*35,on:true}));brickDraw();document.getElementById("status").textContent="Clear the blocks and keep the ball in play";document.getElementById("hint").textContent="Move your mouse or finger across the board to steer the paddle. On a keyboard, use ← and →. Clear all blocks before you run out of lives."}
function brickDraw(){ctx.clearRect(0,0,760,470);ctx.fillStyle="#ffffff0b";ctx.fillRect(12,12,736,446);bricks.forEach(b=>{if(b.on){if(brickImg.complete&&brickImg.naturalWidth)ctx.drawImage(brickImg,b.x,b.y,64,25);else{ctx.fillStyle="#55a9df";ctx.fillRect(b.x,b.y,64,25)}}});if(paddleImg.complete&&paddleImg.naturalWidth)ctx.drawImage(paddleImg,paddle,430,100,22);else{ctx.fillStyle="#8bd0f2";ctx.fillRect(paddle,438,100,12)}if(ballImg.complete&&ballImg.naturalWidth)ctx.drawImage(ballImg,bx-10,by-10,20,20);else{ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(bx,by,8,0,Math.PI*2);ctx.fill()}ctx.fillStyle="#fff";ctx.font="bold 14px Arial";ctx.fillText("SCORE "+score+"     LIVES "+lives,22,30)}
function brickTick(){if(!running)return;bx+=vx;by+=vy;if(bx<10||bx>750)vx*=-1;if(by<10)vy*=-1;if(by>420&&bx>paddle-6&&bx<paddle+106){vy=-Math.abs(vy);vx+=(bx-(paddle+53))*.025}if(by>470){lives--;if(lives<=0){running=false;document.getElementById("status").textContent="Round over — score "+score}else{bx=380;by=390;vy=-3.5}}for(const b of bricks){if(b.on&&bx>b.x-8&&bx<b.x+72&&by>b.y-8&&by<b.y+33){b.on=false;vy*=-1;score+=10;break}}if(bricks.every(b=>!b.on)){running=false;document.getElementById("status").textContent="Board cleared! Score "+score}brickDraw();if(running)requestAnimationFrame(brickTick)}
function brickStart(){brickReset();requestAnimationFrame(brickTick)}function brickMove(x){const r=canvas.getBoundingClientRect();paddle=Math.max(0,Math.min(660,(x-r.left)*canvas.width/r.width-50))}canvas.addEventListener("pointermove",e=>brickMove(e.clientX));canvas.addEventListener("pointerdown",e=>brickMove(e.clientX));window.addEventListener("keydown",e=>{if(e.key==="ArrowLeft")paddle=Math.max(0,paddle-32);if(e.key==="ArrowRight")paddle=Math.min(660,paddle+32)});[paddleImg,ballImg,brickImg].forEach(i=>i.onload=()=>brickDraw());document.getElementById("restart").addEventListener("click",brickStart);brickStart();
</script></body></html>
