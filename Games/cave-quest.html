.ov{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2vmin;background:rgba(4,6,16,.84);text-align:center;padding:4vmin}
.ov[hidden]{display:none}
.ov h1{margin:0;font-size:max(18px,4.4vmin);line-height:1.4;font-weight:400;color:var(--hi,#ffd23a);text-shadow:3px 3px var(--sh,#b45309)}
.ov p{margin:0;font-size:max(9px,1.6vmin);line-height:1.9;color:#c4cdee;max-width:62ch}
.pb{font-size:max(11px,2vmin);padding:1.6vmin 3vmin;background:var(--btn,#18b3a1);color:var(--btnt,#04141a);box-shadow:inset -4px -4px rgba(0,0,0,.28),inset 4px 4px rgba(255,255,255,.35)}
#mute{position:absolute;top:6px;right:8px;z-index:40;padding:6px 8px;font-size:11px;background:rgba(20,28,60,.9);box-shadow:none}
.hud{position:absolute;top:8px;left:0;right:0;z-index:20;display:flex;justify-content:center;gap:4vmin;font-size:max(9px,1.7vmin);text-shadow:2px 2px #000;pointer-events:none}
.hud b{color:#ffd23a;font-weight:400}

:root{--ser:Georgia,"Palatino Linotype","Book Antiqua",Palatino,serif;--gold:#e8c26a}
body{background:#0d0a08;font-family:var(--ser)}
#wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4vmin;background:radial-gradient(circle at 50% 40%,#2a1c12,#0d0a08 75%)}
#frame{position:relative;width:min(96vw,calc((100vh - 120px)*1.3636));border:6px solid #6b4a2b;border-image:linear-gradient(135deg,#8a6038,#4a3018,#8a6038) 1;box-shadow:0 0 0 2px #21150b,0 14px 40px #000c}
#cv{display:block;width:100%;aspect-ratio:15/11;image-rendering:pixelated;background:#050403}
#bar{width:min(96vw,calc((100vh - 120px)*1.3636));display:grid;grid-template-columns:repeat(4,1fr);gap:1vmin;font-size:max(12px,1.9vmin);color:var(--gold);font-weight:700}
#bar div{background:linear-gradient(#2b2017,#1a120b);border:1px solid #5a4028;padding:.7vmin 1.2vmin;display:flex;justify-content:space-between;gap:6px;box-shadow:inset 0 1px 0 #ffffff14}
#bar b{color:#fff}
#hpw{grid-column:span 2;position:relative;overflow:hidden}#hpf{position:absolute;inset:0;width:100%;background:linear-gradient(90deg,#8b1d1d,#d33a3a);opacity:.85;transition:width .2s;z-index:0}#hpw span{position:relative;z-index:1}

#pad button{background:rgba(232,194,106,.35);border:1px solid #e8c26a;font-size:4.4vmin;padding:0;border-radius:8px}
.ov{background:rgba(13,10,8,.88);font-family:var(--ser)}
.ov h1{font-family:var(--ser)!important;font-size:max(30px,6.4vmin)!important;color:var(--gold)!important;text-shadow:0 3px 0 #4a2f10,0 0 24px #e8c26a55!important;letter-spacing:.05em;font-variant:small-caps}
