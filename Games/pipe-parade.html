<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171923"><title>Pipe Parade • DougHub</title><link rel="icon" href="../DougHub.svg"><script src="../display.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 12% 0,#83d9a830,transparent 32%),#11131b;color:#fff7ed;font-family:Inter,Arial,sans-serif}header{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid #ffffff18;background:#171923dd;backdrop-filter:blur(14px)}.brand{display:flex;align-items:center;gap:10px;font-weight:900;text-decoration:none;color:white}.brand-mark{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:linear-gradient(145deg,#ff9a70,#e96e82);color:#21131a}.back{color:#f7c8a9;text-decoration:none;font-size:13px;font-weight:800}main{width:min(1050px,calc(100% - 28px));margin:30px auto 24px}.intro{display:flex;justify-content:space-between;align-items:end;gap:15px;margin-bottom:18px}.eyebrow{font-size:10px;letter-spacing:.16em;font-weight:900;color:#83d9a8;text-transform:uppercase}.intro h1{font-size:clamp(28px,5vw,44px);margin:8px 0 5px;letter-spacing:-1.5px}.intro p{margin:0;color:#b8b5bf;font-size:14px}.stats{display:flex;gap:8px;flex-wrap:wrap}.pill{padding:8px 12px;border:1px solid #ffffff20;border-radius:999px;background:#ffffff0a;color:#ddd5d1;font-size:12px;font-weight:800}.game-shell{padding:clamp(14px,3vw,25px);border:1px solid #ffffff20;border-radius:23px;background:linear-gradient(145deg,#292733,#1c2029);box-shadow:0 20px 60px #0005}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:15px}.toolbar strong{font-size:14px}.toolbar button,.action{border:0;border-radius:11px;padding:10px 15px;background:#83d9a8;color:#21151a;font-weight:900;cursor:pointer}.toolbar button:hover,.action:hover{filter:brightness(1.08)}.game-area{display:grid;place-items:center;min-height:320px;padding:14px;border-radius:17px;background:linear-gradient(145deg,#171922,#202733);border:1px solid #ffffff12}.hint{margin:14px 0 0;color:#b8b5bf;font-size:12px;line-height:1.6}.credits{display:flex;justify-content:center;margin:22px auto 10px}.credits button{border:1px solid #ffffff20;background:#ffffff09;color:#c9c1c1;border-radius:999px;padding:9px 14px;font-size:11px;font-weight:800;cursor:pointer}.credit-panel{display:none;margin:12px auto;padding:14px;border-radius:13px;background:#1d202a;border:1px solid #ffffff1a;color:#bfb8bc;font-size:12px;line-height:1.6}.credit-panel.show{display:block}.credit-panel a{color:#83d9a8}@media(max-width:600px){header{padding:0 14px}.intro{align-items:flex-start;flex-direction:column}.game-area{padding:8px}}
</style></head><body><header><a class="brand" href="../index.html"><span class="brand-mark">D</span>DougHub</a><a class="back" href="../douggames.html">← All games</a></header><main><div class="intro"><div><div class="eyebrow">LOGIC • PIPE PUZZLE</div><h1>Pipe Parade</h1><p>Made for quick rounds and satisfying little wins.</p></div><div class="stats" id="stats"></div></div><section class="game-shell"><div class="toolbar"><strong id="status">Ready when you are</strong><button id="restart" type="button">New game</button></div><div class="game-area" id="gameArea"></div><p class="hint" id="hint"></p></section><div class="credits"><button id="creditsToggle" type="button">ART & CREDITS</button></div><div class="credit-panel" id="creditsPanel">Game art from <a href="https://kenney.nl/assets/puzzle-pack-1" target="_blank" rel="noopener">Kenney Puzzle Pack 1</a> and <a href="https://kenney.nl/assets/puzzle-pack-2" target="_blank" rel="noopener">Kenney Puzzle Pack 2</a>. Both packs are licensed CC0. Thanks to Kenney for the artwork.</div></main><script>
document.getElementById("creditsToggle").addEventListener("click",()=>document.getElementById("creditsPanel").classList.toggle("show"));
</script>
<style>
#pipeBoard{display:grid;grid-template-columns:repeat(5,clamp(48px,12vw,76px));gap:6px}.pipe-cell{position:relative;aspect-ratio:1;border:1px solid #ffffff18;border-radius:12px;background:#ffffff0b;cursor:pointer;overflow:hidden}.pipe-cell:before{content:"";position:absolute;inset:0;background-image:url("https://raw.githubusercontent.com/eturner58/game-assets/main/kenney/2D%20assets/Puzzle%20Pack%202/PNG/Back%20tiles/BackTile_03.png");background-size:cover;opacity:.42}.pipe-shape{position:absolute;inset:0;display:grid;place-items:center}.pipe-shape img{width:78%;height:78%;object-fit:contain;transition:transform .18s}.pipe-cell.start,.pipe-cell.end{outline:2px solid #83d9a8}.pipe-cell small{position:absolute;bottom:3px;left:0;right:0;font-size:8px;font-weight:900;color:white;text-shadow:0 1px 3px #000}
</style><script>
const pipeAsset="https://raw.githubusercontent.com/eturner58/game-assets/main/kenney/2D%20assets/Puzzle%20Pack%202/PNG/Pipes/Green/"+"pipeGreen_01.png";let pipeTurns=[],pipeSolution=[2,0,1,0,3,2,1],pipeRoute=[11,6,7,12,13,14,9],pipeWon=false;const pb=document.getElementById("gameArea");
function pipeBuild(){pipeTurns=Array.from({length:25},()=>Math.floor(Math.random()*4));pipeWon=false;pipeDraw();document.getElementById("status").textContent="Connect the green source to the exit";document.getElementById("hint").textContent="Tap tiles to rotate the pipe pieces. Connect the glowing START at the left to the FINISH on the right. A path must join edge-to-edge."}
function pipeDraw(){pb.innerHTML='<div id="pipeBoard">'+Array.from({length:25},(_,i)=>'<button class="pipe-cell '+(i===11?'start':i===9?'end':'')+'" data-i="'+i+'" aria-label="Rotate pipe tile"><span class="pipe-shape"><img src="'+pipeAsset+'" style="transform:rotate('+(pipeTurns[i]*90)+'deg)" alt=""></span>'+(i===11?'<small>START</small>':i===9?'<small>FINISH</small>':'')+'</button>').join("")+'</div>';pb.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{if(pipeWon)return;pipeTurns[+b.dataset.i]=(pipeTurns[+b.dataset.i]+1)%4;pipeDraw();if(pipeCheck()){pipeWon=true;document.getElementById("status").textContent="Connected! You solved it.";}}))}
function pipeCheck(){/* fixed route: correct orientation for each path cell; other cells are decoys */const required={11:0,6:1,7:2,12:3,13:0,14:0,9:2};return Object.entries(required).every(([i,turn])=>pipeTurns[+i]===turn)}
document.getElementById("restart").addEventListener("click",pipeBuild);pipeBuild();
</script></body></html>
