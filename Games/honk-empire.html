<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#26283b">
<title>Honk Empire</title>
<link rel="icon" href="art/honk-empire.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../display.js"></script>
<script src="../game-analytics.js" data-game-key="honk-empire" data-game-title="Honk Empire" defer></script>
<style>
/* Palette: "park picnic" — ink outlines, cream paper, goose-beak orange, butter gold. */
:root{
 --ink:#26283b;--ink-2:#3d4160;--ink-soft:#6b6d82;
 --paper:#fffaf0;--paper-2:#f6edda;--paper-3:#eadcc0;
 --beak:#f28c28;--beak-dk:#c4640f;
 --butter:#f7c948;--butter-dk:#c99a1c;
 --leaf:#5fae4e;--leaf-dk:#3d8132;
 --pond:#3a8fb7;--pond-dk:#256a8b;
 --berry:#e05a4f;--berry-dk:#a93a31;
 --plum:#8a5cc9;--plum-dk:#5f3b93;
 --r-common:#9aa1ad;--r-rare:#3a8fb7;--r-epic:#8a5cc9;--r-legendary:#f2a71b;--r-mythic:#e2577e;
 --hard:0 4px 0 var(--ink);--hard-sm:0 3px 0 var(--ink);
 --display:"Fredoka","Trebuchet MS",sans-serif;--body:"Nunito","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{display:flex;flex-direction:column;background:var(--ink);color:var(--ink);font-family:var(--body);font-size:14px;font-weight:700;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--butter);outline-offset:2px}
img{-webkit-user-drag:none;user-select:none}

/* ---- Top bar ---- */
.topbar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--ink);color:var(--paper);flex:0 0 auto}
.sq-btn{display:grid;place-items:center;width:40px;height:40px;border:0;border-radius:12px;background:var(--ink-2);box-shadow:0 3px 0 #15162299;flex:0 0 40px}
.sq-btn:hover{background:#4a4e72}
.sq-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #15162299}
.sq-btn img{width:22px;height:22px}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.2px;white-space:nowrap;cursor:default;user-select:none}
.brand b{color:var(--beak);font-weight:700}
.top-stats{display:flex;gap:8px;margin-left:auto;align-items:center}
.pill{display:flex;align-items:center;gap:7px;height:36px;padding:0 12px 0 6px;border-radius:999px;background:var(--ink-2);font-family:var(--display);font-weight:600;font-size:16px;white-space:nowrap}
.pill .em{width:24px;height:24px;vertical-align:0}
.pill small{font-family:var(--body);font-size:11px;color:#b9bbd0;font-weight:800;text-transform:uppercase;letter-spacing:.05em}

/* ---- Event ribbon + Goose Gazette ---- */
.ribbon{display:flex;align-items:center;justify-content:center;gap:8px;padding:7px 12px;background:var(--butter);color:var(--ink);font-weight:900;font-size:13px;text-align:center;border-bottom:3px solid var(--ink);flex:0 0 auto}
.ribbon .em{width:20px;height:20px}
.ribbon small{font-weight:800;color:#5c4a12}
.gazette{display:flex;align-items:stretch;background:var(--paper);border-bottom:3px solid var(--ink);flex:0 0 auto;overflow:hidden}
.gazette-label{flex:0 0 auto;padding:6px 12px;background:var(--ink);color:var(--paper);font-family:Georgia,"Times New Roman",serif;font-weight:700;font-style:italic;font-size:13px;letter-spacing:.02em}
.gazette-track{flex:1;overflow:hidden;white-space:nowrap;padding:6px 0;font-family:Georgia,"Times New Roman",serif;font-size:13.5px;color:var(--ink-2)}
.gazette-track span{display:inline-block;padding-left:100%;animation:tick 24s linear infinite}
@keyframes tick{to{transform:translateX(-100%)}}

/* ---- Layout ---- */
.game{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 430px}

/* ---- Stage / scenes ---- */
.stage{position:relative;overflow:hidden;isolation:isolate;background:#cfeefb;user-select:none}
.scene{position:absolute;inset:0;z-index:-1;background-size:cover;background-position:center 72%;background-repeat:no-repeat;transition:opacity .4s}
.scene img{position:absolute;pointer-events:none}
.cloud{top:var(--y);left:-30%;width:var(--w);opacity:.92;animation:drift var(--d) linear infinite;animation-delay:var(--delay)}
@keyframes drift{to{transform:translateX(160vw)}}
.sun{right:7%;top:7%;width:min(110px,16%);animation:spin 60s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pond{position:absolute;left:8%;right:44%;bottom:8%;height:17%;border-radius:50%;background:radial-gradient(ellipse at 40% 35%,#7cc7e6,#3a8fb7 70%);border:4px solid #2f7a9c;box-shadow:inset 0 6px 0 #ffffff55}
.scene-0{background-image:url(kenney/bg-backgroundColorGrass.png)}
.scene-1{background-image:url(kenney/bg-backgroundColorForest.png)}
.scene-2{background-image:url(kenney/bg-backgroundCastles.png),linear-gradient(180deg,#ffb36b 0%,#ff8a7a 45%,#c86b9b 100%);background-blend-mode:multiply}
.scene-3{background:radial-gradient(ellipse at 50% 120%,#bfc5d3 0 32%,transparent 32.5%),linear-gradient(180deg,#0e1330,#26305e 70%,#3a4378)}
.scene-4{background-image:url(kenney/bg-backgroundColorFall.png);animation:glitch 5s steps(1) infinite}
@keyframes glitch{0%,100%{filter:none}46%{filter:hue-rotate(160deg) saturate(1.5)}48%{filter:hue-rotate(-90deg) contrast(1.3)}50%{filter:none}82%{filter:invert(.9) hue-rotate(180deg)}83%{filter:none}}
.scanlines{position:absolute;inset:0;background:repeating-linear-gradient(0deg,#0000 0 3px,#0000001a 3px 4px);pointer-events:none}
.twinkle{width:var(--s);animation:twinkle var(--d) ease-in-out infinite}
@keyframes twinkle{50%{opacity:.25;transform:scale(.6)}}
.planet{animation:bob 9s ease-in-out infinite}

.world-tag{position:absolute;top:12px;left:12px;display:flex;align-items:center;gap:7px;padding:5px 12px 5px 6px;border:3px solid var(--ink);border-radius:999px;background:var(--paper);box-shadow:var(--hard-sm);font-family:var(--display);font-weight:600;font-size:15px}
.world-tag .em{width:24px;height:24px;vertical-align:0}
.gift{position:absolute;top:12px;right:12px;display:flex;align-items:center;gap:6px;padding:7px 14px 7px 8px;border:3px solid var(--ink);border-radius:14px;background:var(--butter);box-shadow:var(--hard-sm);font-family:var(--display);font-weight:600;font-size:15px;animation:nudge 2.4s ease-in-out infinite}
.gift .em{width:26px;height:26px;vertical-align:0}
@keyframes nudge{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-6deg)}90%{transform:rotate(6deg)}95%{transform:rotate(-3deg)}}

.plaque{position:absolute;left:50%;top:58px;transform:translateX(-50%);min-width:220px;padding:8px 22px 10px;border:3px solid var(--ink);border-radius:18px;background:var(--paper);box-shadow:var(--hard);text-align:center;z-index:3}
.plaque .big{font-family:var(--display);font-weight:700;font-size:clamp(30px,4.2vw,46px);line-height:1;letter-spacing:-.5px}
.plaque .unit{font-family:var(--display);font-size:15px;font-weight:600;color:var(--beak-dk);letter-spacing:.1em;text-transform:uppercase}
.plaque .rate{margin-top:3px;font-size:12.5px;color:var(--ink-soft);font-weight:800}
.combo{position:absolute;right:-16px;top:-14px;padding:3px 9px;border:3px solid var(--ink);border-radius:10px;background:var(--berry);color:#fff;font-family:var(--display);font-weight:700;font-size:14px;transform:rotate(8deg);box-shadow:var(--hard-sm);display:none}
.combo.on{display:block;animation:pop .2s}
.buffs{position:absolute;left:50%;transform:translateX(-50%);top:calc(58px + var(--plaque-h,96px) + 10px);display:flex;gap:6px;flex-wrap:wrap;justify-content:center;width:min(92%,520px);z-index:3}
.buff{display:flex;align-items:center;gap:5px;padding:4px 10px 4px 5px;border:2px solid var(--ink);border-radius:999px;background:var(--paper);font-size:12px;font-weight:900;box-shadow:0 2px 0 var(--ink)}
.buff .em{width:18px;height:18px;vertical-align:0}

.goose-btn{position:absolute;left:50%;bottom:12%;transform:translateX(-50%);width:min(290px,48vw,42vh);aspect-ratio:1;border:0;background:none;padding:0;z-index:2;touch-action:manipulation}
.goose-btn .shadow{position:absolute;left:18%;right:12%;bottom:2%;height:8%;border-radius:50%;background:#0000002e}
.goose-img{position:relative;width:100%;height:100%;transform-origin:50% 95%;transition:transform .06s}
.goose-btn:active .goose-img{transform:scale(.92,.88)}
.goose-btn.squish .goose-img{animation:squish .18s}
@keyframes squish{40%{transform:scale(1.08,.86)}70%{transform:scale(.96,1.05)}}
.goose-hat{position:absolute;left:21%;top:-3%;width:30%;height:30%;pointer-events:none;transform:rotate(-12deg)}
/* The goose wanders: .goose-body flips to face where it walks and waddles while moving. */
.goose-body{position:absolute;inset:0;display:block;transition:transform .3s}
.goose-body.right{transform:scaleX(-1)}
.goose-btn.walking .goose-body{animation:waddle .55s ease-in-out infinite}
@keyframes waddle{0%,100%{rotate:-4deg;translate:0 0}50%{rotate:4deg;translate:0 -3%}}

.flock{position:absolute;left:0;right:0;bottom:0;display:flex;gap:6px;padding:8px 10px;overflow-x:auto;scrollbar-width:none;background:linear-gradient(0deg,#00000038,transparent);z-index:3}
.flock::-webkit-scrollbar{display:none}
.flock-chip{display:flex;align-items:center;gap:3px;padding:2px 8px 2px 3px;border:2px solid var(--ink);border-radius:999px;background:var(--paper);font-family:var(--display);font-weight:600;font-size:13px;flex:0 0 auto}
.flock-chip .em{width:22px;height:22px;vertical-align:0}

.reb-bar{position:absolute;left:12px;right:12px;bottom:46px;height:14px;border:3px solid var(--ink);border-radius:999px;background:var(--paper-2);overflow:hidden;z-index:3}
.reb-bar i{display:block;height:100%;background:repeating-linear-gradient(-45deg,var(--plum) 0 10px,#9d72d8 10px 20px);transition:width .4s}
.reb-bar span{position:absolute;inset:0;display:grid;place-items:center;font-size:10px;font-weight:900;letter-spacing:.06em;color:var(--ink)}
.reb-ready{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);z-index:4;padding:8px 18px;border:3px solid var(--ink);border-radius:14px;background:var(--plum);color:#fff;font-family:var(--display);font-weight:600;font-size:16px;box-shadow:var(--hard);animation:nudge 2s ease-in-out infinite}

/* floating numbers, particles, bubbles */
.float{position:absolute;z-index:6;pointer-events:none;font-family:var(--display);font-weight:700;font-size:24px;color:#fff;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;animation:floatup .9s ease-out forwards}
.float.crit{color:var(--butter);font-size:34px}
@keyframes floatup{to{transform:translateY(-90px) scale(1.1);opacity:0}}
.particle{position:absolute;z-index:5;pointer-events:none;width:var(--sz);height:var(--sz);margin:calc(var(--sz)/-2) 0 0 calc(var(--sz)/-2);animation:burst var(--t) cubic-bezier(.15,.7,.3,1) forwards}
.particle.gold{filter:brightness(0) saturate(100%) invert(80%) sepia(60%) saturate(800%) hue-rotate(358deg)}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}
.stage.shake{animation:shake .25s}
@keyframes shake{25%{transform:translate(-4px,2px)}50%{transform:translate(4px,-2px)}75%{transform:translate(-2px,1px)}}
.bubble{position:absolute;z-index:6;pointer-events:none;padding:7px 12px;border:3px solid var(--ink);border-radius:14px;background:var(--paper);font-weight:900;font-size:14px;box-shadow:var(--hard-sm);animation:bubble 1.7s ease-out forwards;white-space:nowrap}
.bubble:after{content:"";position:absolute;left:18px;bottom:-11px;border:8px solid transparent;border-top-color:var(--ink)}
@keyframes bubble{0%{transform:scale(.5);opacity:0}12%{transform:scale(1);opacity:1}80%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
.golden-bread{position:absolute;z-index:7;width:84px;height:84px;border:0;background:none;padding:0;animation:bob 1.1s ease-in-out infinite}
.golden-bread .glow{position:absolute;inset:-26px;width:auto;height:auto;opacity:.9;animation:spin 6s linear infinite;filter:brightness(0) saturate(100%) invert(84%) sepia(52%) saturate(700%) hue-rotate(354deg)}
.golden-bread .em{position:relative;width:64px;height:64px;filter:drop-shadow(0 3px 0 var(--ink))}
@keyframes bob{50%{transform:translateY(-9px) rotate(6deg)}}
.mini-goose{position:absolute;z-index:7;border:0;background:none;padding:0;animation:walk linear forwards}
.mini-goose .em{width:56px;height:56px;filter:drop-shadow(0 3px 0 #0005)}
@keyframes walk{from{left:-70px}to{left:calc(100% + 70px)}}
@keyframes pop{from{transform:scale(0)}}

/* ---- Side panel ---- */
.panel{display:flex;flex-direction:column;min-height:0;background:var(--paper);border-left:4px solid var(--ink)}
.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding:10px 10px 8px;background:var(--paper-2);border-bottom:3px solid var(--ink);flex:0 0 auto}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:0;border:0;background:none;font-size:11.5px;font-weight:900;color:var(--ink-soft)}
.tab .ti{display:grid;place-items:center;width:44px;height:44px;border:3px solid var(--ink);border-radius:13px;background:var(--tc);box-shadow:var(--hard-sm);transition:transform .1s}
.tab .ti img{width:26px;height:26px}
.tab:hover .ti{transform:translateY(-2px)}
.tab.active{color:var(--ink)}
.tab.active .ti{transform:translateY(2px);box-shadow:0 1px 0 var(--ink);outline:3px solid var(--butter);outline-offset:2px}
.tab .dot{position:absolute;top:-4px;right:calc(50% - 26px);width:14px;height:14px;border:2px solid var(--ink);border-radius:50%;background:var(--berry);display:none}
.tab.alert .dot{display:block;animation:pop .3s}
.t-shop{--tc:var(--beak)}.t-pets{--tc:var(--leaf)}.t-worlds{--tc:var(--pond)}.t-rebirth{--tc:var(--plum)}.t-trophies{--tc:var(--butter)}.t-leaders{--tc:var(--berry)}
.tab-body{flex:1;min-height:0;overflow-y:auto;padding:14px;scrollbar-width:thin;scrollbar-color:var(--paper-3) transparent}
.h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 2px 12px}
.h h2{margin:0;font-family:var(--display);font-weight:600;font-size:21px}
.h small{color:var(--ink-soft);font-weight:800;font-size:12px}
.hint{color:var(--ink-soft);font-size:13px;line-height:1.5;margin:0 2px 12px;font-weight:700}
.seg{display:inline-flex;border:3px solid var(--ink);border-radius:11px;overflow:hidden;box-shadow:var(--hard-sm)}
.seg button{border:0;background:var(--paper);padding:4px 10px;font-weight:900;font-size:12px}
.seg button+button{border-left:2px solid var(--ink)}
.seg button.on{background:var(--ink);color:var(--paper)}

/* shop rows */
.row{display:flex;align-items:center;gap:12px;width:100%;margin-bottom:9px;padding:9px 10px;border:3px solid var(--ink);border-radius:15px;background:#fff;box-shadow:var(--hard-sm);text-align:left;transition:transform .08s}
.row:not(:disabled):hover{background:#fffdf6;transform:translateY(-1px)}
.row:not(:disabled):active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.row:disabled{background:var(--paper-2);cursor:not-allowed}
.row:disabled .row-icon{filter:saturate(.4)}
.row-icon{display:grid;place-items:center;width:52px;height:52px;flex:0 0 52px;border:3px solid var(--ink);border-radius:13px;background:var(--ic,var(--paper-2))}
.row-icon .em,.row-icon img{width:36px;height:36px;vertical-align:0}
.row-copy{flex:1;min-width:0}
.row-copy strong{display:block;font-family:var(--display);font-weight:600;font-size:16px;line-height:1.15}
.row-copy small{display:block;color:var(--ink-soft);font-size:12px;line-height:1.35;font-weight:700;margin-top:1px}
.row-copy .meta{color:var(--leaf-dk);font-weight:900}
.row-side{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:0 0 auto}
.owned{font-family:var(--display);font-weight:700;font-size:22px;line-height:1;color:var(--ink)}
.price{display:inline-flex;align-items:center;gap:3px;padding:2px 8px 2px 4px;border:2px solid var(--ink);border-radius:999px;background:var(--butter);font-family:var(--display);font-weight:600;font-size:14px}
.price .em{width:16px;height:16px;vertical-align:0}
.price.no{background:var(--paper-3);color:var(--ink-soft)}
.mile{height:6px;margin-top:5px;border:2px solid var(--ink);border-radius:9px;background:var(--paper-2);overflow:hidden}
.mile i{display:block;height:100%;background:var(--leaf)}
.row.mystery{justify-content:flex-start;background:var(--paper-2);border-style:dashed;box-shadow:none}
.row.mystery .row-icon{background:var(--ink-soft)}
.row.mystery .row-icon img{width:26px;height:26px}
/* Kenney's white UI icons need a dark tint when they sit on a light surface. */
.btn:disabled img:not(.em){filter:brightness(0);opacity:.5;width:18px;height:18px}
.btn.ghost img:not(.em){filter:brightness(0)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:11px 14px;border:3px solid var(--ink);border-radius:14px;background:var(--beak);color:#fff;font-family:var(--display);font-weight:600;font-size:17px;box-shadow:var(--hard);text-shadow:0 2px 0 #0003}
.btn:not(:disabled):active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{background:var(--paper-3);color:var(--ink-soft);text-shadow:none;cursor:not-allowed}
.btn.plum{background:var(--plum)}.btn.leaf{background:var(--leaf)}.btn.ghost{background:var(--paper);color:var(--ink);text-shadow:none}.btn.danger{background:var(--berry)}
.btn.small{width:auto;padding:7px 12px;font-size:14px;box-shadow:var(--hard-sm)}
.btn .em{width:22px;height:22px;vertical-align:0}

/* pets */
.egg-card{display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:14px;border:3px solid var(--ink);border-radius:16px;background:linear-gradient(180deg,#e8f6d9,#cfeab5);box-shadow:var(--hard)}
.egg-card .egg .em{width:62px;height:62px;vertical-align:0;animation:wobble 2.6s ease-in-out infinite}
@keyframes wobble{0%,70%,100%{transform:rotate(0)}76%{transform:rotate(-10deg)}84%{transform:rotate(10deg)}92%{transform:rotate(-4deg)}}
.odds{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.odds span{padding:1px 6px;border-radius:6px;background:var(--rc);color:#fff;font-size:10.5px;font-weight:900}
.pet-actions{display:flex;gap:8px;margin:0 0 12px}
.pet-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.pet{position:relative;padding:8px 4px 7px;border:3px solid var(--ink);border-radius:14px;background:#fff;text-align:center;box-shadow:inset 0 -6px 0 var(--rc)}
.pet.equipped{background:#fff6dc;outline:3px solid var(--beak);outline-offset:1px}
.pet.golden{background:linear-gradient(160deg,#fff3c4,#fff)}
.pet .pe .em{width:44px;height:44px;vertical-align:0}
.pet .pn{display:block;font-size:11.5px;font-weight:900;line-height:1.2;margin-top:2px;min-height:28px}
.pet .pb{display:block;font-size:11.5px;color:var(--leaf-dk);font-weight:900;margin-bottom:4px}
.pet .badge{position:absolute;top:-8px;right:-6px;width:24px;height:24px;border:2px solid var(--ink);border-radius:50%;background:var(--beak);display:grid;place-items:center}
.pet .badge img{width:14px;height:14px}
.pet .gold-tag{position:absolute;top:-8px;left:-6px;padding:0 5px;border:2px solid var(--ink);border-radius:7px;background:var(--butter);font-size:10px;font-weight:900}

/* worlds */
.world{position:relative;display:flex;align-items:center;gap:12px;margin-bottom:10px;padding:10px;border:3px solid var(--ink);border-radius:16px;overflow:hidden;background:var(--paper-2) center 70%/cover no-repeat;box-shadow:var(--hard-sm);min-height:84px}
.world:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#fffaf0f2 0%,#fffaf0d9 55%,#fffaf000 100%)}
.world>*{position:relative}
.world.current{outline:3px solid var(--beak);outline-offset:2px}
.world.locked{filter:grayscale(1) opacity(.65)}
.world .we .em{width:46px;height:46px;vertical-align:0}
.world .row-copy strong{font-size:18px}

/* rebirth */
.reb-card{padding:18px;border:3px solid var(--ink);border-radius:18px;background:radial-gradient(circle at 50% 0,#c5a8ef,#8a5cc9 70%);color:#fff;text-align:center;box-shadow:var(--hard);margin-bottom:14px}
.reb-card .em{width:64px;height:64px;vertical-align:0;filter:drop-shadow(0 3px 0 var(--ink))}
.reb-card .gain{font-family:var(--display);font-weight:700;font-size:36px;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;color:var(--butter);margin:2px 0}
.reb-card p{margin:0;font-size:13px;color:#f1eafc}
.checklist{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:6px}

function freshState(){return{v:1,honks:0,run:0,lifetime:0,clicks:0,feathers:0,rebirths:0,gens:GENERATORS.map(()=>0),clickLvl:0,worlds:1,world:0,pets:[],equipped:[],ach:{},lastSave:Date.now(),lastDaily:"",playMs:0,muted:false,buyAmt:1,nextPetId:1,stats:{crits:0,eggs:0,breads:0,invaders:0,titleClicks:0,muteToggles:0,secret:false,taxed:false,maxCombo:false}};}

const SUFFIX=["","K","M","B","T","Qa","Qi","Sx","Sp","Oc","No","Dc","Ud","Dd","Td"];
function fmt(n){if(!isFinite(n))return"∞";if(n<1000)return n<10&&n%1?n.toFixed(1):Math.floor(n).toString();const e=Math.floor(Math.log10(n)/3);if(e>=SUFFIX.length)return n.toExponential(2).replace("+","");const v=n/Math.pow(1000,e);return(v<10?v.toFixed(2):v<100?v.toFixed(1):Math.floor(v))+SUFFIX[e];}
function fmtTime(ms){const s=Math.max(0,Math.ceil(ms/1000));const m=Math.floor(s/60);return m?m+"m "+(s%60).toString().padStart(2,"0")+"s":s+"s";}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

/* ---------- Art helpers ---------- */
const EMOJI_RE=/\p{Extended_Pictographic}️?(?:‍\p{Extended_Pictographic}️?)*/gu;
function emojiFile(e){return[...e].map(c=>c.codePointAt(0).toString(16).toUpperCase()).filter(h=>h!=="FE0F").join("-");}
// Decorative: every image sits next to text naming it, and an empty alt keeps emojify() from re-matching its own output.
function em(e,cls="em"){return`<img class="${cls}" src="openmoji/${emojiFile(e)}.svg" alt="" draggable="false">`;}
function ki(name,cls=""){return`<img class="${cls}" src="kenney/icon-${name}.png" alt="" draggable="false">`;}
function emojify(html){return html.replace(EMOJI_RE,e=>em(e));}

function hourly(){return HOURLY[Math.floor(Date.now()/3600000)%HOURLY.length];}
function hourlyLeft(){return 3600000-(Date.now()%3600000);}

 return m;
}
function genMilestone(i){return Math.pow(2,Math.floor(S.gens[i]/25));} // every 25 owned doubles that building
function baseCps(){return GENERATORS.reduce((a,g,i)=>a+g.cps*S.gens[i]*genMilestone(i),0);}
function cps(){return baseCps()*globalMult();}
function clickPower(){
 const base=(1+S.clickLvl)*Math.pow(2,Math.floor(S.clickLvl/10));
 let v=(base+baseCps()*.04)*globalMult();
 buffs.forEach(b=>v*=b.click);
 return v;
}
function critChance(){return hourly().id==="crit"?.2:.05;}

/* ---------- Costs ---------- */
function genCost(i,n=1){const g=GENERATORS[i];let total=0;for(let k=0;k<n;k++)total+=g.cost*Math.pow(1.15,S.gens[i]+k);return total;}
function maxAffordable(i){let n=0,c=0;while(n<1000){const next=GENERATORS[i].cost*Math.pow(1.15,S.gens[i]+n);if(c+next>S.honks)break;c+=next;n++;}return n;}
function clickCost(){return 50*Math.pow(1.6,S.clickLvl);}
function eggCost(w){let c=WORLDS[w].eggCost*Math.pow(1.06,S.pets.filter(p=>p.w===w).length);if(hourly().id==="eggsale")c*=.6;return c;}
function rebirthGain(){return S.run<1e7?0:Math.floor(Math.sqrt(S.run/1e7));}
function earn(n){S.honks+=n;S.run+=n;S.lifetime+=n;}

/* ---------- Sound ---------- */
let audio=null;
function honkSound(pitch=1,len=.13){
 if(S.muted)return;
 try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();const t=audio.currentTime,o=audio.createOscillator(),f=audio.createBiquadFilter(),g=audio.createGain();
  o.type="sawtooth";o.frequency.setValueAtTime(420*pitch,t);o.frequency.exponentialRampToValueAtTime(300*pitch,t+len);
  f.type="lowpass";f.frequency.value=1400;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.18,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+len);
  o.connect(f);f.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+len+.02);}catch(e){}
}
function chime(){if(S.muted)return;[1,1.26,1.5,2].forEach((p,i)=>setTimeout(()=>honkSound(p*1.6,.09),i*70));}

/* ---------- Goose ---------- */
// The goose strolls slowly between random spots, pausing now and then (x is % across the stage).
const wander={x:50,target:50,pauseUntil:performance.now()+3000,facingRight:false,on:!matchMedia("(prefers-reduced-motion: reduce)").matches};
function walkGoose(dt){
 if(!wander.on)return;
 const now=performance.now(),walking=now>=wander.pauseUntil;
 if(walking){
  const step=5*dt,d=wander.target-wander.x; // 5% of the stage per second
  if(Math.abs(d)<=step){wander.x=wander.target;wander.pauseUntil=now+2000+Math.random()*4500;wander.target=24+Math.random()*52;}
  else wander.x+=Math.sign(d)*step;
  const right=wander.target>wander.x;
  if(right!==wander.facingRight){wander.facingRight=right;gooseBtn.querySelector(".goose-body")?.classList.toggle("right",right);}
  gooseBtn.style.left=wander.x.toFixed(2)+"%";
 }
 gooseBtn.classList.toggle("walking",walking);
}
function gooseHTML(){
 const hat=WORLDS[S.world].hat||(S.rebirths>0?"👑":"");
 return `<span class="shadow"></span><span class="goose-body${wander.facingRight?" right":""}">`+em("🪿","goose-img")+(hat?em(hat,"goose-hat"):"")+`</span>`;
}

function rollRarity(){
 const luck=hourly().id==="lucky"?3:1;
 const w=RARITIES.map((r,i)=>i===0?r.chance:r.chance*luck),total=w.reduce((a,b)=>a+b,0);
 let x=Math.random()*total;for(let i=0;i<w.length;i++){if((x-=w[i])<0)return i;}return 0;
}
function hatch(w,free=false){
 if(!free){const c=eggCost(w);if(S.honks<c)return;S.honks-=c;}
 const r=rollRarity(),pet={id:S.nextPetId++,w,r,g:false};
 S.pets.push(pet);S.stats.eggs++;
 if(S.equipped.length<slots())S.equipped.push(pet.id);
 showHatch(pet,free);save();render(true);
}
function showHatch(pet,free){
 const def=PETS[pet.w][pet.r],rar=RARITIES[pet.r];
 openModal(`<div class="art-big hatch-egg shake">🥚</div><h2>${free?"Free egg!":"Hatching…"}</h2><p>${WORLDS[pet.w].egg}</p>`,false);

  openModal(`<div class="art-big ${pet.r>=2?"rays":""}"><span class="reveal">${def[1]}</span></div><h2>${def[0]}</h2><p><span class="rarity" style="--rc:${rar.color}">${rar.name.toUpperCase()}</span><br><br>+${Math.round(petBonus(pet)*100)}% production${S.equipped.includes(pet.id)?" · auto-equipped":""}</p><button class="btn leaf" type="button" data-close>Nice</button>`);
  if(pet.r>=3){chime();setTimeout(chime,300);}else honkSound(1.3,.1);
 },1500);
}
function autoEquip(){S.equipped=[...S.pets].sort((a,b)=>petBonus(b)-petBonus(a)).slice(0,slots()).map(p=>p.id);}
function fuseAll(){
 let fused=0,again=true;
 while(again){again=false;const groups={};S.pets.filter(p=>!p.g).forEach(p=>{(groups[p.w+"-"+p.r]=groups[p.w+"-"+p.r]||[]).push(p);});
  for(const k in groups){if(groups[k].length>=3){const [a,b,c]=groups[k];S.pets=S.pets.filter(p=>p!==b&&p!==c);a.g=true;S.equipped=S.equipped.filter(id=>id!==b.id&&id!==c.id);fused++;again=true;}}}
 if(fused){autoEquip();chime();toast("✨ Fused "+fused+" Golden pet"+(fused>1?"s":"")+"!","gold");}else toast("Need 3 of the same pet to fuse a Golden one.");

 const sorted=[...S.pets].sort((a,b)=>(S.equipped.includes(b.id)-S.equipped.includes(a.id))||petBonus(b)-petBonus(a));
 h+=`<div class="pet-grid">`+sorted.slice(0,120).map(p=>{const d=PETS[p.w][p.r],on=S.equipped.includes(p.id);return`<button type="button" class="pet ${on?"equipped":""} ${p.g?"golden":""}" style="--rc:${RARITIES[p.r].color}" data-equip="${p.id}" title="${RARITIES[p.r].name}: click to ${on?"unequip":"equip"}">${p.g?`<span class="gold-tag">GOLD</span>`:""}${on?`<span class="badge">${ki("checkmark")}</span>`:""}<span class="pe">${d[1]}</span><span class="pn">${d[0]}</span><span class="pb">+${Math.round(petBonus(p)*100)}%</span></button>`;}).join("")+`</div>`;
 if(S.pets.length>120)h+=`<p class="hint" style="margin-top:8px">Showing your best 120 of ${S.pets.length} pets.</p>`;
 return h;
}
function worldsHTML(){
 let h=`<div class="h"><h2>Worlds</h2><small>${S.worlds}/5 unlocked</small></div><p class="hint">Each world multiplies all production and has its own egg. Unlocked worlds stay unlocked after rebirth.</p>`;
 WORLDS.forEach((w,i)=>{
  const unlocked=i<S.worlds,isNext=i===S.worlds,known=unlocked||isNext;
  let btn;
  if(unlocked)btn=i===S.world?`<button class="btn ghost small" type="button" disabled>You're here</button>`:`<button class="btn small" type="button" data-travel="${i}">Travel</button>`;
  else if(isNext)btn=S.rebirths<w.req?`<button class="btn small" type="button" disabled>${w.req} rebirth${w.req>1?"s":""}</button>`:`<button class="btn plum small" type="button" data-unlock="${i}" ${S.honks<w.cost?"disabled":""}>${HONK}${fmt(w.cost)}</button>`;
  else btn=`<button class="btn small" type="button" disabled>${ki("locked")}</button>`;
  h+=`<div class="world ${i===S.world?"current":""} ${known?"":"locked"}" style="background-image:url(${w.thumb})"><span class="we">${known?w.icon:"❓"}</span><span class="row-copy"><strong>${known?w.name:"???"}</strong><small>x${w.mult} production · ${w.egg}</small></span>${btn}</div>`;
 });
 return h;
}
function rebirthHTML(){
 const gain=rebirthGain(),need=1e7,pct=Math.min(100,S.run/need*100);
 return `<div class="reb-card"><div>🪶</div><p>Rebirth now for</p><div class="gain">${fmt(gain)} feather${gain===1?"":"s"}</div><p>Each feather is +10% production forever. You have ${fmt(S.feathers)} (+${fmt(S.feathers*10)}%).</p></div>
 ${gain?"":`<p class="hint">Earn ${fmt(need)} honks in this run to unlock rebirth (${pct.toFixed(1)}% there).</p>`}
 <button class="btn plum" type="button" data-action="rebirth" ${gain?"":"disabled"}>${ki("return")} Rebirth</button>
 <div class="h" style="margin-top:18px"><h2>You keep</h2></div>
 <ul class="checklist"><li>${ki("checkmark")} Golden Feathers, pets, worlds and trophies</li><li>${ki("checkmark")} Extra pet slots at 2, 5 and 10 rebirths</li><li>${ki("checkmark")} A crown for your goose</li></ul>
 <div class="h"><h2>Coming up</h2></div>
 <ul class="checklist">${WORLDS.filter(w=>w.req>S.rebirths).slice(0,2).map(w=>`<li>${w.icon} ${w.req} rebirths unlocks ${w.name}</li>`).join("")||"<li>Every world is open. You are the goose now.</li>"}</ul>`;
}
function trophiesHTML(){
 const mins=Math.floor(S.playMs/60000);
 const stat=(v,l)=>`<div class="stat-box"><b>${v}</b><span>${l}</span></div>`;
 return `<div class="h"><h2>Stats</h2></div><div class="stats-grid">${stat(fmt(S.lifetime),"lifetime honks")}${stat(fmt(S.clicks),"clicks")}${stat(fmt(S.stats.crits),"crit honks")}${stat(fmt(S.stats.eggs),"eggs hatched")}${stat(fmt(S.stats.breads),"golden breads")}${stat(Math.floor(mins/60)+"h "+mins%60+"m","time played")}</div>
 <div class="h"><h2>Trophies</h2><small>${achCount()}/${ACH.length} · +${achCount()*2}%</small></div>
 <div class="ach-grid">${ACH.map(a=>`<div class="ach ${S.ach[a.id]?"got":""}">${S.ach[a.id]?`<img class="medal" src="kenney/medal1.png" alt="">`:ki("locked","lock")}<span><strong>${a.name}</strong>${a.desc}</span></div>`).join("")}</div>
 <button class="btn danger" style="margin-top:18px" type="button" data-action="reset">Reset all progress</button>
 <p class="credit">Art: <a href="https://openmoji.org/" target="_blank" rel="noopener">OpenMoji</a> (CC BY-SA 4.0) and <a href="https://kenney.nl/" target="_blank" rel="noopener">Kenney</a> (CC0). Fonts: Fredoka and Nunito (SIL Open Font License).</p>`;
}
function leadersHTML(){
 let h=`<div class="h"><h2>Leaderboard</h2><span class="seg"><button type="button" data-lb="lifetime" class="${lbMode==="lifetime"?"on":""}">Honks</button><button type="button" data-lb="rebirths" class="${lbMode==="rebirths"?"on":""}">Rebirths</button></span></div>`;
 if(lb.error)return h+`<div class="notice">${lb.error}</div>`;
 if(!lbCache)return h+`<div class="notice">Loading the top geese…</div>`;
 const rows=[...lbCache].sort((a,b)=>lbMode==="lifetime"?b.lifetime_honks-a.lifetime_honks:(b.rebirths-a.rebirths)||(b.lifetime_honks-a.lifetime_honks)).slice(0,50);
 if(!lb.user)h+=`<div class="notice" style="margin-bottom:12px"><a href="../log-in.html?redirect=Games/honk-empire.html">Log in</a> to put your goose on the board.</div>`;
 else h+=`<p class="hint">Your score uploads automatically every minute.${lb.lastMsg?" "+lb.lastMsg:""}</p>`;
 if(!rows.length)return h+`<div class="notice">Nobody here yet. Be the first goose!</div>`;
 const medals=["medal1","medal3","medal2"];
 return h+rows.map((r,i)=>`<div class="lb-row ${lb.user&&r.user_id===lb.user.id?"me":""}"><span class="lb-rank">${i<3?`<img src="kenney/${medals[i]}.png" alt="#${i+1}">`:i+1}</span><span class="lb-avatar">${r.avatar_url?`<img src="${esc(r.avatar_url)}" alt="">`:esc((r.username||"?").charAt(0).toUpperCase())}</span><span class="lb-name">${esc(r.username)}<small>${WORLDS[Math.min(4,Math.max(0,r.worlds_unlocked-1))].icon} ${r.pets_found} pets</small></span><span class="lb-score">${lbMode==="lifetime"?fmt(r.lifetime_honks):r.rebirths+" rebirths"}</span></div>`).join("");
}

/* ---------- Rendering ---------- */
let lastPanelHTML="",lastPanelRender=0,panelPressed=false;
$("tabBody").addEventListener("pointerdown",()=>{panelPressed=true;});
addEventListener("pointerup",()=>setTimeout(()=>{panelPressed=false;},0));
addEventListener("pointercancel",()=>{panelPressed=false;});
// Only touch the DOM when markup changes, so the art images are not re-created every frame.
function setHTML(el,html){html=emojify(html);if(el._html!==html){el._html=html;el.innerHTML=html;}}
function render(force=false){
 const now=Date.now();
 $("honkCount").textContent=fmt(S.honks);
 $("cpsText").textContent=fmt(cps());$("clickText").textContent=fmt(clickPower());
 $("featherChip").textContent=fmt(S.feathers);$("rebirthChip").textContent=S.rebirths;$("multChip").textContent=fmt(globalMult());
 const c=$("combo");c.classList.toggle("on",combo>1.05);if(combo>1.05)c.textContent="COMBO x"+combo.toFixed(1);
 document.title=fmt(S.honks)+" honks · Honk Empire";
 buffs=buffs.filter(b=>b.until>now);
 $("buffs").style.setProperty("--plaque-h",$("plaque").offsetHeight+"px");
 setHTML($("buffs"),buffs.map(b=>`<span class="buff">${b.icon}${b.label} · ${fmtTime(b.until-now)}</span>`).join(""));
 const ev=hourly();setHTML($("eventBanner"),`${ev.icon} <span>${ev.name}: ${ev.desc}</span> <small>· next event in ${fmtTime(hourlyLeft())}</small>`);
 $("dailyBtn").hidden=S.lastDaily===today();
 setHTML($("flock"),GENERATORS.map((g,i)=>S.gens[i]?`<span class="flock-chip" title="${g.name}">${g.icon}${S.gens[i]}</span>`:"").join(""));
 const gain=rebirthGain();
 setHTML($("rebHud"),gain?`<button class="reb-ready" type="button">Rebirth ready: +${fmt(gain)} feathers</button>`:S.run>1e5||S.rebirths?`<div class="reb-bar" title="Progress to rebirth"><i style="width:${Math.min(100,S.run/1e7*100).toFixed(1)}%"></i><span>REBIRTH ${Math.min(100,S.run/1e7*100).toFixed(0)}%</span></div>`:"");
 const alerts={shop:tab!=="shop"&&GENERATORS.some((g,i)=>S.honks>=genCost(i)),pets:tab!=="pets"&&S.honks>=eggCost(S.world),worlds:S.worlds<5&&S.rebirths>=WORLDS[S.worlds].req&&S.honks>=WORLDS[S.worlds].cost,rebirth:tab!=="rebirth"&&gain>0};
 document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("alert",!!alerts[t.dataset.tab]));
 // Never swap panel buttons out from under a press, or the click would be lost.
 if(panelPressed||(!force&&now-lastPanelRender<250))return;
 lastPanelRender=now;
 const html=emojify({shop:shopHTML,pets:petsHTML,worlds:worldsHTML,rebirth:rebirthHTML,trophies:trophiesHTML,leaders:leadersHTML}[tab]());
 if(html!==lastPanelHTML){const body=$("tabBody"),y=body.scrollTop;body.innerHTML=html;body.scrollTop=y;lastPanelHTML=html;}
}

/* ---------- Leaderboard (Supabase) ---------- */
const lb={client:null,user:null,error:"",lastSent:0,lastMsg:""};
async function initLeaderboard(){
 try{if(!window.supabase)throw new Error("offline");lb.client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const {data}=await lb.client.auth.getSession();lb.user=data?.session?.user||null;}
 catch(e){lb.error="The leaderboard is offline right now. Your progress is still saved on this device.";}
}
async function loadLeaderboard(){
 if(!lb.client||Date.now()-lbLoadedAt<15000)return;lbLoadedAt=Date.now();
 const cols="user_id,username,avatar_url,lifetime_honks,rebirths,worlds_unlocked,pets_found";
 const {data,error}=await lb.client.from("honk_empire_scores").select(cols).order("lifetime_honks",{ascending:false}).limit(100);
 if(error){lb.error="The leaderboard is warming up. Check back soon! Your progress is still saved on this device.";console.warn("Honk Empire leaderboard:",error.message);}
 else{lb.error="";lbCache=data||[];const {data:r2}=await lb.client.from("honk_empire_scores").select(cols).order("rebirths",{ascending:false}).limit(100);(r2||[]).forEach(r=>{if(!lbCache.some(x=>x.user_id===r.user_id))lbCache.push(r);});}
 render(true);
}
async function submitScore(force=false){
 if(!lb.client||!lb.user||lb.error.includes("offline"))return;
 if(!force&&Date.now()-lb.lastSent<60000)return;lb.lastSent=Date.now();
 const {data,error}=await lb.client.rpc("honk_empire_submit",{p_lifetime:Math.min(S.lifetime,1e300),p_rebirths:S.rebirths,p_worlds:S.worlds,p_pets:S.stats.eggs});
 if(error){console.warn("Honk Empire submit:",error.message);lb.lastMsg="";}
 else{lb.lastMsg=data?.recorded?"Last upload: just now.":"";lbLoadedAt=0;if(tab==="leaders")loadLeaderboard();}
}

/* ---------- Main loop ---------- */
let last=performance.now(),breakShown=0;
function tick(t){
 const dt=Math.min(1,(t-last)/1000);last=t;
 earn(cps()*dt);
 walkGoose(dt);
 if(performance.now()-lastClick>900&&combo>1)combo=Math.max(1,combo-dt*1.5);
 if(document.visibilityState==="visible")S.playMs+=dt*1000;
 const now=Date.now();
 if(now>nextBread){spawnBread();nextBread=now+(hourly().id==="bread"?20000:60000)+Math.random()*(hourly().id==="bread"?20000:90000);}
 if(now>nextInvasion&&S.lifetime>500){spawnInvasion();nextInvasion=now+240000+Math.random()*180000;}
 // Friendly break reminder every 45 minutes of active play.
 const block=Math.floor(S.playMs/2700000);if(block>breakShown&&S.playMs>0){breakShown=block;toast("💧 The goose demands you drink some water and stretch. It has spoken.");}
 render();
 requestAnimationFrame(tick);
}
function setMuteIcon(){$("muteBtn").innerHTML=ki(S.muted?"audioOff":"audioOn");}
$("muteBtn").addEventListener("click",()=>{S.muted=!S.muted;S.stats.muteToggles++;setMuteIcon();});
$("dailyBtn").addEventListener("click",claimDaily);
setInterval(()=>{checkAch();save();},2000);
setInterval(()=>{submitScore();if(tab==="leaders")loadLeaderboard();},15000);
function showNews(n){const el=$("ticker");el.textContent=n;el.style.animation="none";void el.offsetWidth;el.style.animation="";}
setInterval(()=>{const pool=NEWS.filter(n=>S.lifetime>=n[1]);showNews(pool[Math.floor(Math.random()*pool.length)][0]);},24000);
addEventListener("pagehide",save);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")save();else last=performance.now();});

// Swap the emoji in the static header, tabs and gift button for OpenMoji art.
document.querySelectorAll(".top-stats .pill,.tab .ti,#dailyBtn").forEach(el=>{el.innerHTML=emojify(el.innerHTML);});
breakShown=Math.floor(S.playMs/2700000);
setMuteIcon();
showNews(NEWS[Math.floor(Math.random()*3)][0]);
applyWorld();
offlineEarnings();
initLeaderboard().then(()=>{submitScore(true);if(tab==="leaders")loadLeaderboard();});
render(true);
requestAnimationFrame(tick);
</script>
</body>
</html>
