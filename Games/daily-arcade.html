<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b18"><title>DougHub Daily Arcade</title><link rel="icon" href="../DougHub.svg"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px 14px 40px;background:radial-gradient(ellipse at 15% 10%,#393078,transparent 38%),radial-gradient(ellipse at 90% 80%,#174d68,transparent 38%),#080b18;color:#f8f8ff;font-family:Inter,system-ui,sans-serif;display:flex;justify-content:center}.wrap{width:min(720px,100%)}a{color:#c6c5ff;text-decoration:none}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.back,.action{border:1px solid #ffffff25;background:#ffffff0c;color:#fff;border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer}.eyebrow{font-size:10px;letter-spacing:.16em;color:#91e5ff;font-weight:900}.head{text-align:center;margin:18px 0 24px}.head h1{font-size:clamp(30px,7vw,46px);letter-spacing:-.06em;margin:7px 0}.head p{color:#aeb5d5;font-size:13px}.panel{background:#111832cc;border:1px solid #ffffff1b;border-radius:22px;padding:clamp(16px,4vw,26px);box-shadow:0 20px 60px #0005}.status{text-align:center;min-height:28px;color:#c8c9f3;font-size:13px;font-weight:750;margin:15px 0}.grid{display:grid;gap:10px}.memory{grid-template-columns:repeat(4,1fr)}.tile{aspect-ratio:1;border:1px solid #ffffff22;border-radius:15px;background:linear-gradient(145deg,#293568,#191f43);display:grid;place-items:center;cursor:pointer;min-width:0}.tile img{width:68%;height:68%;object-fit:contain}.tile span{font-size:clamp(22px,6vw,40px)}.tile.open,.tile.matched{background:#244b59;border-color:#6ce4ce}.sequence{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin:22px 0}.sequence .tile{width:72px;aspect-ratio:1}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}.answers button{min-height:58px;border:1px solid #ffffff25;border-radius:13px;background:#252d55;color:#fff;font-weight:800;padding:12px;cursor:pointer}.answers button:hover,.action:hover{filter:brightness(1.2)}.progress{height:7px;background:#ffffff17;border-radius:9px;overflow:hidden;margin:12px 0}.progress i{display:block;height:100%;background:linear-gradient(90deg,#63dbd0,#a98bff);width:0}.reward{display:none;text-align:center;padding:18px;background:#173c3b;border:1px solid #54d8ad66;border-radius:16px;margin-top:15px}.reward.show{display:block}.reward strong{font-size:22px}.artline{display:flex;justify-content:center;gap:12px;margin:12px}.artline img{width:48px;height:48px;object-fit:contain}.small{color:#9ba4c7;font-size:11px;text-align:center;margin-top:18px}@media(max-width:420px){.memory{gap:7px}.answers{grid-template-columns:1fr}.tile{border-radius:11px}}
</style></head><body><main class="wrap"><div class="top"><a class="back" href="../douggames.html">← Games</a><span class="eyebrow">DAILY ARCADE</span></div><header class="head"><div class="eyebrow" id="kind">TODAY'S CHALLENGE</div><h1 id="title">Daily challenge</h1><p id="subtitle">A new little challenge every day.</p><div class="artline"><img src="characters/openmoji/fox.svg" alt="OpenMoji fox"><img src="characters/openmoji/turtle.svg" alt="OpenMoji turtle"><img src="characters/openmoji/ghost.svg" alt="OpenMoji ghost"></div></header><section class="panel"><div id="game"></div><div class="status" id="status" aria-live="polite">Loading today's game…</div><div class="progress"><i id="bar"></i></div><div class="reward" id="reward"><strong>+15 credits!</strong><p id="rewardText">Today's reward has been added to your wallet.</p><a href="../douggames.html">Back to daily games →</a></div></section><p class="small">New puzzle every day · One credit reward per game each day · Artwork: OpenMoji, CC BY-SA 4.0</p></main>
<script>
const db=window.supabase?.createClient("https://agsqdqcsmsppcdqxlppj.supabase.co","sb_publishable_Oq1WvEHgoHcjmCBGbEnoYQ_BqYA1p52");
const params=new URLSearchParams(location.search),kind=params.get("game")||"match",date=new Date().toISOString().slice(0,10),$=id=>document.getElementById(id);
const games={match:["Daily Match","Find all four pairs before the timer runs out.","Match the animal pairs."],sequence:["Daily Sequence","Remember the order, then repeat it.","Watch closely, then tap the sequence."],trivia:["Daily Trivia","Five quick questions about nature and animals.","Choose the best answer each round."]};
$("title").textContent=(games[kind]||games.match)[0];$("subtitle").textContent=(games[kind]||games.match)[1];
let seed=[...date].reduce((n,c)=>n+c.charCodeAt(0),kind.length*31);function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}function shuffle(a){return a.map(x=>[rand(),x]).sort((x,y)=>x[0]-y[0]).map(x=>x[1])}
let finished=false;function progress(n,total){$("bar").style.width=(n/total*100)+"%"}function status(s){$("status").textContent=s}
async function claim(){if(finished)return;finished=true;const dailyKey="dh-daily-complete-"+date;let done=[];try{done=JSON.parse(localStorage.getItem(dailyKey)||"[]");}catch(e){}if(!Array.isArray(done))done=[];if(!done.includes(kind))done.push(kind);localStorage.setItem(dailyKey,JSON.stringify(done));try{const {data:{session}}=await db.auth.getSession();if(!session){$("rewardText").textContent="Challenge complete! Sign in to collect your 15 credits."; }else{const {data,error}=await db.rpc("dh_claim_daily_game",{p_game:kind});if(error)throw error;$("rewardText").textContent=data?.claimed?"15 credits added to your wallet!":"You already collected today's reward.";}}catch(e){$("rewardText").textContent=e.message||"Challenge complete, but the reward could not be claimed. Refresh and try again.";} $("reward").classList.add("show");status("Challenge complete!");}
function startMatch(){const icons=["fox","rabbit","frog","owl"],cards=shuffle([...icons,...icons]);let open=[],matched=0,locked=false,moves=0;const root=$("game");root.className="grid memory";root.innerHTML=cards.map((x,i)=>'<button class="tile" aria-label="Hidden card" data-i="'+i+'"><span>?</span></button>').join("");root.addEventListener("click",e=>{const b=e.target.closest("button[data-i]");if(!b||locked||finished||b.classList.contains("matched")||open.includes(+b.dataset.i))return;const i=+b.dataset.i;b.classList.add("open");b.innerHTML='<img alt="'+cards[i]+'" src="characters/openmoji/'+cards[i]+'.svg">';open.push(i);if(open.length===2){moves++;locked=true;const [a,c]=open;if(cards[a]===cards[c]){[a,c].forEach(j=>root.querySelector('[data-i="'+j+'"]').classList.add("matched"));matched++;open=[];locked=false;progress(matched,4);status(matched+"/4 pairs found · "+moves+" moves");if(matched===4)claim();}else setTimeout(()=>{[a,c].forEach(j=>{const el=root.querySelector('[data-i="'+j+'"]');el.classList.remove("open");el.innerHTML="<span>?</span>"});open=[];locked=false;status("Keep going — "+matched+" of 4 pairs found.");},700);}});status("Find all four matching pairs.");}
function startSequence(){const symbols=["fox","rabbit","frog","owl","turtle","ghost"],seq=Array.from({length:5},()=>Math.floor(rand()*symbols.length));let step=0,round=0;const root=$("game");root.innerHTML='<div class="sequence" id="seq"></div><div class="answers" id="choices"></div>';const display=()=>{const box=$("seq");box.innerHTML=seq.slice(0,round+3).map((v,i)=>'<div class="tile">'+(i<step?"✓":'<img alt="" src="characters/openmoji/'+symbols[v]+'.svg" style="width:65%;height:65%;object-fit:contain">')+'</div>').join("");};function next(){round++;step=0;display();const choices=$("choices");choices.innerHTML=shuffle(symbols.map((v,i)=>({v,i}))).map(o=>'<button data-v="'+o.i+'"><img alt="" src="characters/openmoji/'+o.v+'.svg" style="width:34px;height:34px;object-fit:contain;vertical-align:middle;margin-right:8px">'+o.v+'</button>').join("");status("Round "+round+" of 3 · Repeat the "+(round+2)+" symbols.");progress(round-1,3);choices.onclick=e=>{const b=e.target.closest("button[data-v]");if(!b||finished)return;const val=+b.dataset.v;if(val!==seq[step]){status("Not quite! Try the sequence again.");step=0;display();return;}step++;display();if(step===round+2){if(round===3){progress(3,3);claim();}else{status("Great memory! Next round…");setTimeout(next,650);}}};}next();}
const questions=[["Which animal is known for carrying its home on its back?","Turtle",["Fox","Turtle","Owl","Dolphin"]],["What do bees collect from flowers?","Nectar",["Sand","Nectar","Leaves","Snow"]],["Which animal is a mammal that can fly?","Bat",["Penguin","Bat","Frog","Snake"]],["What is a baby frog called?","Tadpole",["Cub","Chick","Tadpole","Kitten"]],["Which habitat is a coral reef found in?","Ocean",["Desert","Forest","Ocean","Tundra"]]];
function startTrivia(){let q=shuffle(questions).slice(0,5),i=0,correct=0;const root=$("game");function show(){const x=q[i];root.innerHTML='<div class="eyebrow">QUESTION '+(i+1)+' / 5</div><h2 style="font-size:22px;text-align:center;min-height:65px">'+x[0]+'</h2><div class="answers">'+shuffle(x[2]).map(a=>'<button>'+a+'</button>').join("")+'</div>';progress(i,5);root.querySelector(".answers").onclick=e=>{const b=e.target.closest("button");if(!b||finished)return;if(b.textContent===x[1])correct++;i++;if(i===5){progress(5,5);if(correct>=3)claim();else{status(correct+"/5 correct. You need 3 to finish — play again!");const retry=document.createElement("button");retry.className="action";retry.textContent="Try again";retry.onclick=()=>{i=0;correct=0;q=shuffle(questions).slice(0,5);show();};root.append(retry);} }else{status(b.textContent===x[1]?"Correct!":"Next one!");show();}};}show();}
if(!games[kind]){status("Unknown daily game.");}else if(!db){status("The game service is unavailable.");}else if(kind==="match")startMatch();else if(kind==="sequence")startSequence();else startTrivia();
</script></body></html>
