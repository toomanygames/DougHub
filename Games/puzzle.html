
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Doug Puzzle</title>
<script src="../display.js"></script>

<style>
:root {
    color-scheme: dark;
}

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
}

body {
    background:
        radial-gradient(
            circle at 15% 0%,
            rgba(99, 102, 241, 0.18),
            transparent 35%
        ),
        radial-gradient(
            circle at 90% 20%,
            rgba(168, 85, 247, 0.12),
            transparent 35%
        ),
        #02040a;

    color: #f8fafc;

    font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    overflow: hidden;
}


/* =========================
   APP
   ========================= */

.app {
    width: 100%;
    height: 100%;

    display: flex;
    flex-direction: column;
}


/* =========================
   TOP BAR
   ========================= */

.topbar {
    height: 68px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 22px;

    border-bottom:
        1px solid rgba(148, 163, 184, 0.12);

    background:
        rgba(5, 8, 18, 0.78);

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    box-shadow:
        0 10px 35px rgba(0, 0, 0, 0.25);
}

.brand {
    font-size: 23px;
    font-weight: 800;
    letter-spacing: -0.8px;
}

.brand .doug {
    color: #6366f1;

    text-shadow:
        0 0 20px rgba(99, 102, 241, 0.4);
}

.brand .hub {
    color: #f8fafc;
}

.game-name {
    color: #94a3b8;

    font-size: 12px;
    font-weight: 600;

    letter-spacing: 1.5px;

    text-transform: uppercase;
}


/* =========================
   CONTENT
   ========================= */

.content {
    flex: 1;

    min-height: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    gap: 28px;

    padding: 24px;

    overflow: auto;
}


/* =========================
   SIDE PANEL
   ========================= */

.panel {
    width: 235px;

    padding: 22px;

    border:
        1px solid rgba(129, 140, 248, 0.18);

    border-radius: 18px;

    background:
        linear-gradient(
            145deg,
            rgba(15, 23, 42, 0.78),
            rgba(8, 12, 24, 0.78)
        );

    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);

    box-shadow:
        0 15px 40px rgba(0, 0, 0, 0.25),
        inset 0 1px 0 rgba(255,255,255,.035);
}

.panel h1 {
    margin: 0 0 8px;

    font-size: 21px;

    font-weight: 800;
}

.panel h1 .blue {
    color: #6366f1;
}

.panel h1 .white {
    color: #f8fafc;
}

.panel .subtitle {
    margin-bottom: 20px;

    color: #64748b;

    font-size: 11px;

    text-transform: uppercase;

    letter-spacing: 1.5px;
}

.panel p {
    margin: 0 0 18px;

    color: #94a3b8;

    font-size: 12px;

    line-height: 1.65;
}

.legend {
    display: flex;
    flex-direction: column;
    gap: 10px;

    margin-top: 18px;
}

.legend-item {
    display: flex;

    align-items: center;

    gap: 9px;

    color: #94a3b8;

    font-size: 11px;
}

.dot {
    width: 10px;
    height: 10px;

    border-radius: 50%;

    flex-shrink: 0;
}

.dot.green {
    background: #34d399;

    box-shadow:
        0 0 10px rgba(52,211,153,.7);
}

.dot.purple {
    background: #a855f7;

    box-shadow:
        0 0 10px rgba(168,85,247,.7);
}

.dot.blue {
    background: #6366f1;

    box-shadow:
        0 0 10px rgba(99,102,241,.7);
}


/* =========================
   GAME AREA
   ========================= */

.game-area {
    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 15px;
}


/* =========================
   STATS
   ========================= */

.stats {
    width: 100%;

    display: flex;

    justify-content: space-between;

    gap: 10px;
}

.stat {
    min-width: 100px;

    padding: 9px 13px;

    border:
        1px solid rgba(129,140,248,.15);

    border-radius: 11px;

    background:
        rgba(15,23,42,.62);

    color: #64748b;

    font-size: 10px;

    text-transform: uppercase;

    letter-spacing: 1px;
}

.stat strong {
    display: block;

    margin-top: 2px;

    color: #e2e8f0;

    font-size: 15px;

    letter-spacing: 0;

    text-transform: none;
}


/* =========================
   BOARD
   ========================= */

.board {
    display: grid;

    grid-template-columns:
        repeat(7, 1fr);

    grid-template-rows:
        repeat(7, 1fr);

    width: min(68vh, 560px);
    height: min(68vh, 560px);

    max-width: 560px;
    max-height: 560px;

    padding: 8px;

    gap: 5px;

    border:
        1px solid rgba(129,140,248,.3);

    border-radius: 19px;

    background:
        rgba(4,7,15,.85);

    box-shadow:
        0 20px 55px rgba(0,0,0,.4),
        0 0 35px rgba(99,102,241,.08),
        inset 0 0 25px rgba(0,0,0,.6);
}


/* =========================
   TILES
   ========================= */

.tile {
    position: relative;

    min-width: 0;
    min-height: 0;

    border:
        1px solid rgba(99,102,241,.13);

    border-radius: 7px;

    background:
        linear-gradient(
            145deg,
            rgba(15,23,42,.95),
            rgba(8,12,24,.95)
        );

    cursor: pointer;

    overflow: hidden;

    transition:
        background .15s ease,
        border-color .15s ease,
        transform .1s ease;
}

.tile:hover {
    border-color:
        rgba(129,140,248,.5);

    background:
        rgba(25,33,58,.95);
}

.tile:active {
    transform: scale(.96);
}


/* =========================
   WIRES
   ========================= */

.wire {
    position: absolute;

    background:
        #4f46a5;

    box-shadow:
        0 0 7px rgba(99,102,241,.35);

    transition:
        background .2s,
        box-shadow .2s;
}

.wire.up {
    width: 10px;
    height: 52%;

    left: calc(50% - 5px);
    top: 0;
}

.wire.down {
    width: 10px;
    height: 52%;

    left: calc(50% - 5px);
    bottom: 0;
}

.wire.left {
    width: 52%;
    height: 10px;

    left: 0;
    top: calc(50% - 5px);
}

.wire.right {
    width: 52%;
    height: 10px;

    right: 0;
    top: calc(50% - 5px);
}


/* =========================
   TILE CENTER
   ========================= */

.core {
    position: absolute;

    width: 20px;
    height: 20px;

    left: calc(50% - 10px);
    top: calc(50% - 10px);

    border-radius: 50%;

    background:
        #25295a;

    border:
        2px solid #6366f1;

    box-shadow:
        0 0 9px rgba(99,102,241,.35);

    z-index: 2;
}


/* =========================
   POWERED
   ========================= */

.tile.powered .wire {
    background:
        #60a5fa;

    box-shadow:
        0 0 8px #60a5fa,
        0 0 18px rgba(96,165,250,.55);
}

.tile.powered .core {
    background:
        #6366f1;

    border-color:
        #bfdbfe;

    box-shadow:
        0 0 12px #6366f1,
        0 0 22px rgba(99,102,241,.65);
}


/* =========================
   SOURCE
   ========================= */

.tile.source .core {
    background:
        #34d399;

    border-color:
        #bbf7d0;

    box-shadow:
        0 0 13px #34d399,
        0 0 25px rgba(52,211,153,.65);
}


/* =========================
   REACTOR
   ========================= */

.tile.reactor .core {
    background:
        #a855f7;

    border-color:
        #e9d5ff;

    box-shadow:
        0 0 13px #a855f7,
        0 0 25px rgba(168,85,247,.65);
}

.tile.reactor.powered .core {
    background:
        #c084fc;

    box-shadow:
        0 0 15px #c084fc,
        0 0 35px rgba(192,132,252,.9);
}


/* =========================
   BUTTONS
   ========================= */

.buttons {
    display: flex;

    gap: 9px;
}

button {
    border:
        1px solid rgba(129,140,248,.22);

    border-radius: 9px;

    padding: 8px 15px;

    background:
        rgba(99,102,241,.09);

    color: #a5b4fc;

    font:
        600 12px
        Inter,
        ui-sans-serif,
        system-ui,
        sans-serif;

    cursor: pointer;

    transition: .15s;
}

button:hover {
    background:
        rgba(99,102,241,.2);

    border-color:
        rgba(129,140,248,.55);

    color: white;
}


/* =========================
   WIN SCREEN
   ========================= */

.win {
    position: fixed;

    inset: 0;

    z-index: 20;

    display: none;

    align-items: center;
    justify-content: center;

    background:
        rgba(2,4,10,.78);

    backdrop-filter: blur(8px);
}

.win.show {
    display: flex;
}

.win-box {
    width: min(90%, 420px);

    padding: 32px;

    text-align: center;

    border:
        1px solid rgba(129,140,248,.45);

    border-radius: 20px;

    background:
        linear-gradient(
            145deg,
            rgba(15,23,42,.96),
            rgba(8,12,24,.96)
        );

    box-shadow:
        0 25px 70px rgba(0,0,0,.55),
        0 0 45px rgba(99,102,241,.15);
}

.win-brand {
    font-size: 26px;

    font-weight: 800;
}

.win-brand .doug {
    color: #6366f1;
}

.win-brand .hub {
    color: white;
}

.win-box h2 {
    margin: 10px 0;

    color: #e2e8f0;

    font-size: 22px;
}

.win-box p {
    color: #94a3b8;

    font-size: 13px;
}

.win-box .result {
    color: #a5b4fc;

    font-size: 13px;

    margin: 18px 0;
}


/* =========================
   MOBILE
   ========================= */

@media (max-width: 850px) {

    .panel {
        display: none;
    }

    .content {
        padding: 15px;
    }

    .board {
        width: min(86vw, 560px);
        height: min(86vw, 560px);
    }
}

@media (max-width: 500px) {

    .topbar {
        height: 58px;
        padding: 0 14px;
    }

    .brand {
        font-size: 20px;
    }

    .game-name {
        display: none;
    }

    .content {
        padding: 10px;
    }

    .board {
        padding: 5px;
        gap: 3px;
        border-radius: 13px;
    }

    .wire.up,
    .wire.down {
        width: 7px;
        left: calc(50% - 3.5px);
    }

    .wire.left,
    .wire.right {
        height: 7px;
        top: calc(50% - 3.5px);
    }

    .core {
        width: 14px;
        height: 14px;
        left: calc(50% - 7px);
        top: calc(50% - 7px);
    }
}
</style>

<body>

<div class="app">

    <div class="topbar">

        <div class="brand">
            <span class="doug">Doug</span><span class="hub">Hub</span>
        </div>

        <div class="game-name">
            CIRCUIT SHIFT
        </div>

    </div>


    <div class="content">

        <div class="panel">

            <h1>
                <span class="blue">Doug</span><span class="white"> Puzzle</span>
            </h1>

            <div class="subtitle">
                Circuit Shift
            </div>

            <p>
                Rotate the tiles to create a complete
                connection from the power source to
                the reactor.
            </p>

            <p>
                Click a tile to rotate it 90°.
            </p>

            <div class="legend">

                <div class="legend-item">
                    <div class="dot green"></div>
                    Power Source
                </div>

                <div class="legend-item">
                    <div class="dot blue"></div>
                    Circuit
                </div>

                <div class="legend-item">
                    <div class="dot purple"></div>
                    Reactor
                </div>

            </div>

        </div>


        <div class="game-area">

            <div class="stats">

                <div class="stat">
                    Moves
                    <strong id="moves">0</strong>
                </div>

                <div class="stat">
                    Time
                    <strong id="time">0s</strong>
                </div>

            </div>


            <div class="board" id="board"></div>


            <div class="buttons">

                <button onclick="newGame()">
                    New Puzzle
                </button>

                <button onclick="home()">
                    ← DougHub
                </button>

            </div>

        </div>

    </div>

</div>


<div class="win" id="win">

    <div class="win-box">

        <div class="win-brand">
            <span class="doug">Doug</span><span class="hub">Hub</span>
        </div>

        <h2>
            Circuit Connected
        </h2>

        <p>
            The reactor is powered.
        </p>

        <div class="result">
            Moves: <span id="finalMoves">0</span>
            &nbsp; • &nbsp;
            Time: <span id="finalTime">0s</span>
        </div>

        <button onclick="newGame()">
            Play Again
        </button>

        <button onclick="home()">
            DougHub
        </button>

    </div>

</div>


<script>

const SIZE = 7;

let board = [];
let moves = 0;
let seconds = 0;
let timer = null;
let won = false;

const DIRS = [
    [-1, 0],
    [0, 1],
    [1, 0],
    [0, -1]
];

function opposite(dir) {
    return (dir + 2) % 4;
}

function rotateDirections(list) {
    return list.map(dir => (dir + 1) % 4);
}

function shuffle(list) {

    const result = [...list];

    for (let i = result.length - 1; i > 0; i--) {

        const j =
            Math.floor(Math.random() * (i + 1));

        [result[i], result[j]] =
            [result[j], result[i]];
    }

    return result;
}


/* =========================
   CREATE PUZZLE
   ========================= */

function generatePuzzle() {

    board = [];

    for (let r = 0; r < SIZE; r++) {

        board[r] = [];

        for (let c = 0; c < SIZE; c++) {

            board[r][c] = {
                connections: [],
                rotation: 0
            };

        }
    }

    const visited =
        Array.from(
            { length: SIZE },
            () => Array(SIZE).fill(false)
        );


    function carve(r, c) {

        visited[r][c] = true;

        const directions =
            shuffle([0, 1, 2, 3]);


        for (const dir of directions) {

            const nr =
                r + DIRS[dir][0];

            const nc =
                c + DIRS[dir][1];


            if (
                nr < 0 ||
                nr >= SIZE ||
                nc < 0 ||
                nc >= SIZE
            ) {
                continue;
            }


            if (visited[nr][nc]) {
                continue;
            }


            board[r][c]
                .connections
                .push(dir);

            board[nr][nc]
                .connections
                .push(opposite(dir));


            carve(nr, nc);
        }
    }


    carve(0, 0);


    for (let r = 0; r < SIZE; r++) {

        for (let c = 0; c < SIZE; c++) {

            board[r][c].rotation =
                Math.floor(Math.random() * 4);

        }
    }
}


/* =========================
   GET CURRENT CONNECTIONS
   ========================= */

function getConnections(tile) {

    let result =
        [...tile.connections];

    for (
        let i = 0;
        i < tile.rotation;
        i++
    ) {

        result =
            rotateDirections(result);
    }

    return result;
}


/* =========================
   DRAW BOARD
   ========================= */

function render() {

    const boardElement =
        document.getElementById("board");

    boardElement.innerHTML = "";


    for (let r = 0; r < SIZE; r++) {

        for (let c = 0; c < SIZE; c++) {

            const tile = board[r][c];

            const element =
                document.createElement("div");

            element.className = "tile";


            if (r === 0 && c === 0) {
                element.classList.add("source");
            }


            if (
                r === SIZE - 1 &&
                c === SIZE - 1
            ) {

                element.classList.add("reactor");
            }


            const connections =
                getConnections(tile);


            for (const dir of connections) {

                const wire =
                    document.createElement("div");

                wire.className = "wire";


                if (dir === 0) {
                    wire.classList.add("up");
                }

                if (dir === 1) {
                    wire.classList.add("right");
                }

                if (dir === 2) {
                    wire.classList.add("down");
                }

                if (dir === 3) {
                    wire.classList.add("left");
                }


                element.appendChild(wire);
            }


            const core =
                document.createElement("div");

            core.className = "core";

            element.appendChild(core);


            element.addEventListener(
                "click",
                () => {

                    if (won) return;

                    tile.rotation =
                        (tile.rotation + 1) % 4;

                    moves++;

                    document.getElementById(
                        "moves"
                    ).textContent = moves;

                    render();

                }
            );


            boardElement.appendChild(element);
        }
    }


    updatePower();
}


/* =========================
   POWER PROPAGATION
   ========================= */

function updatePower() {

    const powered =
        Array.from(
            { length: SIZE },
            () => Array(SIZE).fill(false)
        );


    const queue = [[0, 0]];

    powered[0][0] = true;


    while (queue.length > 0) {

        const [r, c] =
            queue.shift();


        const connections =
            getConnections(board[r][c]);


        for (const dir of connections) {

            const nr =
                r + DIRS[dir][0];

            const nc =
                c + DIRS[dir][1];


            if (
                nr < 0 ||
                nr >= SIZE ||
                nc < 0 ||
                nc >= SIZE
            ) {
                continue;
            }


            const neighbor =
                getConnections(
                    board[nr][nc]
                );


            if (
                neighbor.includes(
                    opposite(dir)
                ) &&
                !powered[nr][nc]
            ) {

                powered[nr][nc] = true;

                queue.push([nr, nc]);
            }
        }
    }


    const tiles =
        document.querySelectorAll(".tile");


    tiles.forEach((tile, index) => {

        const r =
            Math.floor(index / SIZE);

        const c =
            index % SIZE;


        tile.classList.toggle(
            "powered",
            powered[r][c]
        );

    });


    if (
        powered[SIZE - 1][SIZE - 1] &&
        !won
    ) {

        finishGame();
    }
}


/* =========================
   WIN
   ========================= */

function finishGame() {

    won = true;

    clearInterval(timer);

    document.getElementById(
        "finalMoves"
    ).textContent = moves;

    document.getElementById(
        "finalTime"
    ).textContent = seconds + "s";

    document.getElementById(
        "win"
    ).classList.add("show");
}


/* =========================
   NEW GAME
   ========================= */

function newGame() {

    clearInterval(timer);

    moves = 0;
    seconds = 0;
    won = false;

    document.getElementById(
        "moves"
    ).textContent = "0";

    document.getElementById(
        "time"
    ).textContent = "0s";

    document.getElementById(
        "win"
    ).classList.remove("show");


    generatePuzzle();

    render();


    timer = setInterval(() => {

        if (won) return;

        seconds++;

        document.getElementById(
            "time"
        ).textContent =
            seconds + "s";

    }, 1000);
}


/* =========================
   BACK TO DOUGHUB
   ========================= */

function home() {

    window.parent.postMessage(
        {
            type: "puzzle-home"
        },
        "*"
    );
}


newGame();

</script>
