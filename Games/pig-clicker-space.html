    function ensureAudio() {
      if (!audioCtx) {
        const Ctx =
          window.AudioContext ||
          window.webkitAudioContext;

        if (Ctx) {
          audioCtx = new Ctx();
        }
      }

      if (
        audioCtx &&
        audioCtx.state === 'suspended'
      ) {
        audioCtx.resume();
      }
    }

    function playTone(
      freq,
      duration,
      type,
      gainValue = 0.04,
      delay = 0
    ) {
      if (!audioCtx) return;

      const osc =
        audioCtx.createOscillator();

      const gain =
        audioCtx.createGain();

      osc.type = type;
      osc.frequency.value = freq;

      gain.gain.value = 0.0001;

      osc.connect(gain);
      gain.connect(
        audioCtx.destination
      );

      const now =
        audioCtx.currentTime + delay;

      gain.gain.setValueAtTime(
        0.0001,
        now
      );

      gain.gain.exponentialRampToValueAtTime(
        gainValue,
        now + 0.02
      );

      gain.gain.exponentialRampToValueAtTime(
        0.0001,
        now + duration
      );

      osc.start(now);

      osc.stop(
        now + duration + 0.03
      );
    }

    let state =
      JSON.parse(
        JSON.stringify(defaultState)
      );

    function loadState() {
      const raw =
        localStorage.getItem(saveKey);

      if (!raw) return;

      try {
        const parsed =
          JSON.parse(raw);

        state = {
          ...JSON.parse(
            JSON.stringify(defaultState)
          ),
          ...parsed
        };

        state.upgrades =
          defaultState.upgrades.map(
            (base) => {

              const saved =
                (parsed.upgrades || [])
                  .find(
                    (u) =>
                      u.id === base.id
                  );

              return {
                ...base,
                owned:
                  saved?.owned ??
                  base.owned
              };
            }
          );

        state.achievementDefs =
          defaultState.achievementDefs;

        state.achievements =
          parsed.achievements || {};

        state.readyAchievements =
          parsed.readyAchievements || {};

      } catch (e) {
        console.log(
          'Space save failed to load'
        );
      }
    }

    function saveState() {
      localStorage.setItem(
        saveKey,
        JSON.stringify(state)
      );
    }

    function formatNumber(num) {
      if (!Number.isFinite(num)) {
        return '∞';
      }

      const scales = [
        [1e23, 'sextillion'],
        [1e21, 'sextillion'],
        [1e20, 'quintillion'],
        [1e18, 'quintillion'],
        [1e15, 'quadrillion'],
        [1e12, 'trillion'],
        [1e9, 'billion'],
        [1e6, 'million'],
        [1e3, 'thousand']
      ];

      const scale =
        scales.find(
          ([value]) =>
            num >= value
        );

      if (scale) {
        return (
          Math.floor(
            (num / scale[0]) * 10
          ) / 10
        ).toFixed(1)
          + ' '
          + scale[1];
      }

      return formatter.format(
        Math.floor(num)
      );
    }

    function isUnlocked(upg) {
      return (
        state.totalFragments >=
        upg.unlockAt
      );
    }

    function getMultiplier() {
      return state.feverActive
        ? 2
        : 1;
    }

    function refreshHud() {
      fragmentEl.textContent =
        formatNumber(
          state.fragments
        ) +
        ' Asteroid Fragments';

      tapText.textContent =
        '+' +
        formatNumber(
          state.perTap *
          getMultiplier()
        ) +
        ' per tap';

      perTapStat.textContent =
        formatNumber(
          state.perTap
        );

      autoStat.textContent =
        formatNumber(
          state.autoPerSecond
        ) +
        '/s';

      feverStat.textContent =
        Math.min(
          100,
          Math.round(
            state.feverMeter
          )
        ) +
        '%';

      feverFill.style.width =
        Math.min(
          100,
          Math.max(
            0,
            state.feverMeter
          )
        ) +
        '%';

      feverLabel.textContent =
        state.feverActive
          ? '🌌 Cosmic fever!'
          : state.feverMeter >= 100
            ? '✨ Cosmic fever ready'
            : 'Build space fever';

      missionStat.textContent =
        formatNumber(
          state.missions
        );
    }

    function getUpgradeCount() {
      return state.upgrades.reduce(
        (sum, upg) =>
          sum + upg.owned,
        0
      );
    }

    function isAchievementReady(ach) {

      if (ach.metric === 'totalFragments') {
        return (
          state.totalFragments >=
          ach.goal
        );
      }

      if (ach.metric === 'perTap') {
        return (
          state.perTap >=
          ach.goal
        );
      }

      if (ach.metric === 'auto') {
        return (
          state.autoPerSecond >=
          ach.goal
        );
      }

      if (ach.metric === 'fever') {
        return state.feverActive;
      }

      if (ach.metric === 'upgrades') {
        return (
          getUpgradeCount() >=
          ach.goal
        );
      }

      return false;
    }

    function checkAchievements() {

      let changed = false;

      state.achievementDefs.forEach(
        (ach) => {

          if (
            !state.achievements[
              ach.id
            ] &&
            !state.readyAchievements[
              ach.id
            ] &&
            isAchievementReady(ach)
          ) {

            state.readyAchievements[
              ach.id
            ] = true;

            changed = true;
          }
        }
      );

      if (changed) {
        renderAchievements();
      }
    }

    function claimAchievement(id) {

      if (
        !state.readyAchievements[id] ||
        state.achievements[id]
      ) {
        return;
      }

      const ach =
        state.achievementDefs.find(
          (a) =>
            a.id === id
        );

      if (!ach) return;

      state.achievements[id] =
        true;

      delete state.readyAchievements[
        id
      ];

      state.fragments +=
        ach.reward;

      state.totalFragments +=
        ach.reward;

      state.missions += 1;

      playReward();

      refreshHud();
      renderAchievements();
      saveState();
    }

    function addFragments(amount) {

      state.fragments += amount;
      state.totalFragments += amount;

      refreshHud();

      checkAchievements();

      renderStore();

      saveState();
    }

    const FEVER_BASE_TIME = 8;
    const FEVER_MAX_TIME = 14;
    const FEVER_TIME_PER_CLICK = 0.7;

    function addFever(amount) {

      if (state.feverActive) {

        state.feverTimer =
          Math.min(
            FEVER_MAX_TIME,
            state.feverTimer +
            FEVER_TIME_PER_CLICK
          );

        refreshHud();

        return;
      }

      state.feverMeter += amount;

      if (
        state.feverMeter >= 100
      ) {

        state.feverMeter = 100;

        state.feverActive =
          true;

        state.feverTimer =
          FEVER_BASE_TIME;

        playReward();
      }

      refreshHud();
    }

    function updateFever(dt) {

      if (state.feverActive) {

        state.feverTimer -= dt;

        state.feverMeter =
          Math.max(
            0,
            Math.min(
              100,
              (
                state.feverTimer /
                FEVER_MAX_TIME
              ) * 100
            )
          );

        if (
          state.feverTimer <= 0
        ) {

          state.feverActive =
            false;

          state.feverTimer = 0;
          state.feverMeter = 0;
        }

      } else {

        state.feverMeter =
          Math.max(
            0,
            state.feverMeter -
            dt * 7
          );
      }

      refreshHud();
    }

    function buyUpgrade(upg) {

      if (
        !isUnlocked(upg) ||
        state.fragments <
        upg.cost
      ) {
        return;
      }

      state.fragments -=
        upg.cost;

      upg.owned += 1;

      if (
        upg.type === 'tap'
      ) {

        state.perTap +=
          upg.value;

      } else {

        state.autoPerSecond +=
          upg.value;
      }

      playBuy();

      refreshHud();

      renderStore();

      checkAchievements();

      saveState();
    }

    function renderStore() {

      storeEl.innerHTML = '';

      state.upgrades.forEach(
        (upg) => {

          const unlocked =
            isUnlocked(upg);

          const row =
            document.createElement(
              'div'
            );

          row.className =
            'upg' +
            (
              unlocked
                ? ''
                : ' locked'
            );

          const left =
            document.createElement(
              'div'
            );

          left.className =
            'upg-info';

          const bonus =
            upg.type === 'auto'
              ? '+' +
                formatNumber(
                  upg.value
                ) +
                ' fragments/s'
              : '+' +
                formatNumber(
                  upg.value
                ) +
                ' click';

          const availability =
            unlocked
              ? 'Cost: ' +
                formatNumber(
                  upg.cost
                )
              : 'Unlock: ' +
                formatNumber(
                  upg.unlockAt
                );

          left.innerHTML =
            '<div class="upg-icon">' +
            upg.icon +
            '</div>' +

            '<div class="upg-details">' +

            '<div class="upg-name">' +
            upg.name +
            '</div>' +

            '<div class="upg-cost">' +
            bonus +
            ' • ' +
            availability +
            ' • Owned: ' +
            upg.owned +
            '</div>' +

            '</div>';

          const btn =
            document.createElement(
              'button'
            );

          btn.className =
            'upg-btn';

          btn.textContent =
            unlocked
              ? 'Buy'
              : 'Locked';

          btn.disabled =
            !unlocked ||
            state.fragments <
            upg.cost;

          btn.addEventListener(
            'click',
            () =>
              buyUpgrade(upg)
          );

          row.appendChild(left);
          row.appendChild(btn);

          storeEl.appendChild(row);
        }
      );
    }

    function renderAchievements() {

      achievementsEl.innerHTML =
        '';

      state.achievementDefs.forEach(
        (ach) => {

          const claimed =
            !!state.achievements[
              ach.id
            ];

          const ready =
            !!state.readyAchievements[
              ach.id
            ];

          const row =
            document.createElement(
              'div'
            );

          row.className =
            'achievement' +
            (
              claimed || ready
                ? ''
                : ' locked'
            );

          const text =
            document.createElement(
              'div'
            );

          text.innerHTML =
            '<div class="title">' +
            ach.name +
            '</div>' +

            '<div class="reward">' +
            ach.description +
            ' • +' +
            formatNumber(
              ach.reward
            ) +
            '</div>';

          let badge;

          if (claimed) {

            badge =
              document.createElement(
                'div'
              );

            badge.className =
              'badge';

            badge.textContent =
              '✅';

          } else if (ready) {

            badge =
              document.createElement(
                'button'
              );

            badge.className =
              'upg-btn';

            badge.textContent =
              'Claim';

            badge.addEventListener(
              'click',
              () =>
                claimAchievement(
                  ach.id
                )
            );

          } else {

            badge =
              document.createElement(
                'div'
              );

            badge.className =
              'badge';

            badge.textContent =
              '🔒';
          }

          row.appendChild(text);
          row.appendChild(badge);

          achievementsEl.appendChild(
            row
          );
        }
      );
    }

    function makeBurst() {

      const burst =
        document.createElement(
          'div'
        );

      const amount =
        state.feverActive
          ? state.perTap * 3
          : state.perTap;

      burst.className =
        'burst';

      burst.textContent =
        '+' +
        formatNumber(
          amount
        );

      burst.style.left =
        '50%';

      burst.style.top =
        '50%';

      pigEl.appendChild(
        burst
      );

      setTimeout(
        () =>
          burst.remove(),
        600
      );
    }

    pigEl.addEventListener(
      'pointerdown',
      (event) => {

        event.preventDefault();

        ensureAudio();

        const gain =
          state.perTap *
          getMultiplier();

        addFragments(gain);

        addFever(10);

        playSpaceClick();

        makeBurst();
      }
    );

    homeBtn.addEventListener(
      'click',
      () => {

        if (
          window.parent !==
          window
        ) {

          window.parent.postMessage(
            {
              type:
                'DougHub-home'
            },
            '*'
          );

          window.parent.postMessage(
            {
              type:
                'pig-clicker-home'
            },
            '*'
          );

        } else {

          window.location.href =
            '../index.html';
        }
      }
    );

    farmBtn.addEventListener(
      'click',
      () => {

        window.location.href =
          'pig-clicker.html';
      }
    );

    window.addEventListener(
      'message',
      (event) => {

        if (
          event.data?.type ===
          'pig-clicker-space-reset'
        ) {

          state =
            JSON.parse(
              JSON.stringify(
                defaultState
              )
            );

          saveState();

          renderStore();
          renderAchievements();
          refreshHud();
        }
      }
    );

    function gameLoop(ts) {

      if (!gameLoop.last) {
        gameLoop.last = ts;
      }

      const dt =
        Math.min(
          0.1,
          (ts - gameLoop.last) /
          1000
        );

      gameLoop.last = ts;

      state.playTimeSeconds +=
        dt;

      if (
        ts - lastSave >= 5000
      ) {

        lastSave = ts;

        saveState();
      }

      if (
        state.autoPerSecond > 0
      ) {

        const autoGain =
          state.autoPerSecond *
          (
            state.feverActive
              ? 3
              : 1
          ) *
          dt;

        addFragments(
          autoGain
        );
      }

      updateFever(dt);

      requestAnimationFrame(
        gameLoop
      );
    }

    window.addEventListener(
      'pointerdown',
      ensureAudio,
      { once: true }
    );

    loadState();

    renderStore();
    renderAchievements();
    refreshHud();

    requestAnimationFrame(
      gameLoop
    );
