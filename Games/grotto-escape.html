<div class="ov" id="title"><canvas id="duck" width="16" height="16"></canvas><h1>GROTTO ESCAPE</h1><p>Collect the gems, stomp the slimes and find the glowing portal to escape each cave.</p><p>ARROWS / A D = MOVE · SPACE / W = JUMP</p><button id="go" type="button">PLAY</button><p id="best"></p></div>

<script>
(function(){

var LEVELS=[L1,L2,L3,L4,L5,L6];
/* ---------- game state ---------- */
var S,lvl,cam=0,keys={},tickT=0,running=false;

function solid(c,r){if(r<0)return false;if(r>=ROWS||c<0)return c<0;var x=lvl.m[r][c];return x==="#"}
function loadLevel(n,keep){

function spark(x,y,col,n){for(var i=0;i<n;i++)S.parts.push({x:x,y:y,vx:(Math.random()-.5)*90,vy:-Math.random()*90,a:.5+Math.random()*.4,c:col})}

  try{parent.postMessage({dh:"score",game:"grotto-escape",score:sc},"*")}catch(e){};$("oT").textContent=win?"YOU ESCAPED!":"GAME OVER";$("oM").textContent="SCORE "+sc+" · BEST "+best;$("over").hidden=false;$("best").textContent=best?"BEST "+best:""}
/* ---------- update ---------- */
var JUMP=-318,GRAV=900,RUN=96,PW=10,PH=14;
function moveX(p,dx){p.x+=dx;var l=Math.floor((p.x+3)/T),r=Math.floor((p.x+3+PW-.01)/T),t=Math.floor(p.y/T),b=Math.floor((p.y+PH-.01)/T+.0001);

function update(dt){var p=S.p;S.t+=dt;

/* ---------- draw ---------- */
function draw(){
