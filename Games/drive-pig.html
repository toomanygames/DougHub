<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Drive Pig</title>
<style>
:root{--ink:#18213a;--pink:#ef5b7a;--yellow:#ffd84a;--cream:#fff8e8}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:#8edcf4;color:var(--ink)}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
.overlay{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:rgba(13,26,48,.42);backdrop-filter:blur(5px)}
.hidden{display:none!important}
.card{width:min(760px,94vw);max-height:92vh;overflow:auto;background:var(--cream);border:4px solid var(--ink);box-shadow:10px 10px 0 var(--ink);border-radius:18px;padding:24px;text-align:center}
.logo{font-size:clamp(52px,10vw,92px);font-weight:1000;letter-spacing:-5px;line-height:.85;color:var(--pink);text-shadow:4px 4px 0 var(--ink);margin:4px 0 12px}
.subtitle{font-weight:800;font-size:16px;margin-bottom:20px}
.selector{display:grid;grid-template-columns:64px 1fr 64px;gap:12px;align-items:stretch}
button{border:3px solid var(--ink);background:#fff;padding:12px 16px;border-radius:11px;box-shadow:4px 4px 0 var(--ink);font:900 16px Arial;color:var(--ink);cursor:pointer;touch-action:manipulation;transition:transform .08s,box-shadow .08s,background .08s}
button:hover{background:var(--yellow)}
button:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.arrow{font-size:38px;padding:0}
.levelcard{border:3px solid var(--ink);border-radius:12px;background:#d9f4cf;padding:13px}
.levelnum{font-size:56px;font-weight:1000;line-height:.9}
.world{font-size:13px;font-weight:1000;margin:5px 0}
.desc{font-weight:800;min-height:20px}
.difficulty{margin:9px auto 2px;max-width:310px;height:10px;background:#fff;border:2px solid var(--ink);border-radius:20px;overflow:hidden}
.difficulty i{display:block;height:100%;background:var(--pink);width:10%}
.meta{font-size:12px;font-weight:800;opacity:.72;margin-top:7px}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.primary{background:var(--yellow);font-size:18px}
.secondary{background:#d9f4cf}
.help{font-size:12px;font-weight:800;opacity:.65;margin-top:17px}
.levelgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:7px;margin-top:15px}
.levelgrid button{padding:8px 2px;font-size:12px;box-shadow:2px 2px 0 var(--ink)}
.levelgrid button.locked{opacity:.38;cursor:not-allowed}
.levelgrid button.current{background:var(--yellow)}
.hud{position:fixed;z-index:5;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}
.badge{background:rgba(255,248,232,.92);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);border-radius:10px;padding:8px 11px;font-weight:1000}
.progress{position:fixed;z-index:5;left:50%;top:13px;transform:translateX(-50%);width:min(320px,38vw);height:15px;background:#fff;border:3px solid var(--ink);border-radius:20px;overflow:hidden;pointer-events:none}
.progress i{display:block;height:100%;width:0;background:var(--pink)}
.touch{display:none;position:fixed;z-index:7;left:12px;right:12px;bottom:12px;justify-content:space-between;pointer-events:none}
.touch .group{display:flex;gap:9px;pointer-events:auto}
.touch button{width:68px;height:68px;font-size:25px;border-radius:15px;background:rgba(255,248,232,.92)}
@media(max-width:700px){.touch{display:flex}.card{padding:18px}.selector{grid-template-columns:54px 1fr 54px}.levelnum{font-size:46px}.levelgrid{grid-template-columns:repeat(6,1fr)}.progress{top:auto;bottom:94px;width:45vw}.help{font-size:11px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud"><div class="badge" id="hudLeft">DRIVE PIG</div><div class="badge" id="hudTime">TIME 0.00</div></div>
<div class="progress"><i id="progressBar"></i></div>

<div class="overlay" id="menuOverlay">
  <div class="card">
    <div class="logo">DRIVE PIG</div>
    <div class="subtitle">A tiny pig. A tiny car. 60 increasingly ridiculous levels.</div>
    <div class="selector">
      <button class="arrow" id="prevBtn">‹</button>
      <div class="levelcard">
        <div class="levelnum" id="levelNum">01</div>
        <div class="world" id="worldName"></div>
        <div class="desc" id="levelDesc"></div>
        <div class="difficulty"><i id="difficultyBar"></i></div>
        <div class="meta">BEST: <span id="bestTime">—</span></div>
      </div>
      <button class="arrow" id="nextBtn">›</button>
    </div>
    <div class="row"><button class="primary" id="playBtn">▶ PLAY LEVEL</button><button class="secondary" id="allLevelsBtn">LEVEL SELECT</button></div>
    <div class="row"><button id="resetBtn">RESET PROGRESS</button></div>
    <div class="help">D / → drive &nbsp; A / ← brake &nbsp; SPACE / ▲ jump &nbsp; R restart</div>
  </div>
</div>

<div class="overlay hidden" id="levelsOverlay">
  <div class="card">
    <h2>LEVEL SELECT</h2>
    <div class="meta">Complete a level to unlock the next one.</div>
    <div class="levelgrid" id="levelGrid"></div>
    <div class="row"><button class="primary" id="backBtn">BACK</button></div>
  </div>
</div>

<div class="overlay hidden" id="finishOverlay">
  <div class="card">
    <h2 id="finishTitle">LEVEL CLEARED!</h2>
    <p id="finishText"></p>
    <div class="row">
      <button id="retryBtn">↻ RETRY</button>
      <button class="primary" id="nextBtnFinish">NEXT LEVEL ▶</button>
      <button id="menuBtn">LEVEL SELECT</button>
    </div>
  </div>
</div>

<div class="touch">
  <div class="group"><button data-key="left">◀</button><button data-key="jump">▲</button></div>
  <div class="group"><button data-key="right">▶</button></div>
</div>

<script>
"use strict";
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
const menuOverlay=document.getElementById("menuOverlay"),levelsOverlay=document.getElementById("levelsOverlay"),finishOverlay=document.getElementById("finishOverlay");
const levelNum=document.getElementById("levelNum"),worldName=document.getElementById("worldName"),levelDesc=document.getElementById("levelDesc"),bestTime=document.getElementById("bestTime"),difficultyBar=document.getElementById("difficultyBar"),levelGrid=document.getElementById("levelGrid");
const hudLeft=document.getElementById("hudLeft"),hudTime=document.getElementById("hudTime"),progressBar=document.getElementById("progressBar");
const LEVELS=60, SAVE="drivepig-2d-v4", BEST="drivepig-2d-best-v4-";
let W=innerWidth,H=innerHeight,DPR=1,selected=1,unlocked=Math.max(1,Math.min(LEVELS,Number(localStorage.getItem(SAVE))||1));
let playing=false,won=false,dead=false,last=0,startTime=0,keys=new Set(),jumpQueued=false;
let platforms=[],hazards=[],finishX=0,levelWidth=1200,theme=null;
const pig={x:90,y:0,vx:0,vy:0,angle:0,ground:false};

const themes=[
 {name:"SUNNY START",sky:"#8edcf4",ground:"#5cc96b",accent:"#ffd84a"},
 {name:"PINK PEAKS",sky:"#8fd8f1",ground:"#df7894",accent:"#ffe05a"},
 {name:"CLOUD COUNTRY",sky:"#b9e7fa",ground:"#6eaae8",accent:"#fff0a8"},
 {name:"PIG FACTORY",sky:"#a9d8dd",ground:"#ad806e",accent:"#ffcb55"},
 {name:"MOUNTAIN RUN",sky:"#93c7e8",ground:"#708bb6",accent:"#ffe18a"},
 {name:"NEON FINALE",sky:"#9a83e2",ground:"#7651b8",accent:"#73f0d0"}
];
const descs=[
"Warm-up","Small hop","First gap","Bumpy road","Two gaps","Hill hop","Spike lesson","Tiny staircase","Bridge gap","First challenge",
"Double gap","Sky bridge","Spike bridge","Ramp combo","Narrow road","Factory entry","Block dodge","Crusher lane","Moving danger","Factory finale",
"Mountain road","Steep climb","Sharp descent","Peak jump","Mountain finale","Neon hills","Speed tunnel","Floating blocks","Air control","Big staircase",
"Broken road","Twin ramps","Narrow escape","Giant gap","Hammer time","Drop zone","Wobble road","Mega jump","Last stand","Nightmare road",
"Pig panic","Double danger","Sky factory","Long launch","Triple gap","Floating road","Crazy downhill","Razor road","Final climb","Finale warm-up",
"Super jump","Pink chaos","Mountain maze","Speed peak","Factory storm","Neon gauntlet","Ultimate bridge","Mega finale","PIG GRAND PRIX","THE LAST PIG RIDE"
];

function resize(){
 W=innerWidth;H=innerHeight;DPR=Math.min(2,devicePixelRatio||1);
 canvas.width=Math.floor(W*DPR);canvas.height=Math.floor(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener("resize",resize);resize();

function rand(seed){return function(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;};}

function addPlatform(x,y,w){platforms.push({x,y,w,h:28});}
function addSpike(x,y){hazards.push({type:"spike",x,y});}
function addBox(x,y){hazards.push({type:"box",x,y});}
function addSaw(x,y,r=22){hazards.push({type:"saw",x,y,r,phase:(x*7)%6.28});}
function addGap(x,w){return x+w;}

function buildLevel(n){
 const r=rand(1000+n*9187);
 platforms=[];hazards=[];
 theme=themes[Math.floor((n-1)/10)];
 levelWidth=1200;
 let y=410;
 addPlatform(30,y,145);
 let x=175;
 const difficulty=(n-1)/59;
 const sections=5;
 const sectionW=190;
 for(let s=0;s<sections;s++){
   const gap=Math.min(18+Math.floor(difficulty*62),78);
   x+=gap;
   let width=Math.max(95,sectionW-gap);
   let dy=0;
   if(n>=6)dy=(r()>.5?1:-1)*Math.min(45,8+n*.65);
   if(n>=16&&s%2===0)dy=35;
   if(n>=31)dy=(r()-.5)*90;
   y=Math.max(245,Math.min(450,y+dy));
   addPlatform(x,y,width);
   const center=x+width*.55;
   if(n>=7+s*2)addSpike(center,y);
   if(n>=17+s*2&&r()>.3)addBox(x+width*.72,y);
   if(n>=27+s*2&&r()>.35)addSaw(x+width*.42,y-35,20+Math.min(13,n/6));
   if(n>=41&&s%2===1)addSpike(x+width*.78,y);
   x+=width;
 }
 addPlatform(x+22,y,145);
 finishX=x+130;
 levelWidth=finishX+30;
 if(n>=11){addSpike(250,410);}
 if(n>=21){addSaw(520,platformYNear(520)-42,22);}
 if(n>=31){addBox(760,platformYNear(760));}
 if(n>=41){addSaw(920,platformYNear(920)-42,28);}
 if(n>=51){addSpike(1010,platformYNear(1010));}
 if(n>=56){addSaw(1080,platformYNear(1080)-42,31);}
 if(n>=59){
   addSpike(330,platformYNear(330));addSpike(350,platformYNear(350));
   addSaw(690,platformYNear(690)-45,32);addBox(850,platformYNear(850));
   addSpike(960,platformYNear(960));addSaw(1040,platformYNear(1040)-44,34);
 }
}

function platformYNear(px){
 for(const p of platforms)if(px>=p.x-5&&px<=p.x+p.w+5)return p.y;
 return 410;
}
function surfaceAt(px){
 for(let i=platforms.length-1;i>=0;i--){const p=platforms[i];if(px>=p.x+5&&px<=p.x+p.w-5)return p.y;}
 return null;
}
function resetPig(){
 pig.x=85;pig.y=surfaceAt(pig.x)-45;pig.vx=0;pig.vy=0;pig.angle=0;pig.ground=true;
}
function selectLevel(n){
 selected=Math.max(1,Math.min(unlocked,n));
 updateMenu();
}
function updateMenu(){
 const t=themes[Math.floor((selected-1)/10)];
 levelNum.textContent=String(selected).padStart(2,"0");
 worldName.textContent=t.name+" • "+(((selected-1)%10)+1)+"/10";
 levelDesc.textContent=descs[selected-1];
 difficultyBar.style.width=(8+selected/60*92)+"%";
 bestTime.textContent=localStorage.getItem(BEST+selected)||"—";
}
function buildGrid(){
 levelGrid.innerHTML="";
 for(let i=1;i<=LEVELS;i++){
  const b=document.createElement("button");
  b.textContent=String(i).padStart(2,"0");
  b.className=i===selected?"current":"";
  if(i>unlocked){b.classList.add("locked");b.textContent="🔒";}
  b.disabled=i>unlocked;
  b.onclick=()=>{selected=i;levelsOverlay.classList.add("hidden");menuOverlay.classList.remove("hidden");updateMenu();};
  levelGrid.appendChild(b);
 }
}
function start(){
 buildLevel(selected);resetPig();playing=true;won=false;dead=false;
 startTime=performance.now();last=startTime;
 menuOverlay.classList.add("hidden");levelsOverlay.classList.add("hidden");finishOverlay.classList.add("hidden");
 hudLeft.textContent="LEVEL "+String(selected).padStart(2,"0")+" • "+theme.name;
 progressBar.style.width="0%";hudTime.textContent="TIME 0.00";
}
function crash(){
 if(dead||won)return;
 dead=true;playing=false;
 setTimeout(()=>{
  document.getElementById("finishTitle").textContent="PIG DOWN!";
  document.getElementById("finishText").textContent="That one was rough. The level stays unlocked so you can try again.";
  document.getElementById("nextBtnFinish").classList.add("hidden");
  finishOverlay.classList.remove("hidden");
 },220);
}
function win(){
 if(won)return;won=true;playing=false;
 const time=(performance.now()-startTime)/1000,old=Number(localStorage.getItem(BEST+selected)||999999);
 if(time<old)localStorage.setItem(BEST+selected,time.toFixed(2));
 if(selected===unlocked&&unlocked<LEVELS){unlocked++;localStorage.setItem(SAVE,String(unlocked));}
 document.getElementById("finishTitle").textContent=selected===LEVELS?"🐷 YOU BEAT THE PIG GRAND PRIX!":"LEVEL "+selected+" CLEARED!";
 document.getElementById("finishText").textContent="Time: "+time.toFixed(2)+"s"+(selected<LEVELS?" • Level "+(selected+1)+" unlocked!":" • You survived all 60 levels!");
 document.getElementById("nextBtnFinish").classList.toggle("hidden",selected>=LEVELS);
 finishOverlay.classList.remove("hidden");updateMenu();
}
function update(dt){
 if(!playing)return;
 const right=keys.has("ArrowRight")||keys.has("KeyD"),left=keys.has("ArrowLeft")||keys.has("KeyA");
 if(right)pig.vx+=760*dt;
 if(left)pig.vx-=600*dt;
 pig.vx*=Math.pow(.985,dt*60);
 pig.vx=Math.max(-180,Math.min(470,pig.vx));
 if(jumpQueued&&pig.ground){pig.vy=-650;pig.ground=false;}
 jumpQueued=false;
 pig.vy+=1500*dt;pig.x+=pig.vx*dt;pig.y+=pig.vy*dt;
 const s=surfaceAt(pig.x);
 if(s!==null&&pig.y>=s-45&&pig.vy>=0){
   pig.y=s-45;pig.vy=0;pig.ground=true;
   const a=Math.atan2((surfaceAt(pig.x+18)??s)-(surfaceAt(pig.x-18)??s),36);
   pig.angle+=(a-pig.angle)*Math.min(1,dt*9);
 }else pig.ground=false;
 if(pig.y>560)crash();
 for(const h of hazards){
  if(h.type==="spike"&&Math.abs(pig.x-h.x)<24&&Math.abs((pig.y+38)-h.y)<42)crash();
  if(h.type==="box"&&Math.abs(pig.x-h.x)<38&&Math.abs((pig.y+20)-(h.y-25))<43)crash();
  if(h.type==="saw"&&Math.hypot(pig.x-h.x,pig.y+20-(h.y))<h.r+27)crash();
 }
 if(pig.x>finishX)win();
 hudTime.textContent="TIME "+((performance.now()-startTime)/1000).toFixed(2);
 progressBar.style.width=Math.min(100,Math.max(0,(pig.x/finishX)*100))+"%";
}
function worldBounds(){
 let minY=Infinity,maxY=-Infinity;
 for(const p of platforms){
  minY=Math.min(minY,p.y-5);
  maxY=Math.max(maxY,p.y+p.h);
 }
 for(const h of hazards){
  if(h.type==="spike"){minY=Math.min(minY,h.y-48);maxY=Math.max(maxY,h.y);}
  else if(h.type==="box"){minY=Math.min(minY,h.y-62);maxY=Math.max(maxY,h.y);}
  else {minY=Math.min(minY,h.y-h.r);maxY=Math.max(maxY,h.y+h.r);}
 }
 const fy=surfaceAt(finishX)??410;
 minY=Math.min(minY,fy-145);
 maxY=Math.max(maxY,fy+28);
 return {minY,maxY};
}
function fit(){
 const usableW=Math.max(300,W-60);
 const usableH=Math.max(260,H-150);
 const b=worldBounds();
 const worldHeight=Math.max(220,b.maxY-b.minY+70);
 return Math.min(usableW/levelWidth,usableH/worldHeight);
}
function drawBackground(){
 ctx.fillStyle=theme.sky;ctx.fillRect(0,0,W,H);
 const s=fit(),groundY=H*.62;
 ctx.save();ctx.globalAlpha=.22;
 for(let i=0;i<7;i++){ctx.fillStyle=i%2?"#fff":"#ffd84a";ctx.beginPath();ctx.arc((i*220-(performance.now()/45)%220),90+(i%3)*55,32+(i%2)*15,0,Math.PI*2);ctx.fill();}
 ctx.restore();
}
function draw(){
 if(!theme)return;drawBackground();
 const s=fit(),b=worldBounds(),ox=(W-levelWidth*s)/2,topMargin=Math.max(88,(H-b.maxY*s+b.minY*s)/2),base=H/2-(b.minY+b.maxY)*s/2;
 ctx.save();ctx.translate(ox,base);ctx.scale(s,s);
 for(const p of platforms){
  ctx.fillStyle=theme.ground;ctx.fillRect(p.x,p.y,p.w,p.h);
  ctx.fillStyle="rgba(255,255,255,.25)";ctx.fillRect(p.x,p.y,p.w,7);
  ctx.fillStyle="rgba(24,33,58,.12)";ctx.fillRect(p.x,p.y+p.h-5,p.w,5);
 }
 for(const h of hazards){
  if(h.type==="spike"){
   ctx.fillStyle="#fff0d2";ctx.strokeStyle="#18213a";ctx.lineWidth=4;
   ctx.beginPath();ctx.moveTo(h.x-22,h.y);ctx.lineTo(h.x,h.y-48);ctx.lineTo(h.x+22,h.y);ctx.closePath();ctx.fill();ctx.stroke();
  }else if(h.type==="box"){
   ctx.fillStyle="#e66a65";ctx.fillRect(h.x-30,h.y-62,60,62);
   ctx.strokeStyle="#18213a";ctx.lineWidth=4;ctx.strokeRect(h.x-30,h.y-62,60,62);
   ctx.strokeStyle="#ffb36b";ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(h.x-22,h.y-54);ctx.lineTo(h.x+22,h.y-8);ctx.moveTo(h.x+22,h.y-54);ctx.lineTo(h.x-22,h.y-8);ctx.stroke();
  }else{
   ctx.save();ctx.translate(h.x,h.y);ctx.rotate(performance.now()/450+h.phase);
   ctx.fillStyle="#ef5b7a";ctx.strokeStyle="#18213a";ctx.lineWidth=4;
   ctx.beginPath();for(let i=0;i<16;i++){const a=i*Math.PI/8,rr=i%2?h.r*.72:h.r;ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);}ctx.closePath();ctx.fill();ctx.stroke();
   ctx.fillStyle="#ffd84a";ctx.beginPath();ctx.arc(0,0,h.r*.3,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.restore();
  }
 }
 const fy=surfaceAt(finishX)??410;
 ctx.strokeStyle="#18213a";ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(finishX,fy);ctx.lineTo(finishX,fy-145);ctx.stroke();
 ctx.fillStyle="#fff";ctx.fillRect(finishX+5,fy-140,75,45);ctx.fillStyle="#ef5b7a";ctx.fillRect(finishX+5,fy-140,75,22);
 drawPig();
 ctx.restore();
}
function drawPig(){
 ctx.save();ctx.translate(pig.x,pig.y);ctx.rotate(pig.angle);
 ctx.fillStyle="#ffd84a";ctx.strokeStyle="#18213a";ctx.lineWidth=4;
 ctx.beginPath();ctx.roundRect(-43,-27,86,39,9);ctx.fill();ctx.stroke();
 ctx.fillStyle="#fff2d6";ctx.beginPath();ctx.roundRect(-8,-52,51,31,10);ctx.fill();ctx.stroke();
 ctx.fillStyle="#f29bb0";ctx.beginPath();ctx.arc(43,-13,17,0,Math.PI*2);ctx.fill();ctx.stroke();
 ctx.fillStyle="#18213a";ctx.beginPath();ctx.arc(48,-18,3,0,Math.PI*2);ctx.arc(48,-8,3,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#f29bb0";ctx.beginPath();ctx.arc(-25,-51,10,0,Math.PI*2);ctx.arc(9,-51,10,0,Math.PI*2);ctx.fill();ctx.stroke();
 ctx.fillStyle="#252b3a";for(const q of[-27,27]){ctx.beginPath();ctx.arc(q,15,14,0,Math.PI*2);ctx.fill();}
 ctx.restore();
}
function loop(t){
 const dt=Math.min(.032,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop);
}

document.getElementById("prevBtn").onclick=()=>selectLevel(selected-1);
document.getElementById("nextBtn").onclick=()=>selectLevel(selected+1);
document.getElementById("playBtn").onclick=start;
document.getElementById("allLevelsBtn").onclick=()=>{buildGrid();menuOverlay.classList.add("hidden");levelsOverlay.classList.remove("hidden");};
document.getElementById("backBtn").onclick=()=>{levelsOverlay.classList.add("hidden");menuOverlay.classList.remove("hidden");updateMenu();};
document.getElementById("retryBtn").onclick=start;
document.getElementById("menuBtn").onclick=()=>{finishOverlay.classList.add("hidden");menuOverlay.classList.remove("hidden");updateMenu();};
document.getElementById("nextBtnFinish").onclick=()=>{selected=Math.min(LEVELS,selected+1);start();};
document.getElementById("resetBtn").onclick=()=>{unlocked=1;localStorage.setItem(SAVE,"1");selected=1;buildGrid();updateMenu();};

addEventListener("keydown",e=>{
 if(e.code==="Space"&&!e.repeat)jumpQueued=true;
 if(e.code==="KeyR"&&playing)start();
 keys.add(e.code);
 if(["ArrowLeft","ArrowRight","ArrowUp","Space"].includes(e.code))e.preventDefault();
});
addEventListener("keyup",e=>keys.delete(e.code));
document.querySelectorAll("[data-key]").forEach(btn=>{
 const k=btn.dataset.key;
 const down=e=>{e.preventDefault();if(k==="jump")jumpQueued=true;else keys.add(k==="left"?"ArrowLeft":"ArrowRight");};
 const up=e=>{e.preventDefault();if(k!=="jump")keys.delete(k==="left"?"ArrowLeft":"ArrowRight");};
 btn.addEventListener("pointerdown",down);btn.addEventListener("pointerup",up);btn.addEventListener("pointercancel",up);btn.addEventListener("pointerleave",up);
});

buildLevel(1);resetPig();updateMenu();requestAnimationFrame(loop);
</script>
</body>
</html>
