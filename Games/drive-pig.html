<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Drive Pig</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#62cfee;color:#17213a}canvas{position:fixed;inset:0;width:100%;height:100%}
#menu,#finish{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:#18304a44}.card{background:#fff7e9;border:4px solid #17213a;box-shadow:9px 9px #17213a;width:min(720px,92vw);padding:24px;text-align:center}.card h1{font-size:clamp(48px,9vw,82px);margin:0;color:#c74869;line-height:.9}.card h2{font-size:40px;margin:0;color:#c74869}.sub{font-weight:800;margin:15px}.sel{display:grid;grid-template-columns:70px 1fr 70px;gap:12px;align-items:center}.levelbox{background:#d8f1c8;border:4px solid #17213a;box-shadow:5px 5px #17213a;padding:14px}.level{font-size:60px;font-weight:900}.desc{min-height:38px;font-weight:700}.row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:17px}button{font:900 16px Arial;border:3px solid #17213a;background:white;padding:11px 16px;box-shadow:4px 4px #17213a;cursor:pointer;touch-action:manipulation}button:hover{background:#ffd52e}.primary{background:#ffd52e;font-size:19px}.arrow{font-size:38px;min-height:80px}.muted{font-size:12px;opacity:.7;margin-top:12px}#finish{display:none}.hud{position:fixed;z-index:4;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}.badge{background:#fff7e9dd;border:3px solid #17213a;box-shadow:4px 4px #17213a;padding:8px 12px;font-weight:900}.touch{display:none;position:fixed;z-index:6;bottom:14px;left:14px;right:14px;justify-content:space-between}.touch div{display:flex;gap:8px}.touch button{width:65px;height:65px;font-size:24px;border-radius:14px}@media(max-width:700px){.touch{display:flex}.card{padding:17px}.sel{grid-template-columns:55px 1fr 55px}.arrow{min-height:65px;font-size:30px}.level{font-size:48px}}
</style></head><body>
<canvas id="c"></canvas><div class="hud"><div class="badge" id="hud">DRIVE PIG</div><div class="badge" id="time">TIME 0.00</div></div>
<div id="menu"><div class="card"><h1>DRIVE PIG</h1><div class="sub">Drive the pig car through 60 levels and reach the flag!</div><div class="sel"><button class="arrow" id="prev">‹</button><div class="levelbox"><div class="level" id="num">01</div><b id="world"></b><div class="desc" id="desc"></div>BEST: <b id="best">—</b></div><button class="arrow" id="next">›</button></div><div class="row"><button id="jump">JUMP 10 LEVELS</button><button id="reset">RESET PROGRESS</button></div><div class="row"><button class="primary" id="play">PLAY LEVEL</button></div><div class="muted">D / → drive • A / ← brake • SPACE jump • R restart</div></div></div>
<div id="finish"><div class="card"><h2 id="ft">LEVEL CLEARED!</h2><p id="fx"></p><div class="row"><button id="retry">RETRY</button><button class="primary" id="nextlevel">NEXT LEVEL</button><button id="levels">LEVEL SELECT</button></div></div></div>
<div class="touch"><div><button data-k="left">◀</button><button data-k="jump">▲</button></div><div><button data-k="right">▶</button></div></div>
<script>
"use strict";
const C=document.getElementById("c"),X=C.getContext("2d"),LEVELS=60,STORE="drivepig-unlocked-v3",BEST="drivepig-best-v3-";let W=innerWidth,H=innerHeight,level=1,unlocked=Math.max(1,Math.min(LEVELS,+localStorage.getItem(STORE)||1)),playing=false,dead=false,won=false,last=0,startTime=0,jump=false,keys=new Set(),plats=[],haz=[],finish=0,worldW=0;
const worlds=[["GREEN HILLS","#55c96b","#62cfee"],["PINK BRIDGES","#d26c8a","#6ccce8"],["SKY JUMPS","#65a9ef","#73d4f2"],["PIG FACTORY","#a98273","#9bd0dc"],["MOUNTAIN","#6c8db9","#86cde2"],["NEON FARM","#8d70df","#72d0e5"]];
const names=["Easy rolling start","Tiny ramp warm-up","First real gap","Bumpy bridge","Short hill climb","Double bump","Low bridge","Little launcher","Pink platform","First big jump","Cloud hop","Long sky bridge","Falling platform","Triple ramp","Skyline gap","Factory floor","Crusher alley","Conveyor chaos","Moving block","Factory finale","Mountain road","Steep climb","Sharp descent","Peak-to-peak","Mountain finale","Neon hills","Speed tunnel","Floating blocks","Flip challenge","Big staircase","Broken road","Twin ramps","Narrow bridge","Giant gap","Hammer road","Drop zone","Wobble bridge","Mega jump","Last stand","Nightmare bridge","Pig panic","Double crusher","Sky factory","Long launch","Triple gap","Floating road","Crazy downhill","Loop-ish ramps","Final climb","Finale warmup","Super jump","Pink chaos","Mountain maze","Speed peak","Factory storm","Neon gauntlet","Ultimate bridge","Mega finale","THE PIG GRAND PRIX","THE LAST PIG RIDE"];
const pig={x:80,y:0,vx:0,vy:0,ground:false,a:0};
const menuEl=document.getElementById("menu"),finishEl=document.getElementById("finish"),prevBtn=document.getElementById("prev"),nextBtn=document.getElementById("next"),playBtn=document.getElementById("play"),retryBtn=document.getElementById("retry"),levelsBtn=document.getElementById("levels"),nextLevelBtn=document.getElementById("nextlevel"),resetBtn=document.getElementById("reset"),jumpBtn=document.getElementById("jump");
function resize(){W=innerWidth;H=innerHeight;C.width=W*devicePixelRatio;C.height=H*devicePixelRatio;X.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener("resize",resize);resize();
function rng(s){return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function ground(x){for(const p of plats)if(x>=p.x&&x<=p.x+p.w)return p.y;return null}
function make(n){const r=rng(9001+n*7919);plats=[];haz=[];let x=0,y=0;plats.push({x:0,y:0,w:500});x=500;for(let i=0;i<14+Math.floor(n*.4);i++){if(n>3&&r()<Math.min(.4,n/180))x+=45+r()*80;let w=110+r()*190;let dy=(r()-.5)*(n>15?130:70);if(i%7===0)dy=40+r()*55;if(i%7===1)dy=-40-r()*50;y=Math.max(-30,Math.min(210,y+dy));plats.push({x,y,w});if(n>7&&r()<.18)haz.push({t:"spike",x:x+w*.5,y});if(n>15&&r()<.14)haz.push({t:"block",x:x+w*.7,y});if(n>25&&r()<.12)haz.push({t:"spin",x:x+w*.5,y:y-25,a:r()*7});x+=w}plats.push({x:x+30,y,w:430});finish=x+330;worldW=finish+500}
function select(n){level=Math.max(1,Math.min(unlocked,n));updateMenu()}
function updateMenu(){let w=worlds[Math.floor((level-1)/10)];document.getElementById("num").textContent=String(level).padStart(2,"0");document.getElementById("world").textContent=w[0]+" • "+((level-1)%10+1)+"/10";document.getElementById("desc").textContent=names[level-1];document.getElementById("best").textContent=localStorage.getItem(BEST+level)||"—"}
function reset(){pig.x=80;pig.y=(ground(80)||0)-42;pig.vx=0;pig.vy=0;pig.ground=true;pig.a=0}
function start(){make(level);reset();playing=true;dead=false;won=false;startTime=performance.now();last=startTime;menuEl.style.display="none";finishEl.style.display="none";document.getElementById("hud").textContent="LEVEL "+String(level).padStart(2,"0")+" • "+worlds[Math.floor((level-1)/10)][0]}
function crash(){if(dead||won)return;dead=true;playing=false;setTimeout(()=>{document.getElementById("ft").textContent="PIG DOWN!";document.getElementById("fx").textContent="The pig crashed. Try again!";document.getElementById("nextlevel").style.display="none";document.getElementById("finish").style.display="grid"},250)}
function win(){if(won)return;won=true;playing=false;let t=(performance.now()-startTime)/1000,old=+(localStorage.getItem(BEST+level)||999999);if(t<old)localStorage.setItem(BEST+level,t.toFixed(2)+"s");if(level===unlocked&&unlocked<LEVELS){unlocked++;localStorage.setItem(STORE,unlocked)}document.getElementById("ft").textContent="LEVEL CLEARED!";document.getElementById("fx").textContent=level<LEVELS?"Next level unlocked! Time: "+t.toFixed(2)+" seconds":"YOU BEAT ALL 60 LEVELS!";document.getElementById("nextlevel").style.display=level<LEVELS?"inline-block":"none";finishEl.style.display="grid";updateMenu()}
function update(dt){if(!playing)return;let r=keys.has("ArrowRight")||keys.has("KeyD"),l=keys.has("ArrowLeft")||keys.has("KeyA");if(r)pig.vx+=850*dt;if(l)pig.vx-=550*dt;pig.vx*=Math.pow(.985,dt*60);pig.vx=Math.max(-220,Math.min(500,pig.vx));if(jump&&pig.ground){pig.vy=-650;pig.ground=false}jump=false;pig.vy+=1450*dt;pig.x+=pig.vx*dt;pig.y+=pig.vy*dt;let g=ground(pig.x);if(g!==null&&pig.y>=g-42&&pig.vy>=0){pig.y=g-42;pig.vy=0;pig.ground=true;let a=Math.atan2((ground(pig.x+20)??g)-(ground(pig.x-20)??g),40);pig.a+=(a-pig.a)*Math.min(1,dt*8)}else pig.ground=false;if(pig.y>H*.62+300)crash();for(const h of haz){if(h.t==="spike"&&Math.abs(pig.x-h.x)<28&&Math.abs(pig.y-h.y+25)<35)crash();if(h.t==="block"&&Math.abs(pig.x-h.x)<38&&Math.abs(pig.y-h.y+35)<45)crash();if(h.t==="spin"&&Math.abs(pig.x-h.x)<65&&Math.abs(pig.y-h.y+20)<45)crash()}if(pig.x>finish)win();document.getElementById("time").textContent="TIME "+((performance.now()-startTime)/1000).toFixed(2)}
function cam(){return Math.max(0,Math.min(worldW-W,pig.x-W*.32))}
function draw(){let w=worlds[Math.floor((level-1)/10)],camx=cam();X.clearRect(0,0,W,H);X.fillStyle=w[2];X.fillRect(0,0,W,H);X.save();X.translate(-camx,H*.62);for(const p of plats){X.fillStyle=w[1];X.fillRect(p.x,p.y,p.w,30);X.fillStyle="#ffffff44";X.fillRect(p.x,p.y,p.w,7)}for(const h of haz){if(h.t==="spike"){X.fillStyle="#fff3d4";X.beginPath();X.moveTo(h.x-20,h.y);X.lineTo(h.x,h.y-48);X.lineTo(h.x+20,h.y);X.closePath();X.fill();X.strokeStyle="#17213a";X.lineWidth=4;X.stroke()}if(h.t==="block"){X.fillStyle="#d66b65";X.fillRect(h.x-30,h.y-65,60,65)}if(h.t==="spin"){X.save();X.translate(h.x,h.y-20);X.rotate(performance.now()/450+h.a);X.fillStyle="#c44869";X.fillRect(-65,-7,130,14);X.restore()}}let fy=plats[plats.length-1].y;X.fillStyle="#17213a";X.fillRect(finish,fy-170,7,170);X.fillStyle="#fff";X.fillRect(finish+7,fy-165,80,48);X.fillStyle="#e75b78";X.fillRect(finish+7,fy-165,80,22);drawPig();X.restore()}
function drawPig(){X.save();X.translate(pig.x,pig.y);X.rotate(pig.a);X.fillStyle="#ffd52e";X.fillRect(-42,-27,84,40);X.fillStyle="#fff0cf";X.fillRect(-10,-50,48,30);X.fillStyle="#f39aad";X.beginPath();X.arc(40,-12,17,0,Math.PI*2);X.fill();X.fillStyle="#17213a";X.beginPath();X.arc(45,-17,3,0,Math.PI*2);X.arc(45,-7,3,0,Math.PI*2);X.fill();X.fillStyle="#f39aad";X.beginPath();X.arc(-25,-50,10,0,Math.PI*2);X.arc(8,-50,10,0,Math.PI*2);X.fill();X.fillStyle="#252b3a";for(const q of[-27,25]){X.beginPath();X.arc(q,16,15,0,Math.PI*2);X.fill()}X.restore()}
function loop(t){let dt=Math.min(.032,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}
prevBtn.onclick=()=>select(level-1);nextBtn.onclick=()=>select(level+1);playBtn.onclick=start;retryBtn.onclick=start;levelsBtn.onclick=()=>{finishEl.style.display="none";menuEl.style.display="grid";updateMenu()};nextLevelBtn.onclick=()=>{finishEl.style.display="none";select(level+1);start()};resetBtn.onclick=()=>{unlocked=1;localStorage.setItem(STORE,1);select(1)};jumpBtn.onclick=()=>select(Math.min(LEVELS,unlocked+10));
addEventListener("keydown",e=>{keys.add(e.code);if(e.code==="Space"&&!e.repeat)jump=true;if(e.code==="KeyR"&&playing)start();if(["ArrowLeft","ArrowRight","Space"].includes(e.code))e.preventDefault()});addEventListener("keyup",e=>keys.delete(e.code));
document.querySelectorAll("[data-k]").forEach(b=>{let k=b.dataset.k;b.onpointerdown=e=>{e.preventDefault();if(k==="jump")jump=true;else keys.add(k==="left"?"ArrowLeft":"ArrowRight")};b.onpointerup=()=>keys.delete(k==="left"?"ArrowLeft":"ArrowRight");b.onpointercancel=b.onpointerup});
make(level);reset();updateMenu();requestAnimationFrame(loop);
</script></body></html>
