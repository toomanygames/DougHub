*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:radial-gradient(circle at 8% 0%,#17133b 0,transparent 34%),radial-gradient(circle at 92% 0%,#25104b 0,transparent 30%),#02040a;color:#fff}body{padding:22px}.wrap{width:min(1280px,100%);margin:auto}a{color:inherit;text-decoration:none}button{font:inherit}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px;font-weight:900;font-size:22px}.logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,#6366f1,#a855f7);box-shadow:0 0 28px #6366f155}.back,.btn{padding:10px 14px;border:1px solid #ffffff14;border-radius:11px;background:#ffffff08;color:#d7d5e5;cursor:pointer}.hero{padding:34px 30px;border:1px solid #ffffff12;border-radius:26px;background:radial-gradient(circle at 90% 15%,#a855f728,transparent 35%),radial-gradient(circle at 10% 90%,#6366f125,transparent 40%),#0d1127c7;box-shadow:0 25px 80px #0005}.eyebrow{color:#aaa9ff;text-transform:uppercase;font-size:12px;font-weight:900;letter-spacing:.12em}h1{font-size:clamp(36px,5vw,58px);margin:10px 0 8px;letter-spacing:-2px}h1 span,.accent{background:linear-gradient(90deg,#818cf8,#c084fc);-webkit-background-clip:text;background-clip:text;color:transparent}.hero p{color:#aaa9bb;max-width:760px;line-height:1.6;margin:0}.hero-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:center}.hero-art{border:1px solid #ffffff10;border-radius:22px;padding:22px;background:linear-gradient(145deg,#ffffff08,#ffffff02);text-align:center}.cloud{font-size:72px;filter:drop-shadow(0 0 24px #818cf855)}.hero-art strong{display:block;font-size:18px;margin-top:8px}.hero-art small{display:block;color:#88879a;margin-top:5px}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.quick button{padding:15px;border:1px solid #ffffff0e;border-radius:16px;background:#ffffff06;color:#fff;cursor:pointer;text-align:left}.quick button:hover,.file:hover,.feature:hover{background:#ffffff0b;border-color:#818cf833}.quick b{display:block;margin-bottom:5px}.quick span{color:#858494;font-size:12px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 285px;gap:18px;margin-top:18px}.card{border:1px solid #ffffff10;border-radius:20px;background:#0d1127d9;box-shadow:0 18px 50px #0003;padding:20px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}.toolbar h2,.card h2{margin:0 0 4px;font-size:19px}.muted{color:#858494;font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}.primary{padding:10px 14px;border:0;border-radius:11px;background:linear-gradient(135deg,#6366f1,#a855f7);color:#fff;font-weight:900;cursor:pointer}.search{width:min(330px,100%);padding:10px 12px;border:1px solid #ffffff12;border-radius:11px;background:#050711;color:#fff;outline:none}.crumbs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:4px 0 14px;color:#9c9aae;font-size:13px}.crumb{cursor:pointer;color:#b9b7ff}.files{display:grid;gap:8px}.file{display:grid;grid-template-columns:42px minmax(0,1fr) auto;align-items:center;gap:12px;padding:12px;border:1px solid #ffffff0b;border-radius:14px;background:#ffffff04;transition:.15s}.file-icon{font-size:25px;text-align:center}.file-name{font-weight:800;word-break:break-all}.file-meta{margin-top:3px;color:#747385;font-size:12px}.file-actions{display:flex;gap:6px}.iconbtn{border:1px solid #ffffff10;border-radius:9px;background:#ffffff07;color:#ddd;cursor:pointer;padding:7px 9px}.empty{padding:55px 15px;text-align:center;color:#777687;border:1px dashed #ffffff15;border-radius:16px}.side-title{display:flex;justify-content:space-between;align-items:center}.stat{font-size:34px;font-weight:900;margin:4px 0;background:linear-gradient(90deg,#a5b4fc,#d8b4fe);-webkit-background-clip:text;background-clip:text;color:transparent}.usage{margin:17px 0 10px;height:12px;border-radius:999px;background:#ffffff0b;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#6366f1,#a855f7);border-radius:inherit;transition:.35s}.usage-row{display:flex;justify-content:space-between;color:#b8b7c7;font-size:12px}.syncbox{margin-top:18px;padding:14px;border-radius:13px;background:#ffffff05;border:1px solid #ffffff0b}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#55e89a;margin-right:7px;box-shadow:0 0 10px #55e89a}.feature-list{display:grid;gap:9px;margin-top:15px}.feature{padding:12px;border:1px solid #ffffff08;border-radius:13px;background:#ffffff03}.feature b{display:block;font-size:13px}.feature span{display:block;color:#777687;font-size:12px;margin-top:4px}.recent{margin-top:18px}.drop{border:2px dashed #818cf844;border-radius:16px;padding:20px;text-align:center;color:#9290a5;margin-bottom:14px}.status{min-height:18px;margin-top:12px;color:#858ca1;font-size:13px}.login{max-width:500px;margin:50px auto}.login input{display:block;width:100%;padding:12px;margin:8px 0;border-radius:11px;border:1px solid #ffffff12;background:#050711;color:#fff;outline:none}.login button{width:100%;padding:12px;border:0;border-radius:11px;background:linear-gradient(135deg,#6366f1,#a855f7);color:#fff;font-weight:900;cursor:pointer}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:20px;z-index:20}.modalbox{width:min(480px,100%);padding:22px;border:1px solid #ffffff14;border-radius:20px;background:#0d1127;box-shadow:0 30px 100px #0008}.modalbox input{width:100%;padding:12px;margin:10px 0;border:1px solid #ffffff14;border-radius:10px;background:#050711;color:#fff}.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}@media(max-width:950px){.hero-grid{grid-template-columns:1fr}.layout{grid-template-columns:1fr}.quick{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){body{padding:14px}.hero{padding:27px 20px}.quick{grid-template-columns:1fr}.file{grid-template-columns:36px minmax(0,1fr)}.file-actions{grid-column:2}.search{width:100%}}
.install-drive{margin-top:18px;display:flex;align-items:center;gap:14px;padding:17px 19px;border:1px solid #818cf866;border-radius:16px;background:linear-gradient(135deg,#6366f122,#a855f718);box-shadow:0 10px 35px #0004;color:#fff;transition:.18s}.install-drive:hover{transform:translateY(-2px);border-color:#a855f7aa;box-shadow:0 14px 40px #0006}.install-icon{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:linear-gradient(135deg,#6366f1,#a855f7);font-size:22px}.install-drive b{display:block;font-size:16px}.install-drive small{display:block;color:#aaa9bb;margin-top:4px}.install-arrow{margin-left:auto;font-size:22px;color:#b7b5ff}@media(max-width:600px){.install-drive{padding:14px}.install-arrow{display:none}}</style>

<body>
<div class="wrap">
<div class="top"><a class="brand" href="index.html"><span class="logo">D</span><span>DougDrive</span></a><a class="back" href="index.html">← DougHub</a></div>
<div id="app"></div>
</div>
<script>
const HUB_URL="https://agsqdqcsmsppcdqxlppj.supabase.co",HUB_KEY="sb_publishable_Oq1WvEHgoHcjmCBGbEnoYQ_BqYA1p52",DRIVE_FN="https://tolvtmuolnzhkegphevw.supabase.co/functions/v1/dougdrive",LIMIT=5*1024*1024*1024;
const sb=supabase.createClient(HUB_URL,HUB_KEY);let currentFolder="",allRows=[];
const esc=v=>String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
function fmt(n){if(!n)return"0 B";if(n<1024)return n+" B";let u=["KB","MB","GB","TB"],i=0,x=n/1024;while(x>=1024&&i<u.length-1){x/=1024;i++}return x.toFixed(x>=100?0:x>=10?1:2)+" "+u[i]}
function icon(name,folder=false){if(folder)return"📁";let e=name.split(".").pop().toLowerCase();return["png","jpg","jpeg","gif","webp","svg"].includes(e)?"🖼️":["mp4","mov","webm"].includes(e)?"🎬":["mp3","wav","ogg"].includes(e)?"🎵":["zip","rar","7z"].includes(e)?"🗜️":["pdf"].includes(e)?"📕":["doc","docx","txt"].includes(e)?"📄":"📦"}
async function list(prefix){let out=[],todo=[""];while(todo.length){let p=todo.pop();let {data,error}=await sb.storage.from(BUCKET).list(prefix+p,{limit:1000,offset:0,sortBy:{column:"name",order:"asc"}});if(error)throw error;for(const x of data||[]){const full=p+(x.name||"");if(x.id===null||x.id===undefined)todo.push(full.replace(/\/?$/,"/"));else if(x.name!==".dougdrive")out.push({...x,path:full})}}return out}
function login(){app.innerHTML='<div class="card login"><div class="eyebrow">DougHub Tool</div><h1><span>DougDrive</span></h1><p class="muted">Your private cloud drive, connected to DougBase.</p><input id="email" type="email" placeholder="DougHub email"><input id="pw" type="password" placeholder="Password"><button id="signin">Sign in to DougDrive</button><div id="msg" class="status"></div></div>';signin.onclick=async()=>{msg.textContent="Signing in…";const {error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:pw.value});if(error){msg.textContent=error.message;return}load()}}
async function session(){const {data}=await sb.auth.getSession();return data.session}
async function load(){const s=await session();if(!s){login();return}app.innerHTML='<section class="hero"><div class="hero-grid"><div><div class="eyebrow">DougHub Cloud Storage</div><h1>Welcome to <span>DougDrive.</span></h1><p>One place for your files, folders, and backups. Upload from the web or keep your Windows DougDrive folder synchronized automatically.</p><button class="install-drive" type="button" onclick="installDougDrive()"><span class="install-icon">⬇</span><span><b>Install DougDrive for Windows</b><small>Download the latest Windows installer</small></span><span class="install-arrow">→</span></button><div class="quick"><button onclick="document.getElementById(\'uploadBtn\').click()"><b>⬆ Upload</b><span>Add files to your drive</span></button><button onclick="createFolder()"><b>📁 New folder</b><span>Organize your files</span></button><button onclick="refresh()"><b>🔄 Refresh</b><span>Check for new files</span></button><button onclick="document.getElementById(\'search\').focus()"><b>🔍 Search</b><span>Find something quickly</span></button></div></div><div class="hero-art"><div class="cloud">☁️</div><strong>Your private cloud</strong><small>Files are stored in your DougBase DougDrive space.</small></div></div></section><div class="layout"><main><div class="card"><div class="toolbar"><div><h2>My DougDrive</h2><div id="count" class="muted">Loading…</div></div><div class="actions"><input id="search" class="search" placeholder="🔍 Search files"><button id="newFolder" class="btn">📁 New folder</button><button id="uploadBtn" class="primary">⬆ Upload</button><input id="fileInput" class="hidden" type="file" multiple></div></div><div id="crumbs" class="crumbs"></div><div id="drop" class="drop">Drop files anywhere here to upload</div><div id="files" class="files"></div><div id="status" class="status"></div></div><div class="card recent"><h2>How DougDrive works</h2><div class="feature-list"><div class="feature"><b>☁️ Cloud storage</b><span>Your files live in your private DougDrive storage instead of being visible to other users.</span></div><div class="feature"><b>🖥️ Windows sync</b><span>The DougDrive desktop app can keep a Windows folder synchronized with your cloud files.</span></div><div class="feature"><b>🔒 Private by account</b><span>Storage access is restricted to the signed-in DougDrive account.</span></div></div></div></main><aside><div class="card"><div class="side-title"><h2>Storage</h2><span>5 GB</span></div><div class="stat" id="used">—</div><div class="muted">currently used</div><div class="usage"><div id="bar" class="bar"></div></div><div class="usage-row"><span id="usage">Checking…</span><span>5 GB included</span></div><div class="syncbox"><b><span class="dot"></span>Windows Sync</b><div class="muted" style="margin-top:7px">Ready to sync. The desktop app checks for changes every 5 seconds.</div></div><div class="feature-list"><div class="feature"><b>📁 Folders</b><span>Keep projects, games, school files, and more organized.</span></div><div class="feature"><b>⬇ Downloads</b><span>Download your files back to any device.</span></div><div class="feature"><b>🗑️ File management</b><span>Delete and replace files whenever you need to.</span></div></div><button id="signout" class="btn" style="width:100%;margin-top:14px">Sign out</button></div></aside></div>';bind();await refresh()}
function bind(){uploadBtn.onclick=()=>fileInput.click();fileInput.onchange=()=>uploadFiles([...fileInput.files]);newFolder.onclick=createFolder;signout.onclick=()=>sb.auth.signOut();search.oninput=render;drop.ondragover=e=>{e.preventDefault();drop.style.borderColor="#a855f7"};drop.ondragleave=()=>drop.style.borderColor="";drop.ondrop=e=>{e.preventDefault();drop.style.borderColor="";uploadFiles([...e.dataTransfer.files])}}
function pathPrefix(){return currentFolder?currentFolder+"/":""}
function renderCrumbs(){let parts=currentFolder?currentFolder.split("/"):[];crumbs.innerHTML='<span class="crumb" onclick="goFolder(\'\')">DougDrive</span>'+parts.map((p,i)=>' <span>/</span> <span class="crumb" onclick="goFolder(\''+esc(parts.slice(0,i+1).join("/"))+'\')">'+esc(p)+'</span>').join("")}
function goFolder(p){currentFolder=p;render();renderCrumbs()}
function render(){const q=(search?.value||"").toLowerCase(),prefix=pathPrefix(),rows=allRows.filter(x=>x.path.startsWith(prefix)),direct=rows.map(x=>{let rest=x.path.slice(prefix.length),slash=rest.indexOf("/");return slash<0?{...x,display:rest}:null}).filter(Boolean),seen=new Set(),folders=[];rows.forEach(x=>{let rest=x.path.slice(prefix.length),slash=rest.indexOf("/");if(slash>0&&!seen.has(rest.slice(0,slash))){seen.add(rest.slice(0,slash));folders.push(rest.slice(0,slash))}});let items=[...folders.map(name=>({folder:true,name,display:name})),...direct].filter(x=>(x.display||"").toLowerCase().includes(q));count.textContent=items.length+" item"+(items.length===1?"":"s")+" · "+allRows.length+" total";files.innerHTML=items.length?items.map(x=>x.folder?'<div class="file"><div class="file-icon">📁</div><div><div class="file-name">'+esc(x.name)+'</div><div class="file-meta">Folder</div></div><div class="file-actions"><button class="iconbtn" onclick="goFolder(\''+esc(pathPrefix()+x.name)+'\')">Open</button></div></div>':fileHtml(x)).join(""):'<div class="empty">This folder is empty.<br>Upload a file or create a folder to get started.</div>'}
function fileHtml(x){return'<div class="file"><div class="file-icon">'+icon(x.name)+'</div><div><div class="file-name">'+esc(x.name)+'</div><div class="file-meta">'+fmt(Number(x.metadata?.size||x.metadata?.contentLength||0))+' · '+esc(x.updated_at?new Date(x.updated_at).toLocaleString():"Stored in DougDrive")+'</div></div><div class="file-actions"><button class="iconbtn" onclick="downloadFile(\''+esc(x.path)+'\')">⬇</button><button class="iconbtn" onclick="deleteFile(\''+esc(x.path)+'\')">🗑</button></div></div>'}
async function refresh(){const s=await session();if(!s)return login();status.textContent="Loading your files…";try{allRows=await list(s.user.id);let total=allRows.reduce((a,x)=>a+Number(x.metadata?.size||x.metadata?.contentLength||0),0);used.textContent=fmt(total);usage.textContent=fmt(total)+" used";bar.style.width=Math.min(100,total/LIMIT*100)+"%";renderCrumbs();render();status.textContent=allRows.length?"DougDrive is ready":"DougDrive is ready — upload your first file above."}catch(e){status.textContent=e.message}}
async function uploadFiles(files){const s=await session();if(!s)return;for(const f of files){status.textContent="Uploading "+f.name+"…";const path=s.user.id+"/"+pathPrefix()+f.name;const {error}=await sb.storage.from(BUCKET).upload(path,f,{upsert:true,contentType:f.type||"application/octet-stream"});if(error){status.textContent=error.message;return}}status.textContent="Upload complete";await refresh()}
async function downloadFile(path){status.textContent="Downloading…";const {data,error}=await sb.storage.from(BUCKET).download(path);if(error){status.textContent=error.message;return}const objectUrl=window.URL.createObjectURL(data),a=document.createElement("a");a.href=objectUrl;a.download=path.split("/").pop();document.body.appendChild(a);a.click();a.remove();setTimeout(()=>window.URL.revokeObjectURL(objectUrl),1000);status.textContent="Download started"}
async function deleteFile(path){if(!confirm("Delete this file from DougDrive?"))return;const {error}=await sb.storage.from(BUCKET).remove([path]);if(error){status.textContent=error.message;return}await refresh()}
async function createFolder(){const name=prompt("Folder name");if(!name)return;if(/[\\/]/.test(name)||name==="."||name===".."){alert("Please use a simple folder name.");return}const s=await session(),path=s.user.id+"/"+pathPrefix()+name+"/.dougdrive";const {error}=await sb.storage.from(BUCKET).upload(path,new Blob(["DougDrive folder"],{type:"text/plain"}),{upsert:false});if(error&&!String(error.message).toLowerCase().includes("duplicate")){status.textContent=error.message;return}await refresh();status.textContent="Folder created"}
sb.auth.onAuthStateChange(()=>setTimeout(load,0));load();
async function installDougDrive(){const url="https://github.com/toomanygames/DougHub/releases/download/dougdrive-latest/DougDrive%20Setup.exe";try{const r=await fetch(url,{method:"HEAD",cache:"no-store"});if(!r.ok){status.textContent="The Windows installer is still building. Try again in a little bit.";return}const a=document.createElement("a");a.href=url;a.download="DougDrive Setup.exe";document.body.appendChild(a);a.click();a.remove();status.textContent="DougDrive installer download started."}catch(e){status.textContent="The installer is not ready yet. Please try again shortly."}}</script>
</body>
</html>
