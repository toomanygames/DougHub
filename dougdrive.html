<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DougDrive — DougHub</title>
<link rel="icon" href="DougHub.svg" type="image/x-icon">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:radial-gradient(circle at 10% 0%,#17133b 0%,transparent 35%),radial-gradient(circle at 90% 0%,#25104b 0%,transparent 32%),#02040a;color:#fff}body{padding:28px}.wrap{width:min(1180px,100%);margin:auto}a{color:inherit;text-decoration:none}button{font:inherit}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:24px}.brand{display:flex;align-items:center;gap:12px;font-weight:900;font-size:22px}.logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,#6366f1,#a855f7);box-shadow:0 0 28px #6366f155}.back{padding:10px 14px;border:1px solid #ffffff14;border-radius:11px;background:#ffffff08;color:#b9b7c8}.hero{padding:42px 34px;border:1px solid #ffffff12;border-radius:28px;background:radial-gradient(circle at 90% 15%,#a855f728,transparent 35%),radial-gradient(circle at 10% 90%,#6366f125,transparent 40%),#0d1127c7;box-shadow:0 25px 80px #0005}.eyebrow{color:#aaa9ff;text-transform:uppercase;font-size:12px;font-weight:900;letter-spacing:.12em}h1{font-size:clamp(38px,6vw,64px);margin:12px 0 10px;letter-spacing:-2px}h1 span{background:linear-gradient(90deg,#818cf8,#c084fc);-webkit-background-clip:text;background-clip:text;color:transparent}.hero p{color:#aaa9bb;max-width:700px;line-height:1.65;margin:0}.grid{display:grid;grid-template-columns:1.4fr .8fr;gap:18px;margin-top:18px}.card{border:1px solid #ffffff10;border-radius:22px;background:#0d1127b8;box-shadow:0 18px 50px #0003;padding:24px}.card h2{margin:0 0 5px;font-size:20px}.muted{color:#858494;font-size:13px}.usage{margin:22px 0 12px;height:14px;border-radius:999px;background:#ffffff0b;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#6366f1,#a855f7);border-radius:inherit;transition:.35s}.usage-row{display:flex;justify-content:space-between;color:#b8b7c7;font-size:13px}.stat{font-size:38px;font-weight:900;margin:4px 0;background:linear-gradient(90deg,#a5b4fc,#d8b4fe);-webkit-background-clip:text;background-clip:text;color:transparent}.upgrade{display:block;margin-top:18px;padding:13px 16px;text-align:center;border-radius:12px;border:1px solid #818cf855;background:#6366f12b;font-weight:900}.soon{font-size:11px;color:#a5a4b4;margin-top:8px;text-align:center}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}.refresh{padding:9px 13px;border:1px solid #818cf855;border-radius:10px;background:#6366f11f;color:#fff;cursor:pointer}.files{display:grid;gap:9px}.file{display:flex;align-items:center;gap:13px;padding:14px;border:1px solid #ffffff0c;border-radius:14px;background:#ffffff04}.file-icon{font-size:22px}.file-name{font-weight:700;word-break:break-all}.file-meta{margin-top:3px;color:#747385;font-size:12px}.empty{padding:38px 15px;text-align:center;color:#777687;border:1px dashed #ffffff15;border-radius:16px}.login{max-width:480px;margin:60px auto}.login input{display:block;width:100%;padding:12px;margin:8px 0;border-radius:11px;border:1px solid #ffffff12;background:#050711;color:#fff;outline:none}.login button{width:100%;padding:12px;border:0;border-radius:11px;background:linear-gradient(135deg,#6366f1,#a855f7);color:#fff;font-weight:900;cursor:pointer}.status{min-height:20px;margin-top:10px;color:#858ca1;font-size:13px}@media(max-width:800px){body{padding:16px}.grid{grid-template-columns:1fr}.hero{padding:30px 22px}.top{align-items:flex-start}}
</style>
</head>
<body><div class="wrap"><div class="top"><a class="brand" href="index.html"><span class="logo">D</span><span>DougDrive</span></a><a class="back" href="index.html">← DougHub</a></div><div id="app"></div></div>
<script>
const URL="https://tolvtmuolnzhkegphevw.supabase.co",KEY="sb_publishable_nj7z92WGz6tu9KcWWX97CQ_r0Yv7BD3",BUCKET="dougdrive",LIMIT=5*1024*1024*1024;
const sb=supabase.createClient(URL,KEY);
const esc=v=>String(v).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
function fmt(n){if(n<1024)return n+" B";let u=["KB","MB","GB","TB"],i=0,x=n/1024;while(x>=1024&&i<u.length-1){x/=1024;i++}return x.toFixed(x>=100?0:x>=10?1:2)+" "+u[i]}
async function listFiles(prefix,token){let out=[],todo=[""];while(todo.length){let p=todo.pop();let r=await fetch(URL+"/storage/v1/object/list/"+BUCKET,{method:"POST",headers:{apikey:KEY,Authorization:"Bearer "+token,"Content-Type":"application/json"},body:JSON.stringify({prefix:prefix+p,limit:1000,offset:0,sortBy:{column:"name",order:"asc"}})});let rows=await r.json();if(!r.ok)throw Error(rows.message||"Could not load DougDrive.");for(let x of rows){let full=p+(x.name||"");if(x.id==null)todo.push(full.replace(/\/?$/,"/"));else out.push({...x,path:full})}}return out}
function login(){app.innerHTML='<div class="card login"><div class="eyebrow">DougHub Tool</div><h1><span>DougDrive</span></h1><p class="muted">Sign in to see the files stored in your private DougDrive.</p><input id="email" type="email" placeholder="DougHub email"><input id="pw" type="password" placeholder="Password"><button id="signin">Sign in</button><div id="msg" class="status"></div></div>';signin.onclick=async()=>{msg.textContent="Signing in…";let r=await sb.auth.signInWithPassword({email:email.value.trim(),password:pw.value});msg.textContent=r.error?r.error.message:"";if(!r.error)load()}}
async function refresh(){let {data:{session}}=await sb.auth.getSession();if(!session)return login();let el=document.getElementById("files");el.innerHTML='<div class="empty">Loading your files…</div>';try{let rows=await listFiles(session.user.id+"/",session.access_token),total=0;rows.forEach(x=>{x.bytes=Number(x.metadata?.size||x.metadata?.contentLength||0);total+=x.bytes});used.textContent=fmt(total);usage.textContent=fmt(total)+" used";bar.style.width=Math.min(100,total/LIMIT*100)+"%";fileCount.textContent=rows.length.toLocaleString()+" file"+(rows.length===1?"":"s");el.innerHTML=rows.length?rows.map(x=>'<div class="file"><div class="file-icon">📄</div><div><div class="file-name">'+esc(x.path.replace(session.user.id+"/",""))+'</div><div class="file-meta">'+fmt(x.bytes)+" · "+esc(x.updated_at?new Date(x.updated_at).toLocaleString():"Stored in DougDrive")+"</div></div></div>").join(""):'<div class="empty">Your DougDrive is empty.<br>Files synced from Windows will appear here.</div>'}catch(e){el.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
async function load(){let {data:{user}}=await sb.auth.getUser();if(!user)return login();app.innerHTML='<section class="hero"><div class="eyebrow">DougHub Tool</div><h1>Your files, <span>everywhere.</span></h1><p>DougDrive keeps your DougBase files connected between DougHub and your Windows computer.</p></section><div class="grid"><section class="card"><div class="toolbar"><div><h2>Your Files</h2><div class="muted" id="fileCount">Loading…</div></div><button class="refresh" id="refreshBtn">↻ Refresh</button></div><div id="files" class="files"></div></section><aside class="card"><h2>Storage</h2><div class="stat" id="used">—</div><div class="muted">used</div><div class="usage"><div class="bar" id="bar"></div></div><div class="usage-row"><span id="usage">Checking…</span><span>5 GB included</span></div><a class="upgrade" href="#" onclick="return false">Upgrade Storage</a><div class="soon">Upgrade options coming soon.</div></aside></div>';refreshBtn.onclick=refresh;await refresh()}
sb.auth.onAuthStateChange(()=>load());load();
</script></body></html>
