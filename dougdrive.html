<script>
const HUB_URL = "https://agsqdqcsmsppcdqxlppj.supabase.co";
const HUB_KEY = "sb_publishable_Oq1WvEHgoHcjmCBGbEnoYQ_BqYA1p52";
const DRIVE_FN = "https://tolvtmuolnzhkegphevw.supabase.co/functions/v1/dougdrive";
const LIMIT = 5 * 1024 * 1024 * 1024;
let currentFolder = "";
let allRows = [];
let sessionState = null;
const SESSION_KEY = "dougdrive_doughub_session";

function saveSession(session) {
  sessionState = session;
  localStorage.setItem(SESSION_KEY, JSON.stringify(session));
}

function clearSession() {
  sessionState = null;
  localStorage.removeItem(SESSION_KEY);
}

async function getSession() {
if (sessionState) {
    if (sessionState.expires_at && sessionState.expires_at > Math.floor(Date.now() / 1000) + 30) {
      return sessionState;
    }
    if (sessionState.refresh_token) {
      const response = await fetch(HUB_URL + "/auth/v1/token?grant_type=refresh_token", {
        method: "POST",
        headers: { apikey: HUB_KEY, "Content-Type": "application/json" },
        body: JSON.stringify({ refresh_token: sessionState.refresh_token })
      });
      if (response.ok) {
        const next = await response.json();
        saveSession(next);
        return next;
      }
    }
    clearSession();
    return null;
  }

  try {
    const saved = JSON.parse(localStorage.getItem(SESSION_KEY) || "null");
    if (!saved) return null;
    sessionState = saved;
    return getSession();
  } catch {
    clearSession();
    return null;
  }
}

async function signIn(email, password) {
  const response = await fetch(HUB_URL + "/auth/v1/token?grant_type=password", {
    method: "POST",
    headers: { apikey: HUB_KEY, "Content-Type": "application/json" },
    body: JSON.stringify({ email, password })
  });
  const data = await response.json();
  if (!response.ok) throw new Error(data.error_description || data.msg || data.message || "Unable to sign in.");
  saveSession(data);
  return data;
}

const $ = id => document.getElementById(id);

function esc(v) {
  return String(v ?? "").replace(/[&<>"']/g, ch => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[ch]));
}

function fmt(n) {
  n = Number(n) || 0;
  if (!n) return "0 B";
  const units = ["B","KB","MB","GB","TB"];
  let i = 0;
  while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
  return (n >= 100 ? n.toFixed(0) : n >= 10 ? n.toFixed(1) : n.toFixed(2)) + " " + units[i];
}

async function getSession() {
  if (sessionState && sessionState.access_token) return sessionState;

  const raw = localStorage.getItem(SESSION_KEY);
  if (!raw) return null;

  try {
    const saved = JSON.parse(raw);
    if (!saved || !saved.access_token) return null;

    if (saved.expires_at && saved.expires_at * 1000 > Date.now() + 60000) {
      sessionState = saved;
      return saved;
    }

    if (saved.refresh_token) {
      const res = await fetch(HUB_URL + "/auth/v1/token?grant_type=refresh_token", {
        method: "POST",
        headers: {
          "apikey": HUB_KEY,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ refresh_token: saved.refresh_token })
      });
      if (res.ok) {
        const fresh = await res.json();
        if (fresh && fresh.access_token) {
          saveSession(fresh);
          return fresh;
        }
      }
    }
  } catch (e) {
    console.error("DougDrive session error:", e);
  }

  clearSession();
  return null;
}

async function driveApi(action, path = "", body = null, contentType = "") {
  const session = await getSession();
  if (!session) throw new Error("Please sign in with your DougHub account.");
  const q = new URLSearchParams({ action });
  if (path) q.set("path", path);

  const headers = { Authorization: "Bearer " + session.access_token };
  if (contentType) headers["Content-Type"] = contentType;

  const response = await fetch(DRIVE_FN + "?" + q.toString(), {
    method: body === null ? "GET" : "POST",
    headers,
    body
  });

  const type = response.headers.get("content-type") || "";
  const result = type.includes("application/json") ? await response.json() : await response.blob();

  if (!response.ok) throw new Error(result?.error || "DougDrive request failed.");
  return result;
}

function fileIcon(name, folder = false) {
  if (folder) return "📁";
  const ext = name.split(".").pop().toLowerCase();
  if (["png","jpg","jpeg","gif","webp","svg"].includes(ext)) return "🖼️";
  if (["mp4","mov","webm"].includes(ext)) return "🎬";
  if (["mp3","wav","ogg"].includes(ext)) return "🎵";
  if (["zip","rar","7z"].includes(ext)) return "🗜️";
  if (ext === "pdf") return "📕";
  if (["doc","docx","txt"].includes(ext)) return "📄";
  return "📦";
}

function folderPath() {
  return currentFolder ? currentFolder + "/" : "";
}

function renderBreadcrumbs() {
  const box = $("crumbs");
  if (!box) return;

  const parts = currentFolder ? currentFolder.split("/") : [];
  let html = '<span class="crumb" data-folder="">DougDrive</span>';

  parts.forEach((part, index) => {
    const path = parts.slice(0, index + 1).join("/");
    html += ' <span>/</span> <span class="crumb" data-folder="' + esc(path) + '">' + esc(part) + "</span>";
  });

  box.innerHTML = html;
  box.querySelectorAll(".crumb").forEach(el => {
    el.onclick = () => {
      currentFolder = el.dataset.folder || "";
      render();
      renderBreadcrumbs();
    };
  });
}

function render() {
  const box = $("files");
  if (!box) return;

  const query = ($("search")?.value || "").toLowerCase();
  const prefix = folderPath();
  const visible = allRows.filter(x => x.path.startsWith(prefix));

  const folders = new Set();
  const directFiles = [];

  for (const item of visible) {
    const rest = item.path.slice(prefix.length);
    const slash = rest.indexOf("/");

    if (slash >= 0) folders.add(rest.slice(0, slash));
    else if (rest && rest.toLowerCase().includes(query)) directFiles.push(item);
  }

  const folderItems = [...folders]
    .filter(name => name.toLowerCase().includes(query))
    .map(name => ({
      folder: true,
      name,
      display: name
    }));

  const items = [...folderItems, ...directFiles];

  $("count").textContent = items.length + " item" + (items.length === 1 ? "" : "s") + " · " + allRows.length + " total";

  if (!items.length) {
    box.innerHTML = '<div class="empty">This folder is empty.<br>Upload a file or create a folder to get started.</div>';
    return;
  }

  box.innerHTML = items.map(item => {
    if (item.folder) {
      return '<div class="file"><div class="file-icon">📁</div><div><div class="file-name">' +
        esc(item.name) + '</div><div class="file-meta">Folder</div></div><div class="file-actions">' +
        '<button class="iconbtn open-folder" data-name="' + esc(item.name) + '">Open</button></div></div>';
    }

    const size = item.metadata?.size || item.metadata?.contentLength || 0;
    return '<div class="file"><div class="file-icon">' + fileIcon(item.name) +
      '</div><div><div class="file-name">' + esc(item.name) + '</div><div class="file-meta">' +
      fmt(size) + " · " + esc(item.updated_at ? new Date(item.updated_at).toLocaleString() : "Stored in DougDrive") +
      '</div></div><div class="file-actions">' +
      '<button class="iconbtn download-file" data-path="' + esc(item.path) + '">⬇</button>' +
      '<button class="iconbtn delete-file" data-path="' + esc(item.path) + '">🗑</button>' +
      '</div></div>';
  }).join("");

  box.querySelectorAll(".open-folder").forEach(btn => {
    btn.onclick = () => {
      currentFolder = folderPath() + btn.dataset.name;
      renderBreadcrumbs();
      render();
    };
  });

  box.querySelectorAll(".download-file").forEach(btn => {
    btn.onclick = () => downloadFile(btn.dataset.path);
  });

  box.querySelectorAll(".delete-file").forEach(btn => {
    btn.onclick = () => deleteFile(btn.dataset.path);
  });
}

async function refresh() {
  const session = await getSession();
  if (!session) return showLogin();

  $("status").textContent = "Loading your files…";

  try {
    const data = await driveApi("list");
    allRows = data.items || [];

    const usedBytes = allRows.reduce((total, item) =>
      total + Number(item.metadata?.size || item.metadata?.contentLength || 0), 0);

    $("used").textContent = fmt(usedBytes);
    $("usage").textContent = fmt(usedBytes) + " used";
    $("bar").style.width = Math.min(100, usedBytes / LIMIT * 100) + "%";

    renderBreadcrumbs();
    render();
    $("status").textContent = allRows.length
      ? "DougDrive is ready."
      : "DougDrive is ready — upload your first file above.";
  } catch (error) {
    $("status").textContent = error.message;
  }
}

async function uploadFiles(files) {
  for (const file of files) {
    $("status").textContent = "Uploading " + file.name + "…";
    try {
      await driveApi("upload", folderPath() + file.name, file, file.type || "application/octet-stream");
    } catch (error) {
      $("status").textContent = error.message;
      return;
    }
  }

  $("status").textContent = "Upload complete.";
  await refresh();
}

async function downloadFile(path) {
  $("status").textContent = "Downloading…";

  try {
    const blob = await driveApi("download", path);
    const objectUrl = window.URL.createObjectURL(blob);
    const link = document.createElement("a");

    link.href = objectUrl;
    link.download = path.split("/").pop();
    document.body.appendChild(link);
    link.click();
    link.remove();

    setTimeout(() => window.URL.revokeObjectURL(objectUrl), 1000);
    $("status").textContent = "Download started.";
  } catch (error) {
    $("status").textContent = error.message;
  }
}

async function deleteFile(path) {
  if (!confirm("Delete this file from DougDrive?")) return;

  try {
    await driveApi("delete", path);
    await refresh();
  } catch (error) {
    $("status").textContent = error.message;
  }
}

async function createFolder() {
  const name = prompt("Folder name");
  if (!name) return;

  if (/[\\/]/.test(name) || name === "." || name === "..") {
    alert("Please use a simple folder name.");
    return;
  }

  try {
    await driveApi("folder", folderPath() + name);
    await refresh();
    $("status").textContent = "Folder created.";
  } catch (error) {
    $("status").textContent = error.message;
  }
}

function bindDashboard() {
  $("uploadBtn").onclick = () => $("fileInput").click();
  $("fileInput").onchange = () => uploadFiles([...$("fileInput").files]);
  $("newFolder").onclick = createFolder;
  $("signout").onclick = () => {
    clearSession();
    showLogin();
  };
  $("search").oninput = render;

  const drop = $("drop");
  drop.ondragover = event => {
    event.preventDefault();
    drop.style.borderColor = "#a855f7";
  };
  drop.ondragleave = () => drop.style.borderColor = "";
  drop.ondrop = event => {
    event.preventDefault();
    drop.style.borderColor = "";
    uploadFiles([...event.dataTransfer.files]);
  };
}

function showLogin() {
  $("app").innerHTML = `
    <div class="card login">
      <div class="eyebrow">DougHub Tool</div>
      <h1><span>DougDrive</span></h1>
      <p class="muted">Your private cloud drive, connected to DougBase.</p>
      <input id="email" type="email" placeholder="DougHub email" autocomplete="email">
      <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
      <button id="signin">Sign in to DougDrive</button>
      <div id="loginMsg" class="status"></div>
    </div>`;

  $("signin").onclick = async () => {
    $("loginMsg").textContent = "Signing in…";
    try {
      await signIn($("email").value.trim(), $("pw").value);
      await loadDashboard();
    } catch (error) {
      $("loginMsg").textContent = error.message;
    }
  };
}

  if (!session) {
    showLogin();
    return;
  }

  $("app").innerHTML = `
    <section class="hero">
      <div class="hero-grid">
        <div>
          <div class="eyebrow">DougHub Cloud Storage</div>
          <h1>Welcome to <span>DougDrive.</span></h1>

      </div>
    </section>

    <div class="layout">

          <div class="usage"><div id="bar" class="bar"></div></div>

function installDougDrive() {
  async function downloadInstaller(){
  const button = $("downloadInstaller");
  const oldText = button.innerHTML;
  button.disabled = true;
  button.innerHTML = "Preparing download…";
  try {
    const response = await fetch("https://github.com/toomanygames/DougHub/releases/download/dougdrive-latest/DougDrive.Setup.exe", {cache:"no-store"});
    if (!response.ok) throw new Error("Installer not found on DougHub.");
    const blob = await response.blob();
    const url = window.URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = "DougDrive Setup.exe";
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => window.URL.revokeObjectURL(url), 1000);
    button.innerHTML = "✓ Download started";
  } catch (error) {
    console.error(error);
    button.innerHTML = "Installer unavailable";
    alert("The DougDrive installer is not published yet. The download will work once DougDrive Setup.exe is added to the DougDrive folder.");
  } finally {
    setTimeout(() => {
      button.disabled = false;
      button.innerHTML = oldText;
    }, 2500);
  }
}
}

loadDashboard();
</script>
</body>
</html>
