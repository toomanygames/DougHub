<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0e20">
<title>Log in • DougHub</title>
<link rel="icon" href="DougHub.svg" type="image/svg+xml">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{color-scheme:dark;--bg:#0b0e20;--panel:#141935;--panel2:#1a2048;--line:#2a3160;--mute:#a3acd9;--a:#6366f1;--b:#a855f7;--c:#67e8f9}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{display:grid;place-items:center;min-height:100vh;padding:24px 16px;color:#f1f3ff;font:16px/1.5 "Segoe UI",system-ui,-apple-system,Arial,sans-serif;background:radial-gradient(circle at 80% -10%,#30205a99,transparent 45%),radial-gradient(circle at 0 20%,#1b2a6a66,transparent 40%),var(--bg)}
a{color:inherit}
.wrap{width:min(440px,100%)}
.brand{display:flex;align-items:center;justify-content:center;gap:12px;font-size:28px;font-weight:800;margin-bottom:18px;text-decoration:none}
.mark{width:46px;height:46px;border-radius:12px;background:var(--a);display:grid;place-items:center;font:800 26px Arial,sans-serif;color:#fff;box-shadow:0 8px 26px #6366f166}
.card{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:26px 24px 22px;box-shadow:0 24px 60px #0007}
h1{margin:0;font-size:26px;letter-spacing:-.01em}
.sub{margin:4px 0 18px;color:var(--mute)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);margin-bottom:18px}
.tab{border:0;border-radius:999px;padding:10px;background:transparent;color:var(--mute);font:inherit;font-weight:700;cursor:pointer}
.tab.active{background:linear-gradient(135deg,var(--a),var(--b));color:#fff;box-shadow:0 6px 18px #6366f155}
label{display:block;font-size:13px;font-weight:700;color:var(--mute);margin:14px 0 6px}
input{width:100%;padding:13px 15px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);color:#f1f3ff;font:inherit}
input:focus{outline:none;border-color:var(--a);box-shadow:0 0 0 3px #6366f144}
.hint{margin:6px 2px 0;color:var(--mute);font-size:12.5px}
.pw{position:relative}.pw button{position:absolute;right:8px;top:7px;border:0;background:transparent;color:var(--mute);cursor:pointer;font:inherit;font-size:13px;font-weight:700;padding:6px 8px}
.action{width:100%;margin-top:20px;padding:14px;border:0;border-radius:999px;background:linear-gradient(135deg,var(--a),var(--b));color:#fff;font:inherit;font-weight:800;font-size:16px;cursor:pointer;box-shadow:0 10px 28px #6366f155;transition:transform .15s}
.action:hover{transform:translateY(-1px)}.action:disabled{opacity:.6;cursor:wait;transform:none}
.link{display:block;margin:14px auto 0;border:0;background:transparent;color:#a5b4fc;font:inherit;font-size:14px;cursor:pointer;text-decoration:underline}
.message{min-height:22px;margin-top:14px;font-size:14px;color:#fca5a5}.message.ok{color:#86efac}
.message button{margin-left:6px;padding:3px 10px;border-radius:8px;border:1px solid currentColor;background:transparent;color:inherit;font:inherit;font-weight:700;cursor:pointer}
.foot{display:flex;justify-content:center;gap:18px;margin-top:16px;font-size:14px;color:var(--mute)}
.foot a{text-decoration:underline}
:focus-visible{outline:3px solid var(--c);outline-offset:3px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <a class="brand" href="index.html" aria-label="DougHub home"><img src="assets/logo.svg" alt="" width="50" height="50" style="display:block;filter:drop-shadow(0 8px 18px #6366f188)"><span>DougHub</span></a>
  <form class="card" id="authForm" novalidate>
    <h1 id="title">Welcome back</h1>
    <p class="sub" id="subtitle">Log in to your account.</p>
    <div class="tabs" id="tabs" role="tablist">
      <button class="tab active" id="loginTab" type="button" role="tab">Log In</button>
      <button class="tab" id="signupTab" type="button" role="tab">Sign Up</button>
    </div>

    <div id="usernameBox" hidden>
      <label for="username">Username</label>
      <input id="username" type="text" placeholder="Choose a username" maxlength="20" autocomplete="username" autocapitalize="off" spellcheck="false">
    </div>

    <div id="idBox">
      <label for="email" id="idLabel">Username or email</label>
      <input id="email" type="text" placeholder="Your username or email" autocomplete="username" autocapitalize="off" spellcheck="false">
      <p class="hint" id="emailHint" hidden>Email is optional. Without one, a forgotten password can't be reset.</p>
    </div>

    <label for="password" id="pwLabel">Password</label>
    <div class="pw"><input id="password" type="password" placeholder="Enter your password" autocomplete="current-password"><button type="button" id="showPw" aria-label="Show password">Show</button></div>

    <button class="action" id="actionButton" type="submit">Log In</button>
    <button class="link" id="forgotLink" type="button">Forgot your password?</button>
    <div class="message" id="message" role="alert" aria-live="polite"></div>
  </form>
  <div class="foot"><a href="index.html">← Back to DougHub</a><a href="tos.html">Terms of Service</a><a href="privacy.html">Privacy Policy</a></div>
</div>

<script>
const SUPABASE_URL = "https://agsqdqcsmsppcdqxlppj.supabase.co";
const SUPABASE_KEY = "sb_publishable_Oq1WvEHgoHcjmCBGbEnoYQ_BqYA1p52";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
let signupMode = false, recoveryMode = /type=recovery/.test(location.hash) || /type=recovery/.test(location.search);

/* where to go after signing in: ?redirect=page.html or ?next=/path/page.html (same-site pages only) */
const qs = new URLSearchParams(location.search);
const wanted = qs.get("redirect") || qs.get("next") || "dashboard.html";
const safeRedirect = /^\/?[A-Za-z0-9_./-]+\.html$/.test(wanted) && wanted.indexOf("..") < 0 ? wanted.replace(/^\//, "") : "dashboard.html";

async function recordAuthAudit(userId, eventType, action, details) {
  try {
    if (!userId) return;
    const { error } = await supabaseClient.from("admin_audit_logs").insert({ actor_id: userId, event_type: eventType, category: "authentication", action: action, page: location.pathname, details: details || {} });
    if (error) console.warn("Authentication audit event could not be saved:", error.message);
  } catch (e) { console.warn("Authentication audit event could not be saved:", e); }
}

/* accounts without an email use a made-up address, the same way the DougHub app does */
function fakeEmail(name) { return String(name).trim().toLowerCase().replace(/[^a-z0-9._-]+/g, "_").replace(/^[._-]+/, "u") + "@users.doughub.invalid"; }

function setMsg(text, ok) { const m = $("message"); m.textContent = text || ""; m.classList.toggle("ok", !!ok); }

function setMode(signup) {
  signupMode = signup;
  $("loginTab").classList.toggle("active", !signup);
  $("signupTab").classList.toggle("active", signup);
  $("usernameBox").hidden = !signup;
  $("emailHint").hidden = !signup;
  $("title").textContent = signup ? "Create your account" : "Welcome back";
  $("subtitle").textContent = signup ? "Join DougHub in a few seconds." : "Log in to your account.";
  $("idLabel").textContent = signup ? "Email (optional)" : "Username or email";
  $("email").placeholder = signup ? "Leave empty to skip" : "Your username or email";
  $("email").type = signup ? "email" : "text";
  $("email").autocomplete = signup ? "email" : "username";
  $("password").autocomplete = signup ? "new-password" : "current-password";
  $("actionButton").textContent = signup ? "Create Account" : "Log In";
  $("forgotLink").hidden = signup;
  setMsg("");
}
$("loginTab").onclick = () => setMode(false);
$("signupTab").onclick = () => setMode(true);
$("showPw").onclick = () => { const p = $("password"), s = p.type === "password"; p.type = s ? "text" : "password"; $("showPw").textContent = s ? "Hide" : "Show"; };

function showVerifyNotice(email, text) {
  const box = $("message");
  box.classList.remove("ok");
  box.textContent = text + " ";
  const resend = document.createElement("button");
  resend.type = "button"; resend.textContent = "Resend email";
  resend.addEventListener("click", async function () {
    resend.disabled = true;
    const { error } = await supabaseClient.auth.resend({ type: "signup", email: email, options: { emailRedirectTo: location.origin + "/log-in.html?verified=1" } });
    resend.textContent = error ? "Couldn't resend, try again in a minute" : "Sent! Check your inbox";
    setTimeout(function () { resend.disabled = false; }, 60000);
  });
  box.appendChild(resend);
}

async function submitForm() {
  if (recoveryMode) return saveNewPassword();
  const button = $("actionButton");
  let id = $("email").value.trim();
  const password = $("password").value;
  const username = $("username").value.trim();
  setMsg("");

  if (signupMode) {
    if (!username) return setMsg("Please choose a username.");
    if (username.length < 3) return setMsg("Username must be at least 3 characters.");
    if (!password || password.length < 6) return setMsg("Your password needs at least 6 characters.");
    if (id && /hfk/i.test(id)) return setMsg("Sorry, this email address can't be used for a DougHub account. Please use a different email.");
  } else if (!id || !password) {
    return setMsg("Please enter your username or email, and your password.");
  }
  const email = id ? (id.indexOf("@") < 0 && !signupMode ? fakeEmail(id) : id) : fakeEmail(username);

  button.disabled = true;
  try {
    if (signupMode) {
      const { data, error } = await supabaseClient.auth.signUp({ email: email, password: password, options: { data: { username: username }, emailRedirectTo: location.origin + "/log-in.html?verified=1" } });
      if (error) throw error;
      if (data.session) {
        await recordAuthAudit(data.user.id, "signup", "Account created and signed in", { method: id ? "email_password" : "username_password" });
        location.href = safeRedirect;
      } else {
        showVerifyNotice(email, "Account created! We sent a verification link to " + email + ". Open it to finish signing up (check your spam folder too).");
      }
    } else {
      const { data, error } = await supabaseClient.auth.signInWithPassword({ email: email, password: password });
      if (error) throw error;
      if (data && data.user) await recordAuthAudit(data.user.id, "login", "Successful sign-in", { method: "password" });
      location.href = safeRedirect;
    }
  } catch (error) {
    const text = String(error && error.message || "");
    if (/not confirmed/i.test(text)) showVerifyNotice(email, "Please verify your email first. Open the link we sent to " + email + ".");
    else if (signupMode && /database error saving new user|can.t be used/i.test(text)) setMsg("Sorry, that username or email can't be used for a DougHub account. Please try a different one.");
    else if (!signupMode && /invalid login/i.test(text)) setMsg("That username/email or password isn't right.");
    else setMsg(text || "Something went wrong.");
  } finally {
    button.disabled = false;
  }
}
$("authForm").addEventListener("submit", function (e) { e.preventDefault(); submitForm(); });

function enterRecoveryMode() {
  recoveryMode = true;
  $("title").textContent = "Choose a new password";
  $("subtitle").textContent = "Pick something you will remember.";
  $("tabs").hidden = true; $("idBox").hidden = true; $("usernameBox").hidden = true; $("forgotLink").hidden = true;
  $("password").autocomplete = "new-password";
  $("password").placeholder = "New password (at least 6 characters)";
  $("actionButton").textContent = "Save new password";
  setMsg("");
}
async function saveNewPassword() {
  const pw = $("password").value;
  if (pw.length < 6) return setMsg("Your new password needs at least 6 characters.");
  const r = await supabaseClient.auth.updateUser({ password: pw });
  if (r.error) return setMsg(r.error.message);
  setMsg("Password updated. Taking you to DougHub...", true);
  setTimeout(function () { location.href = safeRedirect; }, 1200);
}
$("forgotLink").addEventListener("click", async function () {
  const email = $("email").value.trim();
  if (!email || email.indexOf("@") < 0) return setMsg("Type your email above first, then press Forgot your password. (Accounts made without an email can't be reset.)");
  const r = await supabaseClient.auth.resetPasswordForEmail(email, { redirectTo: location.origin + "/log-in.html" });
  if (r.error) return setMsg(r.error.message);
  setMsg("If an account exists for that email, a reset link is on its way. Check your inbox.", true);
});
supabaseClient.auth.onAuthStateChange(function (event) { if (event === "PASSWORD_RECOVERY") enterRecoveryMode(); });
if (recoveryMode) enterRecoveryMode();
if (qs.get("verified") === "1") setMsg("Email verified! Welcome to DougHub.", true);
if (qs.get("mode") === "signup") setMode(true);

supabaseClient.auth.getSession().then(function (r) { if (r.data.session && !recoveryMode) location.href = safeRedirect; });
</script>
</body>
</html>
