<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DougBase — Login</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at top left,#24104d,transparent 35%),radial-gradient(circle at bottom right,#17104a,transparent 35%),#02040a;color:#fff;font:15px system-ui,Segoe UI,sans-serif}.card{width:min(430px,100%);padding:32px;border:1px solid #252b4b;border-radius:24px;background:rgba(13,17,39,.88);box-shadow:0 25px 80px #0008;backdrop-filter:blur(18px)}h1{text-align:center;margin:0;background:linear-gradient(90deg,#6366f1,#a855f7);background-clip:text;color:transparent;font-size:36px}.sub{text-align:center;color:#98a1c2;margin:8px 0 25px}label{display:block;color:#cbd1ec;margin:14px 0 7px}input{width:100%;padding:13px;border:1px solid #252b4b;border-radius:11px;background:#080b19;color:#fff;font:inherit}button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:11px;background:linear-gradient(135deg,#6366f1,#a855f7);color:#fff;font-weight:800;font-size:15px;cursor:pointer}button:disabled{opacity:.6}.tabs{display:flex;gap:8px}.tabs button{margin:0;background:#171c38;color:#bfc7e8}.tabs button.active{background:linear-gradient(135deg,#6366f1,#a855f7);color:#fff}.message{min-height:24px;text-align:center;color:#c4b5fd;margin-top:14px}.back{display:block;text-align:center;color:#98a1c2;text-decoration:none;margin-top:20px}.note{font-size:12px;color:#70799d;text-align:center;margin-top:18px;line-height:1.5}
</style>
  <script src="../nav.js" defer></script>

<link rel="stylesheet" href="../douqhub-theme.css">

<script src="../search-autofill-fix.js" defer></script>
</head>
<body>
<div class="card">
<h1>DougBase</h1><div class="sub" id="sub">Sign in to your DougBase project</div>
<div class="tabs"><button id="loginTab" class="active" type="button">Log In</button><button id="signupTab" type="button">Sign Up</button></div>
<div id="usernameWrap" style="display:none"><label>Username</label><input id="username" maxlength="20" autocomplete="username"></div>
<label>Email</label><input id="email" type="email" autocomplete="email">
<label>Password</label><input id="password" type="password" autocomplete="current-password">
<button id="action" type="button">Log In</button><div class="message" id="msg"></div>
<a class="back" href="../index.html">← Back to DougHub</a>
<div class="note">DougBase uses a separate account system from DougHub. Your DougHub account is not automatically shared with this database.</div>
</div>
<script>
const URL="https://tolvtmuolnzhkegphevw.supabase.co",KEY="sb_publishable_nj7z92WGz6tu9KcWWX97CQ_r0Yv7BD3";
const client=supabase.createClient(URL,KEY);let signup=false;
const $=id=>document.getElementById(id);
function mode(v){signup=v;$("loginTab").classList.toggle("active",!v);$("signupTab").classList.toggle("active",v);$("usernameWrap").style.display=v?"block":"none";$("sub").textContent=v?"Create a DougBase account":"Sign in to your DougBase project";$("action").textContent=v?"Create Account":"Log In";$("password").autocomplete=v?"new-password":"current-password";$("msg").textContent=""}
$("loginTab").onclick=()=>mode(false);$("signupTab").onclick=()=>mode(true);
$("action").onclick=async()=>{const email=$("email").value.trim(),password=$("password").value,username=$("username").value.trim();$("msg").textContent="";if(!email||!password){$("msg").textContent="Enter your email and password.";return}if(signup&&username.length<3){$("msg").textContent="Username must be at least 3 characters.";return}$("action").disabled=true;try{if(signup){const {data,error}=await client.auth.signUp({email,password,options:{data:{username}}});if(error)throw error;if(data.session)location.href="index.html";else $("msg").textContent="Account created! Check your email to confirm it."}else{const {error}=await client.auth.signInWithPassword({email,password});if(error)throw error;location.href="index.html"}}catch(e){$("msg").textContent=e.message||"Something went wrong."}finally{$("action").disabled=false}};
$("password").addEventListener("keydown",e=>{if(e.key==="Enter")$("action").click()});
client.auth.getSession().then(({data})=>{if(data.session)location.href="index.html"});
</script>
</body>
</html>
