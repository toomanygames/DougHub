<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>DougHub Inbox</title>

<link
    rel="icon"
    href="DougHub.svg"
    type="image/x-icon"
>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="display.js"></script>


<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;

    font-family:
        Inter,
        Arial,
        sans-serif;

    color: white;

    background:
        radial-gradient(
            circle at 15% 10%,
            rgba(99,102,241,.18),
            transparent 32%
        ),
        radial-gradient(
            circle at 85% 85%,
            rgba(168,85,247,.14),
            transparent 32%
        ),
        #02040a;
}

body {
    padding: 28px;
}

.container {
    width: min(1000px, 100%);
    margin: auto;
}

header {
    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 15px;

    margin-bottom: 30px;
}

.logo {
    font-size: 30px;
    font-weight: 900;
}

.logo span {
    color: #6366f1;
}

.subtitle {
    margin-top: 5px;

    color: #858ca1;

    font-size: 14px;
}

.back {
    color: white;
    text-decoration: none;

    padding: 10px 15px;

    border-radius: 11px;

    border: 1px solid rgba(255,255,255,.1);

    background: rgba(255,255,255,.05);

    font-weight: 700;
}

.back:hover {
    background: rgba(255,255,255,.1);
}

.card {
    border: 1px solid rgba(255,255,255,.09);

    background: rgba(13,17,39,.72);

    border-radius: 20px;

    padding: 20px;

    margin-bottom: 20px;

    backdrop-filter: blur(15px);

    box-shadow:
        0 18px 45px rgba(0,0,0,.25);
}

.card h2 {
    margin: 0 0 5px;
}

.status {
    color: #858ca1;
    font-size: 13px;
}

.feedback {
    padding: 18px;

    margin-top: 12px;

    border-radius: 15px;

    border: 1px solid rgba(255,255,255,.08);

    background: rgba(255,255,255,.035);
}

.feedback-top {
    display: flex;
    justify-content: space-between;

    gap: 15px;

    margin-bottom: 10px;
}

.username {
    color: #c4b5fd;

    font-weight: 800;
}

.time {
    color: #73798f;

    font-size: 12px;
}

.feedback-message {
    white-space: pre-wrap;
    word-break: break-word;
    color: #d7d9e5;
    line-height: 1.55;
}
.feedback-reply-box{margin-top:15px;padding:14px;border:1px solid rgba(129,140,248,.22);border-radius:12px;background:rgba(99,102,241,.06)}
.feedback-reply-box label{display:block;margin:0 0 7px;color:#c4b5fd;font-size:12px;font-weight:800}
.feedback-reply-box textarea{display:block;width:100%;min-height:76px;resize:vertical;box-sizing:border-box;padding:10px 11px;border:1px solid rgba(255,255,255,.12);border-radius:9px;background:#080b1b;color:#fff;font:inherit;line-height:1.5}
.feedback-reply-box textarea:focus{outline:none;border-color:#818cf8}
.feedback-reply-current{margin:0 0 10px;padding:10px;border-radius:9px;background:rgba(255,255,255,.04);color:#c9cbea;white-space:pre-wrap;overflow-wrap:anywhere}
.feedback-reply-current:empty{display:none}
.feedback-reply-status{min-height:15px;margin-top:7px;color:#a5b4fc;font-size:12px}

.actions {
    display: flex;
    gap: 8px;

    margin-top: 14px;
}

button {
    border: 1px solid rgba(255,255,255,.1);

    border-radius: 9px;

    padding: 9px 13px;

    color: white;

    background: rgba(255,255,255,.08);

    cursor: pointer;

    font-weight: 700;
}

button:hover {
    background: rgba(99,102,241,.2);
}

.delete {
    background: rgba(239,68,68,.12);

    border-color:
        rgba(239,68,68,.25);
}

.delete:hover {
    background: rgba(239,68,68,.25);
}

.empty {
    padding: 35px;

    text-align: center;

    color: #73798f;
}

#loading {
    text-align: center;

    padding: 60px;

    color: #a78bfa;
}

#error {
    display: none;

    text-align: center;

    padding: 60px;

    color: #ef4444;
}

@media (max-width: 650px) {

    body {
        padding: 15px;
    }

    header {
        align-items: flex-start;
        flex-direction: column;
    }

    .feedback-top {
        flex-direction: column;
        gap: 5px;
    }

}

</style>

<script src="auth-guard.js" data-require-auth="true"></script>
  <script src="nav.js" defer></script>

<script src="search-autofill-fix.js" defer></script>

<style id="DOUGHUB_PAGE_REDESIGN_INLINE">

/* Inline, page-owned DougHub redesign */
:root{color-scheme:dark;--dh-line:rgba(177,184,255,.16);--dh-indigo:#6366f1;--dh-purple:#a855f7}
body{color:#f5f6ff;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit}
input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=file]):not([type=color]),textarea,select{color:#f5f6ff;background:#070918;border:1px solid var(--dh-line);border-radius:11px}
input::placeholder,textarea::placeholder{color:#858cab}
input:focus,textarea:focus,select:focus{outline:none;border-color:#818cf1;box-shadow:0 0 0 3px #6366f126}
button:focus-visible,a:focus-visible{outline:2px solid #a5b4fc;outline-offset:3px}


body{background:radial-gradient(circle at 10% 0,#17133b,transparent 34%),radial-gradient(circle at 90% 5%,#25104b,transparent 30%),#02040a}
.container{max-width:1100px}
header{background:rgba(4,5,15,.78);border-bottom:1px solid var(--dh-line);backdrop-filter:blur(18px)}
.logo{letter-spacing:-.05em}
.card{background:linear-gradient(145deg,rgba(17,22,49,.94),rgba(8,10,25,.9));border:1px solid var(--dh-line);border-radius:21px;box-shadow:0 18px 48px #0003}
.subtitle,.time{color:#a4a7c4}
.feedback-top{border-bottom:1px solid var(--dh-line)}
.feedback-message{background:#ffffff04;border:1px solid #ffffff0b;border-radius:14px}
.feedback-reply-box{background:#070918;border:1px solid var(--dh-line);border-radius:15px}
.save-reply{background:linear-gradient(135deg,#6366f1,#a855f7);border:1px solid #c4b5fd55;color:white}
.delete{background:#ef444418;border:1px solid #ef444455;color:#fecaca;border-radius:11px}

</style>
</head>


<body>


<div class="container">


<header>

    <div>

        <div class="logo">
            Doug<span>Hub</span> Inbox
        </div>

        <div class="subtitle">
            Feedback from the DougHub community
        </div>

    </div>


    <a
        class="back"
        href="index.html"
    >
        ← DougHub
    </a>

</header>


<div id="loading">
    Checking admin permissions...
</div>


<div id="error">
    Access denied. Admins only.
</div>


<div
    id="inboxContent"
    style="display:none;"
>


    <div class="card">

        <h2>
            💬 Feedback
        </h2>

        <div
            class="status"
            id="feedbackStatus"
        >
            Loading feedback...
        </div>

        <div id="feedbackList"></div>

    </div>


</div>


</div>


<script>

const SUPABASE_URL =
    "https://agsqdqcsmsppcdqxlppj.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_Oq1WvEHgoHcjmCBGbEnoYQ_BqYA1p52";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const loading =
    document.getElementById("loading");

const errorEl =
    document.getElementById("error");

const inboxContent =
    document.getElementById("inboxContent");

const feedbackList =
    document.getElementById("feedbackList");

const feedbackStatus =
    document.getElementById("feedbackStatus");


function escapeHtml(value) {

    const div =
        document.createElement("div");

    div.textContent =
        value ?? "";

    return div.innerHTML;
}


function formatTime(value) {

    return new Date(value)
        .toLocaleString();

}


async function checkAdmin() {

    const {
        data: {
            user
        }
    } =
        await supabaseClient.auth.getUser();


    if (!user) {

        window.location.href =
            "log-in.html?redirect=inbox.html";

        return false;
    }


    const {
        data: profile,
        error
    } =
        await supabaseClient
            .from("profiles")
            .select("is_admin")
            .eq("id", user.id)
            .maybeSingle();


    if (
        error ||
        !profile ||
        profile.is_admin !== true
    ) {

        loading.style.display =
            "none";

        errorEl.style.display =
            "block";

        return false;
    }


    loading.style.display =
        "none";

    inboxContent.style.display =
        "block";


    return true;
}


async function loadFeedback() {

    const {
        data,
        error
    } =
        await supabaseClient
            .from("feedback")
            .select(
                "id,user_id,username,message,created_at,admin_reply,admin_replied_at"
            )
            .order(
                "created_at",
                {
                    ascending: false
                }
            );


    if (error) {

        console.error(error);

        feedbackStatus.textContent =
            "Could not load feedback.";

        return;
    }


    feedbackStatus.textContent =
        `${data.length} feedback message${
            data.length === 1
                ? ""
                : "s"
        }`;


    if (!data.length) {

        feedbackList.innerHTML =
            `
            <div class="empty">
                No feedback yet.
            </div>
            `;

        return;
    }


    feedbackList.innerHTML = "";


    data.forEach(item => {

        const element =
            document.createElement("div");

        element.className =
            "feedback";


        element.innerHTML = `

            <div class="feedback-top">

                <span class="username">
                    @${escapeHtml(
                        item.username ||
                        "Unknown User"
                    )}
                </span>

                <span class="time">
                    ${formatTime(
                        item.created_at
                    )}
                </span>

            </div>


            <div class="feedback-message">
                ${escapeHtml(
                    item.message
                )}
            </div>


            <div class="feedback-reply-box">
                <label for="feedbackReply-${item.id}">Reply to this message</label>
                <div class="feedback-reply-current">${item.admin_reply ? "Previous reply: " + escapeHtml(item.admin_reply) : ""}</div>
                <textarea id="feedbackReply-${item.id}" maxlength="2000" placeholder="Write a reply the user can see on DougHub…">${escapeHtml(item.admin_reply || "")}</textarea>
                <div class="actions">
                    <button class="save-reply" type="button">💬 Save reply</button>
                    <button class="delete" type="button">🗑️ Delete</button>
                </div>
                <div class="feedback-reply-status" aria-live="polite"></div>
            </div>

        `;


        feedbackList.appendChild(element);

        const replyButton = element.querySelector(".save-reply");
        const deleteButton = element.querySelector(".delete");
        replyButton.addEventListener("click", () => saveFeedbackReply(item.id, element));
        deleteButton.addEventListener("click", () => deleteFeedback(item.id));

    });

}


async function saveFeedbackReply(id, element) {
    const textarea = element.querySelector("textarea");
    const status = element.querySelector(".feedback-reply-status");
    const reply = textarea.value.trim();
    const { data: { user } } = await supabaseClient.auth.getUser();
    if (!user) {
        status.textContent = "Your admin session expired. Please sign in again.";
        return;
    }
    if (reply.length > 2000) {
        status.textContent = "Replies must be 2,000 characters or fewer.";
        return;
    }

    const button = element.querySelector(".save-reply");
    button.disabled = true;
    button.textContent = "Saving…";
    status.textContent = "";
    const { error } = await supabaseClient
        .from("feedback")
        .update({
            admin_reply: reply || null,
            admin_replied_at: reply ? new Date().toISOString() : null,
            admin_replied_by: reply ? user.id : null
        })
        .eq("id", id);

    button.disabled = false;
    button.textContent = "💬 Save reply";
    if (error) {
        console.error("Could not save feedback reply:", error);
        status.textContent = "Could not save the reply. Check the console for details.";
        return;
    }
    const previousReply = element.querySelector(".feedback-reply-current");
    previousReply.textContent = reply ? "Previous reply: " + reply : "";
    status.textContent = reply ? "Reply saved. The user can see it on DougHub." : "Reply cleared.";
}


async function deleteFeedback(id) {
    const {
        error
    } =
        await supabaseClient
            .from("feedback")
            .delete()
            .eq("id", id);


    if (error) {

        console.error(error);

        alert(
            "Could not delete feedback."
        );

        return;
    }


    await loadFeedback();

}


async function start() {

    const allowed =
        await checkAdmin();


    if (!allowed) {
        return;
    }


    await loadFeedback();

}


start();

</script>


</body>
</html>
