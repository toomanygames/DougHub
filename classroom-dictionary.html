<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dictionary • DougHub Classroom</title><link rel="stylesheet" href="classroom.css"><link rel="icon" href="DougHub.svg">
<link rel="stylesheet" href="classroom-unified.css?v=1">
<script src="classroom-unified.js?v=1" defer></script>
</head><body><div class="shell"><header class="topbar"><a class="brand" href="community-classroom.html"><span class="brand-mark">D</span><span>DougHub <small>CLASSROOM</small></span></a><nav class="classroom-top-links" aria-label="Classroom navigation"><a href="community-classroom.html">Home</a><a href="classroom.html">My Class</a><a href="class-chat.html">Class Chat</a><a href="classroom-dms.html">Chat &amp; DMs</a><a href="classroom-community.html">Community</a><a href="classroom-games.html">Games</a><a href="classroom-create.html">Create</a><a href="classroom-dictionary.html">Dictionary</a><a href="classroom-tools.html">Student Tools</a><a href="classroom-settings.html">Settings</a></nav></header><section class="hero"><div class="hero-inner"><div class="eyebrow">WORD STUDIO</div><h1>Find the right words.</h1><p>Look up a word, understand its meaning, and explore related words.</p></div></section><main style="max-width:900px;margin:20px auto 40px"><section class="panel"><form id="lookup" style="display:flex;gap:9px;flex-wrap:wrap"><input id="word" maxlength="60" required placeholder="Type a word…" style="flex:1;min-width:180px;padding:13px;border:1px solid #e5e6f2;border-radius:12px"><button class="btn">Look it up</button></form><div id="result" class="tool-result" style="margin-top:16px">Your definition will appear here.</div></section></main></div><script>document.getElementById("lookup").addEventListener("submit",async e=>{e.preventDefault();const w=document.getElementById("word").value.trim();const out=document.getElementById("result");out.textContent="Searching…";try{const r=await fetch("https://api.dictionaryapi.dev/api/v2/entries/en/"+encodeURIComponent(w));if(!r.ok)throw Error("No definition found for that word.");const d=await r.json(),entry=d[0],meanings=entry.meanings||[];out.innerHTML="<h2>"+entry.word.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))+"</h2>"+meanings.slice(0,5).map(m=>"<p><strong>"+m.partOfSpeech+"</strong></p>"+m.definitions.slice(0,3).map(x=>"<p>"+x.definition.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))+"</p>").join("")).join("");}catch(err){out.textContent=err.message;}});</script></body></html>
