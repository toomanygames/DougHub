<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DougCode</title><link rel="icon" href="DougHub.svg"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#02040a;color:#fff;font-family:Arial,sans-serif}header{height:70px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;background:#080a16;border-bottom:1px solid #20233b;position:sticky;top:0;z-index:5}a{color:inherit;text-decoration:none}.brand{font-size:21px;font-weight:900}.brand span{color:#a78bfa}.nav{display:flex;gap:16px;color:#aaa9bb;font-size:13px;font-weight:800}.code-back{padding:9px 13px;border:1px solid rgba(129,140,248,.28);border-radius:11px;background:rgba(99,102,241,.1);font-size:13px;font-weight:800;color:#d7d5ff}.code-back:hover{background:rgba(99,102,241,.2);transform:translateY(-1px)}.wrap{width:min(1400px,calc(100% - 28px));margin:auto}.top{padding:28px 0 18px;display:flex;justify-content:space-between;gap:12px;align-items:end}.top h1{margin:0;font-size:38px}.top p{margin:6px 0 0;color:#8d8c9e}.buttons{display:flex;gap:8px;flex-wrap:wrap}button{padding:10px 13px;border-radius:10px;border:1px solid #2b2e48;background:#101329;color:#fff;font-weight:800;cursor:pointer}.primary{background:linear-gradient(135deg,#6366f1,#8b5cf6);border:0}.layout{display:grid;grid-template-columns:1.25fr .75fr;gap:18px;padding-bottom:40px}.panel{border:1px solid #242740;border-radius:18px;background:#0d1127;overflow:hidden}.head{padding:13px 15px;border-bottom:1px solid #242740;display:flex;justify-content:space-between;align-items:center}.tabs{display:flex;gap:5px}.tab{padding:7px 9px;background:transparent;border-color:transparent;color:#888798}.tab.active{background:#27255a;color:#fff}.editor{display:none;width:100%;height:430px;resize:vertical;border:0;outline:0;padding:16px;background:#070912;color:#e8e8f5;font:13px/1.55 Consolas,monospace}.editor.active{display:block}.preview{width:100%;height:430px;border:0;background:#fff}.side{display:flex;flex-direction:column;gap:18px}.card{padding:16px}.card h2{margin:0 0 12px;font-size:17px}.field{margin-bottom:12px}.field label{display:block;color:#9998aa;font-size:12px;font-weight:800;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:10px;border-radius:9px;border:1px solid #292c46;background:#080a15;color:#fff;outline:0}.field textarea{min-height:80px;resize:vertical}.check{display:flex;gap:8px;align-items:center;color:#aaa9bb;font-size:13px;margin:9px 0}.list{display:grid;gap:9px;max-height:390px;overflow:auto}.project{padding:12px;border:1px solid #242740;border-radius:12px;background:#11152b;cursor:pointer}.project:hover{border-color:#6366f1}.project h3{margin:0 0 5px;font-size:15px}.project p{margin:0;color:#858494;font-size:12px}.meta{margin-top:7px;color:#666779;font-size:11px}.status{color:#89889a;font-size:12px;margin-top:8px}.notice{padding:10px;border-radius:10px;background:#16193a;color:#aaa9bb;font-size:12px;line-height:1.5}@media(max-width:900px){.layout{grid-template-columns:1fr}.side{order:-1}}@media(max-width:600px){.top{align-items:flex-start;flex-direction:column}.top h1{font-size:30px}.nav a:nth-child(n+3){display:none}.editor,.preview{height:350px}}</style><style id="doughub-polish">
/* DougHub visual polish — layout and functionality intentionally preserved */
:root{--dh-indigo:#6366f1;--dh-purple:#a855f7;--dh-panel:rgba(13,17,39,.76);--dh-line:rgba(255,255,255,.09);--dh-soft:rgba(255,255,255,.055)}
html{background:#02040a}
body{background-image:radial-gradient(circle at 12% 0%,rgba(99,102,241,.13),transparent 32%),radial-gradient(circle at 88% 8%,rgba(168,85,247,.12),transparent 30%),radial-gradient(circle at 50% 100%,rgba(99,102,241,.06),transparent 38%)}
button,.service-button,.go,.back,.back-button,.primary,.nav a{transition:transform .18s ease,background .18s ease,border-color .18s ease,box-shadow .18s ease,filter .18s ease}
button:hover,.service-button:hover,.go:hover,.back:hover,.back-button:hover{box-shadow:0 10px 28px rgba(0,0,0,.18)}
input,textarea,select{transition:border-color .18s ease,box-shadow .18s ease,background .18s ease}
input:focus,textarea:focus,select:focus{box-shadow:0 0 0 3px rgba(99,102,241,.12)}
.card,.panel,.tool,.service-row,.game-card,.community-card,.settings-card,.settings-section,.feature-overview,.douggames-overview,.feedback-card,.hero-card{box-shadow:0 18px 55px rgba(0,0,0,.18),inset 0 1px rgba(255,255,255,.035)}
.card:hover,.tool:hover,.game-card:hover,.community-card:hover{box-shadow:0 24px 65px rgba(0,0,0,.24),inset 0 1px rgba(255,255,255,.045)}
.hero-card{isolation:isolate}
.hero-card:after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:linear-gradient(120deg,rgba(255,255,255,.035),transparent 32%,transparent 70%,rgba(168,85,247,.035));z-index:-1}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:rgba(255,255,255,.025)}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#6366f1,#a855f7);border-radius:999px;border:2px solid rgba(2,4,10,.55)}
::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,#818cf8,#c084fc)}
@media(max-width:700px){body{background-image:radial-gradient(circle at 50% 0%,rgba(99,102,241,.14),transparent 38%),#02040a}}
</style></head><body><header><a class="brand" href="work.html">Doug<span>Code</span></a><nav class="nav"></nav></header><main class="wrap"><div class="top"><div><h1>DougCode</h1><p>Build, test and share browser projects.</p></div><div class="buttons"><button onclick="newProject()">＋ New</button><button class="primary" onclick="saveProject()">💾 Save</button></div></div><div class="layout"><section><div class="panel"><div class="head"><b>Editor</b><div class="tabs"><button class="tab active" data-t="html" onclick="tab('html')">HTML</button><button class="tab" data-t="css" onclick="tab('css')">CSS</button><button class="tab" data-t="js" onclick="tab('js')">JavaScript</button></div></div><textarea id="html" class="editor active" spellcheck="false"><h1>Hello from DougHub Code!</h1><p>Edit me, then run the preview.</p><button onclick="hello()">Test</button></textarea><textarea id="css" class="editor" spellcheck="false">body{font-family:Arial;text-align:center;padding:50px;background:#111;color:white}</textarea><textarea id="js" class="editor" spellcheck="false">function hello(){alert('It works!')}</textarea></div><div class="panel" style="margin-top:18px"><div class="head"><b>Live Preview</b><button class="primary" onclick="run()">▶ Run</button></div><iframe id="preview" class="preview" sandbox="allow-scripts allow-forms allow-modals"></iframe></div></section><aside class="side"><div class="panel card"><h2>Project settings</h2><div class="field"><label>Title</label><input id="title" maxlength="100" placeholder="My project"></div><div class="field"><label>Description</label><textarea id="desc" maxlength="500" placeholder="What did you make?"></textarea></div><div class="field"><label>Visibility</label><select id="visibility"><option value="public">Public</option><option value="private">Private</option></select></div><label class="check"><input id="copy" type="checkbox"> Allow code copying</label><label class="check"><input id="dl" type="checkbox"> Allow project download</label><div class="notice">Public projects can be opened and tested by anyone. Copying and downloads only appear when the owner allows them.</div><div id="status" class="status"></div></div><div class="panel card"><h2>Shared projects</h2><div id="shared" class="list"><div class="status">Loading...</div></div></div><div class="panel card"><h2>My projects</h2><div id="mine" class="list"><div class="status">Loading...</div></div></div></aside></div></main><script>
const SUPABASE_URL="https://agsqdqcsmsppcdqxlppj.supabase.co",KEY="sb_publishable_Oq1WvEHgoHcjmCBGbEnoYQ_BqYA1p52";let db=null,user=null,current=null;function initSupabase(){if(!window.supabase||typeof window.supabase.createClient!=="function"){setStatus("DougCode could not load its account service. Please refresh the page.",true);return false}try{db=window.supabase.createClient(SUPABASE_URL,KEY);return true}catch(e){console.error(e);setStatus("DougCode could not start. Please refresh the page.",true);return false}}function setStatus(m,e=false){const x=document.getElementById("status");if(x){x.textContent=m;x.style.color=e?"#ff8b8b":"#89889a"}}
const $=id=>document.getElementById(id);
function tab(n){document.querySelectorAll(".editor").forEach(e=>e.classList.toggle("active",e.id===n));document.querySelectorAll(".tab").forEach(e=>e.classList.toggle("active",e.dataset.t===n))}
function run(){const src="<!doctype html><html><head><style>"+$("css").value.replace(/<\/style/gi,"")+"</style></head><body>"+$("html").value+"<script>"+$("js").value.replace(/<\/script/gi,"")+"<\\/script></body></html>";$("preview").srcdoc=src}
function newProject(){current=null;$("title").value="";$("desc").value="";$("visibility").value="public";$("copy").checked=false;$("dl").checked=false;$("html").value="<h1>My DougHub App</h1><p>Build something cool.</p>";$("css").value="body{font-family:Arial;background:#111;color:white;text-align:center;padding:50px}";$("js").value="";$("status").textContent="New project.";run()}
async function init(){if(!initSupabase()){run();return}try{const {data:{session},error}=await db.auth.getSession();if(error)throw error;user=session?.user||null;run();await loadShared();await loadMine();const id=new URLSearchParams(location.hash.replace(/^#/,"")).get("project");if(id){const {data}=await db.from("code_projects").select("*").eq("id",id).eq("visibility","public").maybeSingle();if(data)open(data)}}catch(e){console.error("DougCode startup error:",e);setStatus("DougCode could not load your projects. Please refresh the page.",true);run()}}
async function loadShared(){const {data,error}=await db.from("code_projects").select("*").eq("visibility","public").order("updated_at",{ascending:false});render($("shared"),error?[]:data||[])}
async function loadMine(){if(!user){$("mine").innerHTML="<div class='status'>Sign in to create projects.</div>";return}const {data,error}=await db.from("code_projects").select("*").eq("owner_id",user.id).order("updated_at",{ascending:false});render($("mine"),error?[]:data||[])}
async function render(el,items){el.innerHTML="";if(!items.length){el.innerHTML="<div class='status'>No projects.</div>";return}items.forEach(p=>{const d=document.createElement("div");d.className="project";d.innerHTML="<h3>"+safe(p.title)+"</h3><p>"+safe(p.description||"No description.")+"</p><div class='meta'>"+(p.visibility==="private"?"Private":"Public")+"</div>";d.onclick=()=>open(p);el.appendChild(d)})}
function safe(v){return String(v??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function open(p){current=p;$("title").value=p.title;$("desc").value=p.description||"";$("visibility").value=p.visibility;$("copy").checked=p.allow_copy;$("dl").checked=p.allow_download;$("html").value=p.html_code;$("css").value=p.css_code;$("js").value=p.js_code;$("status").textContent="Loaded "+p.title;run();showPermissions(p)}
function showPermissions(p){let box=document.getElementById("permissions");if(box)box.remove();if(!p)return;box=document.createElement("div");box.id="permissions";box.className="buttons";if(p.allow_copy||p.owner_id===user?.id){const b=document.createElement("button");b.textContent="Copy code";b.onclick=()=>navigator.clipboard.writeText($("html").value+"\n\n/* CSS */\n"+$("css").value+"\n\n/* JavaScript */\n"+$("js").value);box.appendChild(b)}if(p.visibility==="public"){const b=document.createElement("button");b.textContent="Share link";b.onclick=async()=>{await navigator.clipboard.writeText(location.origin+location.pathname+"#project="+p.id);$("status").textContent="Share link copied.";};box.appendChild(b)}if(p.allow_download||p.owner_id===user?.id){const b=document.createElement("button");b.textContent="Save project file";b.onclick=()=>{const blob=new Blob([JSON.stringify({title:p.title,html:$("html").value,css:$("css").value,js:$("js").value},null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=p.title.replace(/[^a-z0-9_-]/gi,"_")+".json";a.click()};box.appendChild(b)}$("status").after(box)}
async function saveProject(){if(!user){location.href="log-in.html?redirect=dougcode.html&from=work";return}const payload={owner_id:user.id,title:$("title").value.trim(),description:$("desc").value.trim(),visibility:$("visibility").value,allow_copy:$("copy").checked,allow_download:$("dl").checked,html_code:$("html").value,css_code:$("css").value,js_code:$("js").value};if(!payload.title){$("status").textContent="Add a title.";return}let q=current&&current.owner_id===user.id?db.from("code_projects").update(payload).eq("id",current.id):db.from("code_projects").insert(payload);const {data,error}=await q.select().single();if(error){$("status").textContent=error.message;return}current=data;$("status").textContent="Saved.";showPermissions(data);await loadShared();await loadMine()}
init();
</script></body></html>
